<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fixture shop — checkout</title>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <form id="checkout" aria-label="checkout form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <button id="place-order" type="submit">Place order</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script>
    document.getElementById('checkout').addEventListener('submit', function (event) {
      event.preventDefault();
      // Controlled UI regression: submit handler no longer sets the
      // confirmation text, so "Order confirmed" never appears.
      document.getElementById('status').textContent = '';
    });
  </script>
</body>
</html>
