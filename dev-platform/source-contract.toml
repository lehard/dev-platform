# Public part of this repository's source contract.
#
# The installed `.dev-platform.toml` is excluded from Git because it also carries
# operator-only sections ([operator], [development_backlog], [private_lineage]).
# A clean CI checkout therefore has no contract; the publication queue workflow
# installs this file as `.dev-platform.toml` before its coordinator preflight.
# Keep these values identical to the installed contract's matching keys.
schema_version = 2
platform_version = "source"
platform_ci_ref = "source"
project_name = "dev-platform"
project_slug = "dev-platform"
main_branch = "main"
workflow_profile = "multi-agent"
harness_mode = "platform"
protected_main = true
publish_mode = "pr"
pr_merge_mode = "auto"
scm_provider = "github"

[paths]
worktrees = ".claude/worktrees"
agent_board = ".claude/agents-board.json"
main_merge_lock = ".claude/main-merge.lock"
pending_worktrees = ".claude/pending-worktrees.md"
pending_completed_worktree_cleanup = ".claude/pending-completed-worktree-cleanup.json"
friction_log = ".claude/agent-friction.jsonl"
friction_state = ".claude/agent-friction-state.json"
friction_reports = ".claude/reports/process-improvement"
checks = "dev-platform/checks.toml"
