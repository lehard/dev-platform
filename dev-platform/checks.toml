[settings]
full_commands = [
  "python3 -m compileall -q template/scripts scripts",
  "python3 scripts/managed_projects.py validate",
  "python3 -m unittest discover -s tests -v",
]
full_evidence_types = ["syntax", "configuration", "test"]
full_required_evidence_types = ["test"]
full_trigger_patterns = [
  ".dev-platform.toml",
  "dev-platform/checks.toml",
  ".github/workflows/**",
  "template/**",
  "scripts/**",
  "tests/**",
  "openspec/**",
  "AGENTS.md",
]

[checks.docs]
patterns = ["*.md", "docs/**", "openspec/**", "AGENTS.md"]
commands = ["git diff --check"]

[checks.python]
patterns = ["**/*.py"]
commands = ["python3 -m compileall -q template/scripts scripts", "python3 -m unittest discover -s tests -v"]
evidence_types = ["syntax", "test"]
required_evidence_types = ["test"]
