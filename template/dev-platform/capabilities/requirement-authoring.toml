[capability]
id = "requirement-authoring"
name = "Requirement authoring"
description = "Write or materially change a Business Requirement as a self-contained current product contract that keeps accepted details and references, drops obsolete history, and asks only about unresolved material product choices."
kind = "instruction-only"
applicability = "Fixing accepted work as a Business Requirement (зафиксируй / добавь в бэклог / создай задачу) or materially changing an existing Requirement body; not quick tasks, technical managed tasks, OpenSpec authoring or implementation."
invocation = "auto+explicit"
visibility = "project"
owner = "dev-platform"
safety_boundary = "Instruction-only author discipline; reads only the conversation and materials the user provided, creates no storage, gate, status, validator, approval, interview or per-project setting, never changes the Requirement format, routing, labels or children block, and never starts implementation."
