# Project-owned record of temporary local hotfixes to hotfixable platform-owned files.
#
# This file is created once and is never overwritten by a Copier update. It is
# read by scripts/platform_divergence.py. An empty file (no [[hotfix]] entry)
# declares that no platform-owned file is patched locally.
#
# A hotfix is a temporary divergence from the installed platform release. It is not
# an official release and expires on the next platform update: after the update the
# entry is reported stale until a human or agent re-evaluates it and removes or
# re-issues it. See docs/engineering/change-classes.md for the whole flow.
#
# Each entry has exactly these fields; a missing or unknown field is an error:
#
#   [[hotfix]]
#   path = "scripts/example.py"         # a hotfixable platform-owned file (never a protected one)
#   platform_version = "1.9.5"          # .dev-platform.toml platform_version the patch was made against
#   patched_sha256 = "<64 hex>"         # sha256 of the patched file as committed
#   defect = "one-line summary of the reproducible defect"
#   regression_test = "tests/test_example_hotfix.py"   # an existing test that fails without the patch
#   friction_event = "0123456789ab"     # agent_friction.py event id that reported the defect upstream
#   temporary = true                    # must be true: the divergence is temporary, not a release
