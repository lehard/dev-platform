# Protected surface of the Dev Platform downstream contract.
#
# This file is platform-owned. It is shipped only by immutable platform releases
# (Copier render and update) and is never edited in a downstream project: neither
# the protected list nor the hotfixable list may be changed locally, and an agent
# must never reclassify a file or rule on its own assumption.
#
# Every plain-copied platform-owned file is either matched by a `[[protected]]`
# glob or listed in `hotfixable`. There is no default class: a platform file that
# is neither is a platform validation failure. See docs/engineering/change-classes.md.
#
# Paths are project-root-relative rendered paths. In a glob, `*` and `?` do not
# cross `/`; `**` does.

# Plain-copied platform-owned files that are not protected rules. Each entry is an explicit path.
