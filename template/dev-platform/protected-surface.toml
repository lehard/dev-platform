[categories]
independent-review = "Review evidence and the review gate must come from an independent, platform-observed reviewer, never from the implementing agent."
protected-publication = "Work reaches the integration branch only through the protected publication path, its required checks and its exact-head binding."
worktree-isolation = "An agent works only in its own worktree and never touches, takes over or cleans up another agent's state."
credentials = "Publication and repository credentials are never exposed to agent, project-check or delegated processes."
routing-provenance-evidence = "Routing decisions, task and lineage identity and verification evidence stay authentic and bound to exact content."
git-history = "Shared Git history is never rewritten, and the guards that keep integration state clean stay in force."
immutable-releases = "Release refs and the platform contract (including this surface) arrive only through immutable releases and are never edited downstream."

