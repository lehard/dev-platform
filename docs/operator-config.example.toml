# Keep this file outside the public Dev Platform source tree. Enable the
# operator layer in the project `.dev-platform.toml` with
# `[operator] enabled = true` and either `config_path = "/absolute/path"` or
# `config_env = "DEV_PLATFORM_OPERATOR_CONFIG"`. The environment variable is
# ignored until that explicit project opt-in exists.

[development_backlog]
repository = "your-org/development-backlog"
project_label = "project:your-project"
default_priority = "P2"
project_owner = "your-org"
project_number = 1

[promotion]
repo = "your-org/dev-platform"

[process_health]
process_label = "process"
managed_label = "process:managed"

[rollout]
registry_path = "/secure/operator/managed-projects.json"
bot_login = "your-platform-bot[bot]"
