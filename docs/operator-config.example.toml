# Keep this file outside the public Dev Platform source tree. Enable the
# operator layer in the project `.dev-platform.toml` with
# `[operator] enabled = true` and either `config_path = "/absolute/path"` or
# `config_env = "DEV_PLATFORM_OPERATOR_CONFIG"`. The environment variable is
# ignored until that explicit project opt-in exists.

# Never add [development_backlog] here. Development Backlog identity
# (repository, project_label, default_priority, project_owner, project_number)
# belongs to each project's own `.dev-platform.toml`; one shared operator file
# serves several projects and must not relabel their Requirements. Operator
# tooling rejects the section, and a project read fails if it differs.

[promotion]
repo = "your-org/dev-platform"

[process_health]
process_label = "process"
managed_label = "process:managed"

[rollout]
# A local clone of the private operator repository (see docs/managed-rollout.md
# "CI resolution: a private operator repository") works here too, e.g.
# "/path/to/dev-platform-operator/managed-projects.json" -- any filesystem
# path is accepted, this file is never resolved as a public-repo path.
registry_path = "/secure/operator/managed-projects.json"
bot_login = "your-platform-bot[bot]"
