name: Platform Explorer

# Orchestration only: every build and validation step lives in
# scripts/build_explorer.py. See docs/engineering/explorer.md ("Publication").
on:
  pull_request:
    paths:
      - "explorer/**"
      - "scripts/build_explorer.py"
      - "scripts/public_distribution.py"
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - "openspec/specs/**"
      - "dev-platform/capabilities/**"
      - "VERSION"
      - ".github/workflows/explorer.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: "explorer-build-${{ github.event.pull_request.number || github.ref }}"
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Build Explorer
        run: python3 scripts/build_explorer.py build --out build/explorer

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/explorer

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # configure-pages accepts an existing branch-built site, so the Pages
      # source is required explicitly; a missing site fails the API call.
      - name: Require the GitHub Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          build_type="$(gh api "repos/${REPOSITORY}/pages" --jq .build_type)"
          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages source is '${build_type}', not GitHub Actions. Set Settings -> Pages -> Source: GitHub Actions."
            exit 1
          fi

      # Deliberately no inputs: the workflow never changes repository settings.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
