name: Publish Platform Version

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Create immutable-by-policy tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be SemVer X.Y.Z; got: $version" >&2
            exit 1
          fi
          tag="v$version"
          git fetch --tags origin
          existing="$(git rev-parse -q --verify "refs/tags/$tag" || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "Refusing to move existing tag $tag from $existing to $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$tag" --notes "Developer Platform $tag"
          fi
