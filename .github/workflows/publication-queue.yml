name: Dev Platform publication queue

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-platform-final-publication
  cancel-in-progress: false

jobs:
  publish-next:
    if: github.event_name != 'pull_request' || github.event.label.name == 'publication:queued'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.DEV_PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_PLATFORM_APP_PRIVATE_KEY }}
      - name: Process next admitted PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/publication_queue.py worker
