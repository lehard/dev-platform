name: Platform CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: light
            publish_mode: direct
          - profile: standard
            publish_mode: pr
          - profile: multi-agent
            publish_mode: pr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compile shared scripts
        run: python3 -m compileall -q template/scripts

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Install tested Copier
        run: python3 -m pip install "copier==9.17.0"

      - name: Render factory profile
        run: |
          target="/tmp/dev-platform-${{ matrix.profile }}"
          rm -rf "$target"
          copier copy --trust --defaults \
            --data project_name="Smoke ${{ matrix.profile }}" \
            --data project_slug="smoke-${{ matrix.profile }}" \
            --data project_description="Factory smoke test" \
            --data workflow_profile="${{ matrix.profile }}" \
            --data publish_mode="${{ matrix.publish_mode }}" \
            --data platform_ci_ref="b4a95a26c7caf14dd5b0d44da0237dcd70bf8715" \
            . "$target"
          python3 -m compileall -q "$target/scripts"
          cd "$target"
          python3 scripts/platform_doctor.py
          if grep -R "project-ci.yml@main" .github/workflows; then
            echo "Downstream CI must not track @main" >&2
            exit 1
          fi

      - name: Smoke-test Copier upgrade path
        run: python3 tests/upgrade_smoke.py --profile "${{ matrix.profile }}" --publish-mode "${{ matrix.publish_mode }}"
