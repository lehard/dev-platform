name: Platform CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile shared scripts
        run: python3 -m compileall -q template/scripts

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Install Copier
        run: python3 -m pip install "copier>=9.4,<10"

      - name: Render factory
        run: |
          rm -rf /tmp/dev-platform-smoke
          copier copy --trust --defaults \
            --data project_name="Smoke Project" \
            --data project_slug="smoke-project" \
            --data project_description="Factory smoke test" \
            . /tmp/dev-platform-smoke

      - name: Compile rendered scripts
        run: python3 -m compileall -q /tmp/dev-platform-smoke/scripts
