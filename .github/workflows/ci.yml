name: Platform CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: light
            publish_mode: direct
          - profile: standard
            publish_mode: pr
          - profile: multi-agent
            publish_mode: pr
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.19.0"
          package-manager-cache: false

      - name: Compile shared scripts
        run: python3 -m compileall -q template/scripts scripts

      - name: Validate managed project registry
        run: python3 scripts/managed_projects.py validate

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Enforce OpenSpec lifecycle hygiene
        run: python3 template/scripts/openspec_lifecycle.py check

      - name: Strict-validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.6.0 validate --all --strict --no-interactive

      - name: Install tested Copier
        run: python3 -m pip install "copier==9.17.0"

      - name: Render factory profile
        run: |
          target="/tmp/dev-platform-${{ matrix.profile }}"
          rm -rf "$target"
          copier copy --trust --defaults \
            --data project_name="Smoke ${{ matrix.profile }}" \
            --data project_slug="smoke-${{ matrix.profile }}" \
            --data project_description="Factory smoke test" \
            --data workflow_profile="${{ matrix.profile }}" \
            --data harness_mode="platform" \
            --data publish_mode="${{ matrix.publish_mode }}" \
            --data platform_ci_ref="dab74494c9a6ad9a77d99e73bb36774a6d42350d" \
            . "$target"
          python3 -m compileall -q "$target/scripts"
          cd "$target"
          python3 scripts/platform_doctor.py
          test -f .github/workflows/dev-platform.yml
          if grep -R "project-ci.yml@main" .github/workflows; then
            echo "Downstream CI must not track @main" >&2
            exit 1
          fi

      - name: Smoke-test Copier upgrade path
        run: python3 tests/upgrade_smoke.py --profile "${{ matrix.profile }}" --publish-mode "${{ matrix.publish_mode }}"

      - name: Smoke-test mature project harness adoption
        if: matrix.profile == 'multi-agent'
        run: python3 tests/project_harness_adoption_smoke.py
