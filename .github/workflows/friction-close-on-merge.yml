name: Close fixed friction records

# Orchestration only: all behavior lives in scripts/agent_friction.py close-fixed.
# A merged PR closes only the friction issues it names with `Fixes-Friction:` lines.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-fixed:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Close referenced friction issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/agent_friction.py close-fixed --pr "$PR_NUMBER" --repo "$REPOSITORY"
