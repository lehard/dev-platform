_min_copier_version: "9.4.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_skip_if_exists:
  - docs/engineering/project-rules.md
_tasks:
  - command: ["{{ _copier_python }}", "scripts/platform_bootstrap.py"]

project_name:
  type: str
  help: Human-readable project name

project_slug:
  type: str
  help: Repository/project slug
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: One-line project description
  default: ""

main_branch:
  type: str
  help: Default integration branch
  default: main

workflow_profile:
  type: str
  help: Development workflow complexity
  choices:
    - light
    - standard
    - multi-agent
  default: standard

publish_mode:
  type: str
  help: How completed work reaches GitHub (PR is safer; direct is for intentionally simple repos)
  choices:
    - pr
    - direct
  default: "{{ 'direct' if workflow_profile == 'light' else 'pr' }}"
  validator: "{% if workflow_profile == 'light' and publish_mode == 'pr' %}light profile has no feature branch; choose direct or use standard profile{% endif %}"

platform_ci_ref:
  type: str
  help: Versioned dev-platform ref used by downstream reusable CI; never use main
  default: release-v1.0.0

agent_tools:
  type: str
  help: Comma-separated OpenSpec tool IDs
  default: "claude,codex"
