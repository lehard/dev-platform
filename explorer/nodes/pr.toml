definition = "PR (pull request) — запрос на слияние ветки задачи в защищённый `main` на GitHub. Отправленная ветка, открытый PR или зелёный CI ещё не доставка: изменение доставлено, когда GitHub сообщает для точного PR состояние `MERGED`, а локальный `main` синхронизирован."
