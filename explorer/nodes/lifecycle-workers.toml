id = "lifecycle-workers"
kind = "part"
title = "Воркеры жизненного цикла"
definition = "Кто берёт задания на ревью, доработку и финализацию и почему два воркера не возьмут одно задание."
role = "actor"
lead = "Воркер жизненного цикла берёт задания, которые координатор опубликовал для PR: ревью, доработку, интеграционную доработку, финализацию, ретроспективу, терминальную сверку и очистку. Воркером может быть локальный процесс, сервер или сессия агента."
thesis = "Каждое задание привязано к точной версии PR и принадлежит самое большее одному воркеру. Заявка ограничена по времени, поэтому упавший воркер не блокирует задание, а результат для устаревшей версии отбрасывается."
sources = [
  "docs/engineering/agent-workflow.md#Lifecycle workers",
  "openspec/specs/lifecycle-workers/spec.md#Requirement: Lifecycle work is published as head-bound jobs",
  "openspec/specs/lifecycle-workers/spec.md#Requirement: Replaceable workers claim jobs through one contract",
  "openspec/specs/lifecycle-workers/spec.md#Requirement: Worker claim identity is unique and validated",
]

[[used_in]]
stage = "verification"
note = "ревью и доработка"

[[used_in]]
stage = "publication-integration"
note = "финализация и интеграция"

[[inputs]]
title = "Опубликованное задание"
text = "Ревью, доработка, интеграционная доработка, финализация, ретроспектива, терминальная сверка или очистка, привязанные к версии, идентичности задачи и попытке."
role = "artifact"
node = "pr-queue-integration"

[[inputs]]
title = "Идентичность воркера"
text = "Одна идентичность на запуск: `--worker`, иначе `DEV_PLATFORM_WORKER`, иначе сгенерированная `worker-<host>-<pid>-<nonce>`."
role = "source"

[[inputs]]
title = "Провайдер воркера"
text = "Воркер объявляет провайдера команды исполнителя и берёт только задания этого провайдера."
role = "mechanism"
node = "executors"

[action]
label = "work-next"
title = "Захват и выполнение задания"
steps = [
  "`lifecycle_workers.py work-next --repo owner/repo --kinds review,repair` выбирает задание и публикует заявку в комментарии PR `dev-platform-lifecycle-claim:v1`.",
  "Выигрывает самая ранняя действующая заявка по порядку комментариев; воркер перечитывает комментарии после публикации и отказывается, если проиграл.",
  "С `--run` воркер выполняет задание в одноразовой копии, где закрыт `stdin`, а токены GitHub, помощники учётных данных и агенты SSH убраны из окружения.",
  "Для записывающих заданий платформа перечитывает версию PR, проверяет результат в отдельном клоне и сама выполняет единственную запись.",
  "Результат публикуется кратким комментарием `dev-platform-lifecycle-result:v1`.",
]

[[outputs]]
title = "Заявка и результат"
text = "Комментарии с идентичностью воркера, провайдером, версией и исходом; для другой версии результат отбрасывается."
role = "artifact"
consumer = "координатор"

[[outputs]]
title = "Новая версия кандидата"
text = "Для доработки платформа публикует правку fast-forward от ожидаемой версии."
role = "stage"
consumer = "→ повторное ревью"
node = "repair-job"

[[outputs]]
title = "Отказ без действий"
text = "Воркер, проигравший гонку или не подходящий по провайдеру, ничего не меняет и сообщает причину."
role = "neutral"
consumer = "оператор"

[[path]]
title = "Два воркера одновременно"
tag = "гонка"
role = "gate"
when = "Два воркера пытаются взять одно и то же задание."
outcome = "продолжает ровно один, а другой отказывается без побочных действий"

[[path]]
title = "Воркер умер"
tag = "истечение заявки"
role = "neutral"
when = "Заявка истекла без результата, либо стала неактуальной из-за новой версии."
outcome = "задание можно взять заново; результат для старой версии отбрасывается"

[[path]]
title = "Провайдер воркера не подходит"
tag = "не берёт"
role = "neutral"
when = "Воркер объявил провайдера, не совпадающего с провайдером задания, или не прошёл проверку готовности."
outcome = "задание остаётся доступным подходящему воркеру, воркер сообщает причину и не ставит заявку"

[[path]]
title = "Неверная идентичность"
tag = "отказ"
role = "gate"
when = "Явная идентичность воркера пуста, длиннее 64 символов или содержит пробелы и разделители путей."
outcome = "воркер завершается с ошибкой, называет идентичность и не публикует комментарии"

[[path]]
title = "Задание для записи без провайдера"
tag = "ошибка"
role = "gate"
when = "Воркер доработки запущен без объявленного провайдера или у задания нет допустимого провайдера."
outcome = "запуск завершается явной ошибкой до заявки; подставлять провайдера по умолчанию нельзя"

[example]
title = "Пример: гонка двух воркеров"
steps = [
  { text = "Координатор публикует задание на ревью для PR на точной версии. Два воркера на разных машинах одновременно запускают `work-next`." },
  { text = "Оба публикуют заявку. Побеждает более ранний комментарий; проигравший перечитывает комментарии и отказывается без побочных действий.", emphasis = ["более ранний комментарий"] },
  { text = "Победитель запускает ревьюеров в одноразовой копии и публикует результат. Процесс умирает, не дойдя до публикации." },
  { text = "Заявка истекает, и другой воркер берёт то же задание. Если за это время версия PR сменилась, прежний результат отбрасывается." },
]

[[guarantees]]
title = "Одно задание, один владелец"
text = "Не более одной действующей заявки владеет заданием. Истёкшую или устаревшую по версии заявку можно перехватить."

[[guarantees]]
title = "Воркер не сливает"
text = "Воркеры не имеют права слияния: оно остаётся за координатором. Ревью только читает, а запись в ветку выполняет платформа."

[[guarantees]]
title = "Заменяемость"
text = "Локальные, удалённые и смешанные воркеры отличаются только местом запуска и перечнем видов заданий, а контракт заявки у них один."
