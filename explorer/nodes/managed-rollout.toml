id = "managed-rollout"
kind = "term"
title = "управляемая раскатка"
definition = "Управляемая раскатка — необязательная возможность оператора: после публикации версии платформы для каждого проекта в состоянии `managed` открывается отдельный PR с обновлением Copier до этого тега. Автослияния по умолчанию нет, а без включения оператором раскатка не запускается."
