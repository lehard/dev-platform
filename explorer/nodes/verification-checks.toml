id = "verification-checks"
kind = "mechanism"
title = "Проверки и протокол верификации"
definition = "Выбранные проверки дают быструю обратную связь, полный набор защищает публикацию, а verification.md честно записывает, что и каким методом проверено."
order = 6
role = "mechanism"
terms = ["verification-receipt"]
lead = "Проверки отвечают на вопрос, можно ли считать задачу завершённой. Выбранные проверки быстро показывают результат по изменённым файлам, полный набор защищает публикацию, а протокол проверки `verification.md` записывает, что и каким методом проверено на самом деле."
thesis = "Зелёные тесты, структурная проверка и отмеченные пункты `tasks.md` не заменяют семантическую проверку. Протокол нельзя заполнить заранее или формально: он описывает только то, что реально выполнено."
sources = [
  "docs/engineering/agent-workflow.md#Validation",
  "docs/engineering/openspec-workflow.md#Verify, archive, then publish",
  "docs/engineering/agent-workflow.md#Machine validation pool",
  "openspec/specs/completion-lifecycle/spec.md#Requirement: Archive requires semantic verification evidence",
  "openspec/specs/completion-lifecycle/spec.md#Requirement: Verification evidence is truthful about executed automated coverage",
]

[[used_in]]
stage = "verification"
note = "проверки и протокол"

[[used_in]]
stage = "publication-integration"
note = "архив и повторное использование"

[[inputs]]
title = "Ветка с изменением"
text = "Закоммиченный результат исполнителя в ветке задачи."
role = "stage"
node = "isolated-implementation"
note = "← этап 4"

[[inputs]]
title = "Таблица проверок проекта"
text = "`dev-platform/checks.toml` сопоставляет изменённые пути проверкам и принадлежит проекту."
role = "source"
note = "dev-platform/checks.toml"

[[inputs]]
title = "Контракт OpenSpec"
text = "Пакет, с которым семантическая проверка сверяет результат по заявленному итогу, полноте, корректности и связности."
role = "artifact"
node = "add-openspec"

[action]
label = "check → receipt"
title = "Выбор, запуск и запись"
steps = [
  "`select_checks.py --base origin/main --execute` выбирает проверки по изменённым путям: для правок только документации и текста OpenSpec достаточно ограниченных проверок структуры и ссылок, а изменение кода, неоднозначный путь или путь управления CI требуют полного набора.",
  "Если включён `affected_precheck`, сначала запускаются тесты, которые напрямую затрагивают изменённые файлы; полный набор всё равно выполняется и остаётся единственным доказательством.",
  "Для управляемого кандидата результат записывается в `automated-checks.json` флагом `--evidence`.",
  "Агент проводит семантическую проверку, предпочтительно `/opsx:verify`, или документированный эквивалент, и записывает в `verification.md` результат `OpenSpec-Verify: PASS` и `Verification-Method`.",
  "Помощник архивации перед дорогими шагами проверяет, что в протоколе есть нужный маркер `Automated-Checks-Evidence: automated-checks.json`, и только потом архивирует изменение.",
]

[[outputs]]
title = "Протокол проверки"
text = "`verification.md` с `OpenSpec-Verify: PASS`, `Verification-Method` и ссылкой на доказательства автоматических проверок."
role = "artifact"
consumer = "архив и `finish`"

[[outputs]]
title = "Доказательства проверок"
text = "`automated-checks.json` называет проверки, которые помощник действительно запустил, и привязан к содержимому задачи."
role = "artifact"
consumer = "ревью и финализация"
node = "independent-review"

[[outputs]]
title = "Классификация падения"
text = "Каждое падение получает отметку `introduced`, `pre-existing` или `unknown` относительно авторитетной базы."
role = "gate"
consumer = "→ этап 4 при возврате"
node = "isolated-implementation"

[[outputs]]
title = "Архив изменения"
text = "После PASS изменение архивируется через помощник жизненного цикла, а результат коммитится; для кандидата координатора архив выполняет задание финализации после ревью."
role = "stage"
consumer = "→ этап 6"
node = "publication-integration"

[[fork]]
title = "Развилка: какой набор проверок выбрать"
note = "Выбор не заменяет защищённый полный результат, который требуется для PR."

[[fork.branch]]
name = "Ограниченный набор"
code = "документы и OpenSpec"
role = "artifact"
recognized = "Изменение не меняет смысла кода: правки `AGENTS.md`, `docs/**`, текста OpenSpec или `template/AGENTS.md.jinja`."
creates = "Запускаются ограниченные проверки структуры, ссылок, якорей и рендеринга."
next = "→ протокол проверки"

[[fork.branch]]
name = "Полный набор"
code = "код, тесты, неясный путь"
role = "gate"
recognized = "Изменён любой Python-файл, `scripts/**`, `template/scripts/**` или `tests/**`, путь неизвестен либо неоднозначен или это путь управления CI и жизненным циклом."
creates = "Запускаются `compileall`, проверка управляемых проектов, все группы тестов и проверка гигиены OpenSpec."
next = "→ протокол проверки"

[[path]]
title = "Проверка упала"
tag = "возврат"
role = "gate"
when = "Выбранная или полная проверка завершилась ошибкой."
outcome = "падение классифицируется относительно базы; `pre-existing` утверждают только при воспроизводимом доказательстве, и оно не оправдывает новые регрессии"

[[path]]
title = "Покрытие проверок пусто"
tag = "блок"
role = "gate"
when = "Для затронутой области нужны проверки платформы, а отображение проверок не даёт ни одной исполняемой команды."
outcome = "завершение блокируется как ошибка конфигурации проверок; `PASS` в протоколе этого не отменяет"

[[path]]
title = "Много запусков одновременно"
tag = "пул машины"
role = "neutral"
when = "Несколько агентов на одной машине запускают тяжёлую проверку одновременно."
outcome = "при включённом `DEV_PLATFORM_MACHINE_POOL` запуски ждут очереди и показывают, кто держит места; без настройки запуск идёт без пула и печатает `not configured`"

[[path]]
title = "Содержимое задачи изменилось"
tag = "перепроверка"
role = "gate"
when = "После записи доказательств изменился любой путь, который входит в идентичность содержимого задачи."
outcome = "доказательства проверок и ревью устарели и нужны заново; запись жизненного цикла, архив и чистое слияние `main` их не отменяют"

[[path]]
title = "Проект сам владеет проверками"
tag = "граница"
role = "external"
when = "Проект использует собственный harness (`harness_mode=project`)."
outcome = "платформа не заявляет, что запускала продуктовые команды проекта, которые на самом деле выполнил репозиторий"

[example]
title = "Пример: проверка управляемой задачи"
steps = [
  { text = "Разработчик закончил реализацию и запускает `select_checks.py --base origin/main --execute --evidence openspec/changes/<change>/automated-checks.json`. Изменён Python-файл, поэтому выбирается полный набор.", emphasis = ["полный набор"] },
  { text = "Одна проверка падает. Агент проверяет её на чистой базе: падение воспроизводится, и он классифицирует его как `pre-existing`. Новые падения от изменения всё равно остаются на изменении." },
  { text = "Агент выполняет семантическую проверку OpenSpec и пишет в `verification.md` `OpenSpec-Verify: PASS` и `Verification-Method` с реально использованным методом." },
  { text = "Разработчик коммитит кандидата и доказательства и выполняет `finish`. Архив изменения позже выполнит задание финализации, а помощник архивации перед дорогими шагами проверит маркер `Automated-Checks-Evidence`." },
]

[[guarantees]]
title = "Честный протокол"
text = "Протокол состоит из того, что действительно проверено и каким методом; ручной или формальный `PASS` не заменяет реальную проверку."

[[guarantees]]
title = "Падение не исчезает молча"
text = "Падение классифицируется как `introduced`, `pre-existing` или `unknown`, а отсутствие доказательств даёт `unknown`, а не догадку."

[[guarantees]]
title = "Архив отказывает до изменений"
text = "Если нет `OpenSpec-Verify: PASS` или `Verification-Method`, помощник архивации отказывает, не изменяя пакет."

[[guarantees]]
title = "Свежесть по содержимому"
text = "Доказательства привязаны к идентичности содержимого задачи и переиспользуются, пока она не изменилась."
