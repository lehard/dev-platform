id = "independent-review"
kind = "mechanism"
title = "Независимое ревью и доработка"
definition = "Платформа запускает ревьюеров только на чтение; существенные замечания исправляются через задание на доработку или отклоняются с обоснованием."
order = 7
role = "mechanism"
children = ["review-perspectives", "repair-job", "review-decisions", "lifecycle-workers"]
lead = "Тесты подтверждают то, что в них заложено. Независимое ревью проверяет другое: сделано ли именно то, о чём договорились в OpenSpec, и сделано ли это качественно. Ревьюера запускает платформа, а не автор кода, и ревьюер может только читать."
thesis = "Существенное замечание нельзя молча пропустить. Его исправляют, и тогда ревью проходит заново, или отклоняют с письменным обоснованием, привязанным к конкретному отчёту."
sources = [
  { ref = "docs/engineering/openspec-workflow.md#Independent review evidence", note = "запуск, отчёты, решения" },
  { ref = "docs/engineering/agent-workflow.md#Completion", note = "передача кандидата, раунды, провайдеры" },
  { ref = "docs/engineering/agent-workflow.md#Candidate and integration contours", note = "кандидат и интеграция" },
  { ref = "docs/engineering/agent-workflow.md#Lifecycle workers", note = "захват и выполнение заданий" },
]

[[used_in]]
stage = "verification"

[[used_in]]
stage = "publication-integration"
note = "финализация и повторный приём"

[[inputs]]
title = "Проверенный кандидат"
text = "Ветка задачи с пройденными проверками и протоколом верификации. PR принят координатором как `review-pending`."
role = "stage"
node = "verification"
note = "← этап 5"

[[inputs]]
title = "Контракт задачи"
text = "Пакет OpenSpec, с которым ревьюер сверяет результат."
role = "artifact"
node = "add-openspec"
note = "openspec/changes/<change>/"

[[inputs]]
title = "Настройки ревью"
text = "Провайдер, профиль модели и ограничение по времени."
role = "source"
note = ".dev-platform.toml · [independent_review]"

[action]
label = "review → repair"
title = "Ревью, при необходимости доработка, снова ревью"
steps = [
  "Два ревьюера читают точную версию в одноразовой копии.",
  "Каждое замечание помечено как существенное или рекомендация.",
  "Существенные замечания уходят в задание на доработку.",
  "Изменённый код снова проходит ревью.",
]

[[outputs]]
title = "Финализация"
text = "Архив OpenSpec и передача PR в очередь интеграции."
role = "stage"
consumer = "→ этап 6"
node = "publication-integration"

[[outputs]]
title = "Задание на доработку"
text = "Исполнитель получает конкретные находки и правит только файлы задачи."
role = "gate"
consumer = "repair"
node = "repair-job"

[[outputs]]
title = "Решение человека"
text = "После трёх неудачных раундов или предложения отклонить задачу."
role = "actor"
consumer = "эскалация"

[[guarantees]]
title = "Только чтение"
text = "Ревьюер работает с правом только читать. Если во время ревью изменился хоть один файл, отчёт недействителен."

[[guarantees]]
title = "Две точки зрения"
text = "`spec-fidelity` сверяет результат с контрактом, `engineering-quality` оценивает инженерное качество."

[[guarantees]]
title = "Привязка к содержимому"
text = "Отчёт действует для точного содержимого задачи. Любая правка кода требует нового ревью, а архив и чистое слияние свежего main нет."

[[guarantees]]
title = "Нет ручного «пройдено»"
text = "Написанный вручную отчёт не засчитывается. Недоступный ревьюер блокирует архив и публикацию."

[cycle]
title = "Цикл кандидата"

[[cycle.step]]
state = "review-pending"
text = "PR принят, задание на ревью опубликовано"
arrow = "→"

[[cycle.step]]
state = "reviewing"
text = "воркер взял задание и запустил ревьюеров"
arrow = "→"

[[cycle.step]]
state = "repair-pending"
text = "есть существенные замечания"
emphasis = "gate"
arrow = "→"

[[cycle.step]]
state = "repairing"
text = "исполнитель правит, платформа проверяет и продвигает ветку"
arrow = "↺"

[[cycle.step]]
state = "finalize-pending"
text = "замечаний нет, можно архивировать"
emphasis = "mechanism"

[[cycle.note]]
tag = "после repairing"
text = "Изменённое содержимое снова попадает в `review-pending`."
role = "gate"

[[cycle.note]]
tag = "три раунда без успеха"
text = "Кандидат останавливается и ждёт решения человека."
role = "actor"

[[cycle.note]]
tag = "ревьюер недоступен"
text = "Состояние `blocked-retryable`: до трёх автоматических повторов."
role = "neutral"

[example]
title = "Пример: замечание и возврат"
steps = [
  { text = "Разработчик закончил задачу и выполнил `finish`. PR опубликован на точной версии и принят координатором как review-pending. Агент-разработчик освобождается и не ждёт ревью.", emphasis = ["review-pending"] },
  { text = "Воркер берёт задание на ревью и запускает обоих ревьюеров в одноразовой копии." },
  { text = "Ревьюер качества находит существенную ошибку: не обработан пустой ввод. Кандидат переходит в repair-pending.", emphasis = ["repair-pending"] },
  { text = "Исполнитель доработки получает находки, правит код только в пределах файлов задачи. Платформа фиксирует результат, проверяет его в отдельной копии и сама продвигает ветку." },
  { text = "Код изменился, поэтому ревью повторяется. Замечаний нет, и кандидат идёт в финализацию: архив OpenSpec, затем очередь интеграции.", emphasis = ["финализацию"] },
]

[[path]]
title = "Замечание ошибочно"
tag = "отклонение"
role = "gate"
when = "Автор не согласен с находкой."
outcome = "отклонить командой `dispose` с обоснованием; запись привязана к хешу отчёта"

[[path]]
title = "Ревьюер недоступен"
tag = "повтор"
role = "actor"
when = "Нет входа в CLI, исчерпан лимит, процесс не запустился."
outcome = "тот же раунд повторяется до трёх раз подряд, затем оператор выполняет `resume` или `switch-provider`"

[[path]]
title = "Три раунда без успеха"
tag = "эскалация"
role = "gate"
when = "Доработка не устраняет замечания, или ревьюер предлагает отклонить задачу."
outcome = "нужен коммит с исправлением или закрытие PR; простое возобновление не поможет"

[[path]]
title = "Разработчик дописал задачу"
tag = "повторный приём"
role = "stage"
when = "В тот же PR пришла новая версия от разработчика."
outcome = "следующий `finish` принимает её заново; пройденное ревью сохраняется, только если содержимое задачи не изменилось"

[[path]]
title = "Быстрая задача"
tag = "не требуется"
role = "neutral"
when = "Работа без управляемого пакета OpenSpec."
outcome = "независимое ревью не проводится"
