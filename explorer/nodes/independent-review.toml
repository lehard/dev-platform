id = "independent-review"
kind = "mechanism"
title = "Независимое ревью"
definition = "Необязательный шаг внутри finish: платформа запускает ревьюеров только на чтение, а существенные замечания исправляются или отклоняются с обоснованием."
order = 7
role = "mechanism"
children = ["review-perspectives", "review-decisions"]
lead = "Тесты подтверждают то, что в них заложено. Независимое ревью проверяет другое: сделано ли именно то, о чём договорились в OpenSpec, и сделано ли это качественно. Ревью необязательно: `finish` запускает его только с настройкой `[independent_review] enabled = true`, а вручную его запускает `independent_review.py`."
thesis = "Существенное замечание нельзя молча пропустить. Его исправляют, и тогда ревью проходит заново, или отклоняют с письменным обоснованием, привязанным к конкретному отчёту."
sources = [
  { ref = "docs/engineering/openspec-workflow.md#Independent review evidence", note = "запуск, отчёты, решения" },
  { ref = "docs/engineering/agent-workflow.md#Completion", note = "ревью внутри finish" },
  { ref = "docs/engineering/lifecycle-map.md#Lifecycle", note = "место ревью в пути задачи" },
]

[[used_in]]
stage = "verification"

[[used_in]]
stage = "publication-integration"
note = "шаг внутри finish"

[[inputs]]
title = "Проверенная ветка"
text = "Закоммиченная ветка задачи с пройденными проверками и протоколом верификации."
role = "stage"
node = "verification"
note = "← этап 5"

[[inputs]]
title = "Контракт задачи"
text = "Пакет OpenSpec, с которым ревьюер сверяет результат."
role = "artifact"
node = "add-openspec"
note = "openspec/changes/<change>/"

[[inputs]]
title = "Настройки ревью"
text = "Включение ревью, провайдер, профиль модели и ограничение по времени."
role = "source"
note = ".dev-platform.toml · [independent_review]"

[action]
label = "review"
title = "Ревью, исправление, снова ревью"
steps = [
  "`finish` запускает ревью сам, если оно включено. Без настройки его запускают вручную: `independent_review.py run <change>`, а доказательства коммитят.",
  "Два ревьюера читают точную версию задачи и ничего не могут изменить.",
  "Каждое замечание помечено как существенное или рекомендация.",
  "Существенное замечание останавливает `finish`. Разработчик исправляет его коммитом или отклоняет с обоснованием.",
  "Изменённый код снова проходит ревью при следующем `finish`.",
]

[[outputs]]
title = "Архив и публикация"
text = "Когда блокирующих находок нет, `finish` архивирует изменение и публикует PR."
role = "stage"
consumer = "→ этап 6"
node = "publication-integration"

[[outputs]]
title = "Возврат разработчику"
text = "Существенные находки останавливают `finish`, и разработчик исправляет их в той же ветке."
role = "gate"
consumer = "→ этап 4"
node = "isolated-implementation"

[[outputs]]
title = "Решение владельца"
text = "Спорное отклонение существенной находки выносится владельцу с вариантами и рекомендацией."
role = "actor"
consumer = "эскалация"

[[guarantees]]
title = "Только чтение"
text = "Ревьюер работает с правом только читать. Если во время ревью изменился хоть один файл, отчёт недействителен."

[[guarantees]]
title = "Две точки зрения"
text = "`spec-fidelity` сверяет результат с контрактом, `engineering-quality` оценивает инженерное качество."

[[guarantees]]
title = "Привязка к содержимому"
text = "Отчёт действует для точного содержимого задачи. Любая правка кода требует нового ревью, а архив и чистое слияние свежего main нет."

[[guarantees]]
title = "Нет ручного «пройдено»"
text = "Написанный вручную отчёт не засчитывается. При включённом ревью недоступный ревьюер останавливает архив и публикацию."

[example]
title = "Пример: замечание и возврат"
steps = [
  { text = "В репозитории ревью включено. Разработчик закончил задачу и выполнил `finish`, и команда запустила обоих ревьюеров.", emphasis = ["обоих ревьюеров"] },
  { text = "Ревьюер качества находит существенную ошибку: не обработан пустой ввод. `finish` останавливается и называет находку." },
  { text = "Разработчик исправляет код в той же ветке, снова запускает проверки и коммитит результат." },
  { text = "Следующий `finish` видит, что содержимое изменилось, и запускает ревью заново. Замечаний нет, поэтому команда архивирует изменение и публикует PR.", emphasis = ["архивирует изменение"] },
]

[[path]]
title = "Замечание ошибочно"
tag = "отклонение"
role = "gate"
when = "Автор не согласен с находкой."
outcome = "отклонить командой `dispose` с обоснованием; запись привязана к хешу отчёта"

[[path]]
title = "Ревьюер недоступен"
tag = "стоп"
role = "gate"
when = "Нет входа в CLI, исчерпан лимит, процесс не запустился."
outcome = "отчёт `unavailable` останавливает `finish`; после устранения причины следующий `finish` запускает ревью снова"

[[path]]
title = "Ревью не включено"
tag = "по настройке"
role = "neutral"
when = "В репозитории нет `[independent_review] enabled = true`."
outcome = "`finish` ревью не запускает; при необходимости его запускают вручную через `independent_review.py`"

[[path]]
title = "Быстрая задача"
tag = "не требуется"
role = "neutral"
when = "Работа без управляемого пакета OpenSpec."
outcome = "независимое ревью не проводится"
