id = "release-rollout"
kind = "stage"
title = "Релиз и раскатка"
definition = "Новая версия платформы получает неизменяемый тег, а подключённые проекты получают её отдельными PR через Copier. Обычное изменение этот этап не проходит."
order = 7
short_title = "Релиз и раскатка"
tagline = "только версия платформы"
children = ["platform-releases", "copier-rollout"]
terms = ["immutable-tag", "managed-rollout", "copier"]
lead = "Обычное изменение этот этап не проходит. Он начинается, только когда слит явный release PR, меняющий `VERSION`: тогда создаётся неизменяемый тег версии. Дальше действует необязательная возможность оператора, управляемая раскатка: если она включена, подключённые проекты обновляются отдельными PR через Copier."
thesis = "Выпуск версии и раскатка по проектам это два разных решения. Публикация версии сама по себе не запускает раскатку, а раскатка никогда не берёт изменяемый `main`: проекты обновляются до точного опубликованного тега и только через PR."
sources = [
  "docs/release-policy.md#Release identity",
  "docs/release-policy.md#Choosing the version",
  "docs/release-policy.md#Managed rollout",
  "docs/release-policy.md#Version publication",
  "docs/managed-rollout.md#Release rollout",
  "docs/managed-rollout.md#Downstream adoption at task start",
]

[[transitions]]
to = "feedback-learning"
type = "conditional"
reason = "Выпуск версии платформы тоже завершается ретроспективой"

[[inputs]]
title = "Слитый release PR"
text = "Явный PR, который меняет `VERSION`; в его описании перечислены изменения, определившие номер версии."
role = "stage"
node = "publication-integration"
note = "← этап 6, только для релиза"

[[inputs]]
title = "Правило выбора версии"
text = "Автор классифицирует изменения с точки зрения существующего проекта и берёт старший из компонентов MAJOR, MINOR и PATCH."
role = "source"
node = "platform-releases"

[[inputs]]
title = "Включение раскатки"
text = "Переменная репозитория `DEV_PLATFORM_MANAGED_ROLLOUT_ENABLED=true`, которую ставит оператор; без неё раскатка не запускается."
role = "actor"
node = "copier-rollout"

[[inputs]]
title = "Реестр проектов"
text = "Внешний реестр оператора: только проекты в состоянии `managed` входят в раскатку."
role = "external"
node = "copier-rollout"

[action]
label = "release → rollout"
title = "От тега до PR в проектах"
steps = [
  "До создания тега платформенный CI и публикация запускают `validate_release_installation.py`: реальные свежие рендеры и обновления Copier от последнего стабильного тега.",
  "После слияния release PR workflow `publish-version.yml` создаёт тег `v<VERSION>` на этом коммите и отказывается перемещать существующий.",
  "Если оператор включил раскатку, `rollout_dispatch_gate.py` разрешает диспетчеризацию, и раскатка запускается для этого точного тега; иначе шаг пропускается.",
  "Раскатка подтверждает, что тег опубликован как неизменяемый релиз GitHub, и для каждого проекта `managed` запускает Copier на ветке `dev-platform/rollout-vX.Y.Z`.",
  "Проверяется только платформенная часть, затем открывается обычный PR, и раскатка останавливается: слияние решают CI и ревью самого проекта.",
]

[[outputs]]
title = "Тег версии"
text = "Неизменяемый тег `vX.Y.Z` на коммите release PR; он не перемещается и не используется повторно."
role = "artifact"
consumer = "все проекты"
node = "platform-releases"

[[outputs]]
title = "PR раскатки в каждом проекте"
text = "Отдельный PR `dev-platform/rollout-vX.Y.Z` в каждом проекте `managed`; автослияния по умолчанию нет."
role = "external"
consumer = "команда проекта"
node = "copier-rollout"

[[outputs]]
title = "Предупреждение о повторных сбоях"
text = "После трёх подряд неудач проекта раскатка добавляет к его Issue метку `rollout-alert`."
role = "gate"
consumer = "оператор"
node = "copier-rollout"

[[fork]]
title = "Развилка: запускается ли раскатка"
note = "Публикация версии и раскатка по проектам решаются отдельно: выпуск не означает раскатку по всем проектам."

[[fork.branch]]
name = "Только публикация версии"
code = "переменная не задана"
role = "neutral"
recognized = "Оператор не включал управляемую раскатку, `DEV_PLATFORM_MANAGED_ROLLOUT_ENABLED` не равна `true`."
creates = "Создан тег, шаг диспетчеризации пропущен, проекты не затронуты."
next = "→ 8 Обратная связь"
next_node = "feedback-learning"

[[fork.branch]]
name = "Публикация и раскатка"
code = "раскатка включена"
role = "external"
recognized = "Оператор включил управляемую раскатку, версия опубликована как неизменяемый релиз."
creates = "В каждом проекте `managed` открывается отдельный PR с обновлением до этого тега."
next = "Copier и управляемая раскатка"
next_node = "copier-rollout"

[[fork.branch]]
name = "Ручной повтор"
code = "Roll Out Platform"
role = "actor"
recognized = "Оператор запускает workflow Roll Out Platform вручную с точной версией и при необходимости одним репозиторием."
creates = "Раскатка выполняется для указанного тега; `candidate` и `excluded` отклоняются и при ручном вызове."
next = "Copier и управляемая раскатка"
next_node = "copier-rollout"

[[path]]
title = "Тег уже существует"
tag = "отказ"
role = "gate"
when = "Публикация находит уже созданный тег этой версии."
outcome = "она отказывается его перемещать; опубликованный тег не меняют и не используют повторно"

[[path]]
title = "Установка не проходит"
tag = "тег не создаётся"
role = "gate"
when = "Свежий рендер или обновление от последнего стабильного тега не проходит платформенные проверки."
outcome = "тег не создаётся; CI и публикация не пропускают проверку и при неполной истории или отсутствии стабильного базового тега"

[[path]]
title = "Версия не опубликована"
tag = "отказ"
role = "gate"
when = "Версию ввели вручную, но она не опубликована как неизменяемый релиз GitHub."
outcome = "раскатка отклоняет её до создания токенов для других репозиториев"

[[path]]
title = "Проект заблокирован"
tag = "fail closed"
role = "gate"
when = "У проекта конфликт, неверные метаданные Copier, попытка понизить версию или ошибка проверки."
outcome = "ветка проекта по умолчанию не меняется, а остальные проекты продолжают получать свои PR"

[[path]]
title = "Проект ещё не принят"
tag = "candidate"
role = "neutral"
when = "Репозиторий в реестре в состоянии `candidate` или `excluded`."
outcome = "обычная раскатка его не меняет; первое подключение выполняет отдельный workflow Adopt Project"

[example]
title = "Пример: новая версия в подключённом проекте"
steps = [
  { text = "С момента тега `v1.4.1` добавлена необязательная настройка. Автор release PR выбирает MINOR, меняет `VERSION` на `1.5.0` и перечисляет в описании PR изменения, определившие номер." },
  { text = "PR слит. Установка проверена, workflow создаёт тег v1.5.0 на этом коммите и убеждается, что такого тега ещё нет.", emphasis = ["v1.5.0"] },
  { text = "Оператор раньше включил управляемую раскатку, поэтому диспетчеризация разрешена и запускается раскатка для этого тега." },
  { text = "Для проекта в состоянии `managed` Copier на ветке `dev-platform/rollout-v1.5.0` обновляет проект до тега, проходят платформенные проверки, и открывается обычный PR." },
  { text = "PR остаётся на ревью проекта. Когда в проекте начинается следующая задача, платформенный `start_task.py` может влить PR с зелёными проверками до создания новой ветки, и задача начинается на новой версии.", emphasis = ["на новой версии"] },
]
