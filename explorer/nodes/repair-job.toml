id = "repair-job"
kind = "part"
title = "Задание на доработку"
definition = "Как исполнитель получает находки, в каких файлах ему можно работать и как платформа принимает результат."
role = "gate"
lead = "Когда ревью находит исправимое существенное замечание, координатор публикует задание на доработку. Исполнитель работает без исходного разработчика: он получает находки и правит файлы в границах задачи, а платформа сама проверяет результат и продвигает ветку."
thesis = "Исполнитель доработки не имеет ни учётных данных GitHub, ни права слияния. Единственную запись в ветку делает детерминированный набор проверок после того, как результат прошёл все ограничения."
sources = [
  "docs/engineering/agent-workflow.md#Lifecycle workers",
  "docs/engineering/agent-workflow.md#Completion",
  "openspec/specs/completion-lifecycle/spec.md#Requirement: Review and repair run as candidate jobs",
  "openspec/specs/lifecycle-workers/spec.md#Requirement: LLM workers hold no publication or repository credential",
  "openspec/specs/lifecycle-workers/spec.md#Requirement: Repair work runs only under the originating authorized provider",
]

[[used_in]]
stage = "verification"

[[inputs]]
title = "Существенные находки"
text = "Находки отчёта ревью, которые остаются без исправления или отклонения."
role = "gate"
node = "review-perspectives"

[[inputs]]
title = "Ограничение области"
text = "Разрешённые пути кандидата передаются параметрами `--allow`; правка вне них отклоняется."
role = "source"

[[inputs]]
title = "Провайдер исходной задачи"
text = "Задание называет ровно одного провайдера, того, чей маршрут записал разработчик при передаче кандидата."
role = "mechanism"
node = "executors"

[action]
label = "repair"
title = "От находок до новой версии"
steps = [
  "Воркер с подходящим провайдером берёт задание и работает в одноразовой копии без учётных данных GitHub; находки добавляются последним аргументом команды исполнителя.",
  "Исполнитель либо фиксирует правку коммитом, либо оставляет её в рабочем дереве; платформа сама коммитит оставленные правки, если они укладываются в границы.",
  "Платформа перечитывает версию PR, отбрасывает результат при сдвиге версии и проверяет его в отдельном свежем клоне.",
  "Результат принимается только как fast-forward от ожидаемой версии, внутри разрешённых путей, без правок workflow и записей жизненного цикла.",
  "Единственную запись в ветку выполняет платформа с защитой `--force-with-lease`, привязанной к ожидаемой версии. Изменённое содержимое возвращается в ревью.",
]

[[outputs]]
title = "Новая версия ветки"
text = "Принятая правка попадает в ветку кандидата и считается изменением содержимого, поэтому ревью повторяется."
role = "stage"
consumer = "→ повторное ревью"
node = "independent-review"

[[outputs]]
title = "Эскалация"
text = "Три раунда без успеха, предложенное отклонение существенной находки или операционный сбой исполнителя без восстановления ждут решения человека."
role = "actor"
consumer = "человек"

[[path]]
title = "Правка вне границ"
tag = "отклонено"
role = "gate"
when = "Результат трогает workflow, записи жизненного цикла, чужие пути, вложенные метаданные Git, специальные файлы или имя, отличающееся только регистром."
outcome = "платформа отклоняет результат с названием первого нарушающего пути и ничего не публикует"

[[path]]
title = "Версия PR сдвинулась"
tag = "отбросить"
role = "gate"
when = "Пока исполнитель работал, версия PR изменилась."
outcome = "результат отбрасывается, а задание оценивается заново для текущей версии"

[[path]]
title = "Исполнитель недоступен"
tag = "повтор"
role = "neutral"
when = "Исполнитель завершился с ошибкой или не запустился, а проверка готовности показывает, что рантайм провайдера недоступен."
outcome = "кандидат остаётся `blocked-retryable` с причиной `provider-unavailable`, раунд доработки не тратится, тот же раунд повторяют до трёх раз подряд, затем нужен `resume`"

[[path]]
title = "Исполнитель ошибся при рабочем рантайме"
tag = "эскалация"
role = "gate"
when = "Исполнитель завершился с ошибкой, а рантайм провайдера исправен."
outcome = "это настоящий сбой доработки, кандидат становится `blocked-escalation`"

[[path]]
title = "Нужен другой провайдер"
tag = "смена"
role = "actor"
when = "Оператор решает, что незавершённое задание должен выполнить другой провайдер."
outcome = "`publication_queue.py switch-provider` назначает провайдера, сохраняет находки и попытки и не расходует раунд; выбор остаётся и для следующих раундов"

[example]
title = "Пример: доработка по существенному замечанию"
steps = [
  { text = "Ревьюер качества сообщил о существенной ошибке: не обработан пустой ввод. Кандидат перешёл в состояние repair-pending.", emphasis = ["repair-pending"] },
  { text = "Воркер с провайдером исходной задачи взял задание, получил находку последним аргументом и начал править файлы задачи в одноразовой копии." },
  { text = "Исполнитель оставил правку незафиксированной. Платформа проверила, что пути входят в разрешённые, и сама зафиксировала правку коммитом." },
  { text = "Платформа проверила результат в отдельном клоне и отправила fast-forward в ветку PR, привязав запись к ожидаемой версии." },
  { text = "Содержимое задачи изменилось, поэтому кандидат вернулся на ревью. Новое ревью замечаний не нашло." },
]

[[guarantees]]
title = "Без учётных данных"
text = "Процесс исполнителя не получает токены GitHub, помощников учётных данных и агентов SSH и не имеет права слияния."

[[guarantees]]
title = "Только допустимая запись"
text = "Запись в ветку допустима лишь как fast-forward от ожидаемой версии в разрешённых путях; её делает платформа с защитой от сдвига."
