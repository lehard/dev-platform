id = "feedback-learning"
kind = "stage"
title = "Обратная связь и улучшение"
definition = "После каждой задачи агент проводит ретроспективу. Значимые затруднения записываются, разбираются и, если улучшение принято, возвращаются в цикл новой работой."
order = 8
short_title = "Обратная связь"
tagline = "уроки → улучшения"
children = ["friction-retrospectives"]
terms = ["friction"]
lead = "К завершению каждой нетривиальной задачи агент проводит ретроспективу фактического пути: какие обходные решения, переопределения и повторы понадобились. Значимые затруднения записываются как friction, то есть как обезличенные свидетельства для улучшения процесса, а не как новые задачи."
thesis = "Затруднение само по себе не становится работой. Оно остаётся свидетельством, пока периодический обзор не сопоставит повторы и причины, и только принятое улучшение возвращается в цикл как новая работа."
sources = [
  "docs/engineering/agent-workflow.md#Friction routing",
  "docs/engineering/agent-workflow.md#Post-task retrospective",
  "docs/promotion-loop.md",
  "README.md#Continuous improvement / friction loop",
]

[[transitions]]
to = "requirement-intent"
type = "return"
reason = "Принятое улучшение процесса становится новой работой"
label = "новая работа"

[[inputs]]
title = "Путь завершаемой задачи"
text = "Фактический путь задачи, дошедшей до публикации: переопределения, ручные обходы, повторы и дрейф чужого состояния."
role = "stage"
node = "publication-integration"
note = "← этап 6"

[[inputs]]
title = "Выпущенная версия"
text = "Выпуск версии платформы тоже завершается ретроспективой."
role = "stage"
node = "release-rollout"
note = "← этап 7"

[[inputs]]
title = "Журнал friction"
text = "Локальный журнал событий, записанных через `agent_friction.py`; сырые свидетельства остаются на машине."
role = "artifact"
node = "friction-retrospectives"

[action]
label = "retrospective"
title = "Ретроспектива и разбор"
steps = [
  "Перед завершением нетривиальной задачи запустить `agent_friction.py review-path`: он показывает контрольный список и уже записанные сигналы задачи.",
  "Пройти фактический путь: нестандартные флаги, удачные ручные обходы, повторы известных проблем и дрейф чужого состояния.",
  "Записать значимое командой `agent_friction.py record`, а чекпоинт закрыть `--result none` или привязать события через `--event`.",
  "Для Requirement перед терминальной публикацией выполнить родительскую ретроспективу `requirement_retrospective.py checkpoint`.",
  "Process issue получает повторы, периодический обзор группирует их по причинам, а общий кандидат можно предложить в центральный репозиторий командой `promote`.",
]

[[outputs]]
title = "Запись friction"
text = "Событие в локальном журнале, привязанное к задаче; секреты и сырая история оболочки в него не попадают."
role = "artifact"
consumer = "журнал и process issue"
node = "friction-retrospectives"

[[outputs]]
title = "Чекпоинт ретроспективы"
text = "Локальный маркер, привязанный к ветке и версии; без свежего чекпоинта `finish_task.py` не завершит задачу."
role = "gate"
consumer = "`finish`"

[[outputs]]
title = "Принятое улучшение"
text = "Улучшение процесса, которое принято как работа, оформляется как новое изменение платформы."
role = "stage"
consumer = "→ этап 1"
node = "requirement-intent"

[[fork]]
title = "Развилка: итог ретроспективы"
note = "Факт важнее формы: чистый результат допустим только после проверки фактического пути и привязки всех обязательных сигналов."

[[fork.branch]]
name = "Находок нет"
code = "--result none"
role = "neutral"
recognized = "Фактический путь просмотрен, значимых обходов, повторов и дрейфа не найдено."
creates = "Чекпоинт `none` с короткой пометкой о проверенном пути; других записей не нужно."
next = "Задача закрыта"
stop = true

[[fork.branch]]
name = "Есть затруднение"
code = "record"
role = "gate"
recognized = "Поправка пользователя, повторный сбой, почти-нарушение безопасности, неописанный инвариант или лишние повторы."
creates = "Событие записывается, роутер создаёт или обновляет очищенный process issue, а чекпоинт ссылается на событие."
next = "Friction и ретроспективы"
next_node = "friction-retrospectives"

[[fork.branch]]
name = "Известная проблема"
code = "known-recurrence"
role = "artifact"
recognized = "Тот же дефект уже зафиксирован в открытом process issue."
creates = "Новое появление всё равно записывается и добавляется к issue; такое событие можно только привязать к чекпоинту."
next = "Friction и ретроспективы"
next_node = "friction-retrospectives"

[[path]]
title = "Нечитаемый источник"
tag = "не чистый результат"
role = "gate"
when = "Журнал или другой источник свидетельств нечитаем или неполон."
outcome = "результат не считается чистым: источник чинят или явно принимают через `--accept-gap`"

[[path]]
title = "После чекпоинта появились коммиты"
tag = "устарел"
role = "gate"
when = "В ветку попали новые коммиты после записи чекпоинта."
outcome = "чекпоинт отклоняется как устаревший, и ретроспективу проводят заново"

[[path]]
title = "Пробел контекста"
tag = "context-gap"
role = "artifact"
when = "Поправка или сбой показывает, что стабильный контекст проекта отсутствовал или был понят неверно."
outcome = "событие записывается с `--classification context-gap` и одной областью `--context-concern`; место в `docs/context/` остаётся кандидатом, а не автоматической записью"

[[path]]
title = "Разбор не создаёт работу"
tag = "запрет"
role = "gate"
when = "Облачный разбор или обзор находит проблему."
outcome = "он не создаёт управляемые задачи, OpenSpec, PR и правки кода; работу создаёт только принятое улучшение"

[[path]]
title = "Process issue не создаётся"
tag = "не блокирует"
role = "neutral"
when = "Повторная попытка создать или обновить process issue не удалась."
outcome = "сбой сохраняется и не блокирует безопасную доставку"

[example]
title = "Пример: от затруднения до улучшения"
steps = [
  { text = "Во время задачи агент дважды вручную обошёл один и тот же сбой очереди. Перед завершением `agent_friction.py review-path` показывает этот сигнал." },
  { text = "Агент записывает событие с триггером manual-workaround, и платформа создаёт очищенный process issue или добавляет новое появление к открытому.", emphasis = ["manual-workaround"] },
  { text = "Он закрывает чекпоинт, привязав событие через `--event`. Без этого `finish_task.py` остановил бы завершение." },
  { text = "Периодический обзор группирует похожие process issues по вероятной причине и сверяет их с текущим репозиторием. Общую повторяющуюся проблему можно предложить в центральный репозиторий: сначала `promote --dry-run`, затем `promote`." },
  { text = "Если улучшение принято, оно оформляется изменением OpenSpec и входит в цикл с этапа 1 как новая работа.", emphasis = ["с этапа 1"] },
]
