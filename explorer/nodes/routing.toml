id = "routing"
kind = "stage"
title = "Маршрутизация"
definition = "Перед реализацией платформа подтверждает рекомендованный уровень исполнителя и записывает, какой агент и какая модель отвечают за работу."
order = 3
short_title = "Маршрутизация"
tagline = "кто и на каком уровне"
children = ["executor-routing", "executors"]
lead = "Каждая управляемая задача получает рекомендованный уровень исполнителя ещё при подготовке: `R2` по умолчанию или `R3` при записанной причине. Перед реализацией платформа проверяет, что этот уровень остаётся верным, и записывает решение о маршруте."
thesis = "Пользователь не выбирает исполнителя. Уровень, профиль и модель выбирает и записывает платформа, а делегирование считается состоявшимся только тогда, когда доказана граница записи."
sources = [
  "docs/engineering/model-routing.md#Start-tier authoring (`R1`/`R2`/`R3`)",
  "docs/engineering/model-routing.md#Execution-time freshness check",
  "docs/engineering/model-routing.md#Execution plan and early routing gate",
  "docs/engineering/model-routing.md#Review and escalation",
  "AGENTS.md#Always-on invariants",
]

[[transitions]]
to = "isolated-implementation"
type = "main"
reason = "Реализация начинается только после записанного маршрута"

[[inputs]]
title = "Управляемая задача с пакетом"
text = "Пакет OpenSpec несёт рекомендованный уровень `R2` или `R3` и небольшую квитанцию маршрута. Пакет, подготовленный до появления рубрики, квитанции не несёт."
role = "stage"
node = "specification"
note = "← этап 2"

[[inputs]]
title = "Настройки маршрутизации"
text = "Раздел `[model_routing]` конфигурации превращает профиль в конкретную модель и может быть заменён без правки Issue или OpenSpec."
role = "source"
node = "executor-routing"
note = ".dev-platform.toml"

[[inputs]]
title = "Рабочая копия задачи"
text = "К этому моменту задача уже запущена в собственном worktree, и маршрут записывается именно из него."
role = "artifact"
node = "worktrees"

[action]
label = "route"
title = "Подтверждение маршрута"
steps = [
  "Из рабочей копии задачи запустить `dogfood_task.py route-codex` или `route-claude`, не указывая `--profile`: при наличии квитанции пакета это проверка свежести.",
  "Платформа превращает `R2` в профиль `standard`, `R3` в профиль `complex` и записывает подтверждённый маршрут.",
  "Из политики она выводит план исполнения: `delegated-child` для `routine` и `standard` или `supervisor-retained` для `complex`.",
  "Если проверка находит новый жёсткий триггер, которого не было в рекомендации, маршрут повышается через `escalate`.",
]

[[outputs]]
title = "Запись маршрута"
text = "Файл `.claude/model-routing/<change>.json` хранит маршрут, план исполнения и позже фактический результат: кто на самом деле выполнял работу."
role = "artifact"
consumer = "→ этап 4 и завершение"
node = "isolated-implementation"

[[outputs]]
title = "Запущенный исполнитель"
text = "Для `routine` и `standard` стартует настроенный исполнитель с ограниченными правами; для `complex` работа остаётся у текущей сильной сессии."
role = "actor"
consumer = "→ этап 4"
node = "executors"

[[fork]]
title = "Развилка: профиль маршрута"
note = "Размер диффа, число файлов и цена ошибки сами по себе не требуют `R3`: они могут лишь повысить уровень гарантий при том же `R2`."

[[fork.branch]]
name = "Обычная работа"
code = "R2 → standard"
role = "stage"
recognized = "Работа хорошо определена, поведение ясно и проверяемо, жёсткого триггера нет, в том числе при большом диффе или высокой цене ошибки."
creates = "Записывается профиль `standard`, и запускается дочерний исполнитель настроенной модели."
next = "→ 4 Исполнение"
next_node = "isolated-implementation"

[[fork.branch]]
name = "Работа с жёстким триггером"
code = "R3 → complex"
role = "gate"
recognized = "У задачи записан жёсткий триггер из ограниченного списка: нерешённая архитектура, неизвестный диагноз, слабая проверка при высоких последствиях и другие."
creates = "Записывается профиль `complex`, а работа остаётся у текущей сильной сессии без попытки дешёвой модели."
next = "→ 4 Исполнение"
next_node = "isolated-implementation"

[[fork.branch]]
name = "Явный профиль"
code = "--profile"
role = "actor"
recognized = "У пакета нет квитанции маршрута либо исполнитель сознательно переопределяет авторский уровень."
creates = "Профиль `routine`, `standard` или `complex` указан явно и записывается вместе с авторским уровнем, если он был."
next = "→ 4 Исполнение"
next_node = "isolated-implementation"

[[path]]
title = "Содержимое задачи уже изменено"
tag = "отказ"
role = "gate"
when = "В рабочей копии уже есть изменения содержимого задачи, а маршрута ещё нет."
outcome = "подготовка маршрута завершается ошибкой с перечнем путей; платформа ничего не прячет, не сбрасывает и не очищает, решение владельца записывается явной командой"

[[path]]
title = "Граница записи не доказана"
tag = "работа у родителя"
role = "gate"
when = "Платформа не может доказать нативную границу записи для дочернего исполнителя."
outcome = "она сообщает ограничение, а родитель сохраняет работу вместо заявления о делегировании"

[[path]]
title = "Появился новый жёсткий триггер"
tag = "повышение"
role = "gate"
when = "Задача `routine` или `standard` упирается в конфликт с OpenSpec, неожиданный объём, низкую уверенность, повторные сбои проверки или новый жёсткий триггер."
outcome = "`model_routing.py escalate` повышает маршрут, сохраняя OpenSpec, рабочую копию и находки; понижение ниже авторского уровня не поддерживается"

[[path]]
title = "Уровень R1"
tag = "отказ"
role = "neutral"
when = "Кто-то пытается использовать зарезервированный уровень `R1` для реального исполнения."
outcome = "в этой версии он отклоняется, а авторинг его не рекомендует"

[example]
title = "Пример: маршрут для обычной задачи"
steps = [
  { text = "Управляемая задача создана с рекомендацией R2: объём заметный, но поведение ясно и проверяемо. В заголовке её Issue есть префикс `[R2]`.", emphasis = ["рекомендацией R2"] },
  { text = "Агент из рабочей копии задачи запускает `route-claude` без `--profile`. Платформа сверяет рекомендацию с текущим репозиторием, подтверждает её и записывает профиль `standard`." },
  { text = "Супервизор открывает делегирование командой `begin-claude-delegation` и вызывает дочернего исполнителя в той же рабочей копии." },
  { text = "Исполнитель закончил, супервизор просмотрел дифф и записал результат командой `record-claude-execution`. Запись остаётся самоотчётом и не доказывает запуск.", emphasis = ["самоотчётом"] },
  { text = "Теперь у задачи есть записанный маршрут, и работа переходит к этапу 4." },
]
