id = "incubator"
kind = "part"
title = "Инкубатор"
definition = "Место для идей, которые ещё не приняты в работу: короткая запись, причина помнить и условие пересмотра."
role = "artifact"
lead = "Инкубатор хранит потенциально полезные идеи, которые ещё не приняты в работу. Это обычные открытые Issue с меткой `incubator` в репозитории бэклога, без метки проекта, приоритета, Requirement, пакета OpenSpec, решения о маршруте и права на исполнение."
thesis = "Запись идеи не делает её задачей. Из инкубатора идея выходит только после явного решения человека, и тогда становится обычным Business Requirement, а не напрямую пакетом OpenSpec."
sources = [
  "docs/engineering/task-intake.md#Incubator",
]

[[used_in]]
stage = "requirement-intent"

[[inputs]]
title = "Идея или гипотеза"
text = "Мысль, которую стоит сохранить, но которую пока никто не принял как работу."
role = "actor"
node = "requirement-intent"
note = "← этап 1"

[[inputs]]
title = "Решение человека"
text = "Явное принятие идеи как работы; без него запись остаётся в инкубаторе."
role = "actor"

[action]
label = "park"
title = "Запись и выход из инкубатора"
steps = [
  "Записать коротко: целевой репозиторий, идею или гипотезу, причину помнить и условие пересмотра.",
  "Создать или обновить обычный Issue с меткой `incubator`; метку `project:*` не добавлять.",
  "Дождаться события из условия пересмотра: предпочтителен признак по свидетельствам, а не календарная дата.",
  "При явном принятии создать или переиспользовать Business Requirement путём фиксации и на этом остановиться.",
  "Закрыть Issue инкубатора ссылкой на Requirement.",
]

[[outputs]]
title = "Запись в инкубаторе"
text = "Issue с меткой `incubator`, видимый в отдельном представлении проекта, если оно настроено."
role = "artifact"
consumer = "будущий пересмотр"

[[outputs]]
title = "Business Requirement"
text = "Появляется только после явного принятия идеи как работы."
role = "artifact"
consumer = "→ требование"
node = "requirement-intake"

[[path]]
title = "Идея сразу в OpenSpec"
tag = "запрет"
role = "gate"
when = "Появляется соблазн превратить припаркованную идею сразу в пакет OpenSpec или начать реализацию."
outcome = "так делать нельзя: только принятие и обычная фиксация Requirement"

[[path]]
title = "Проект GitHub недоступен для записи"
tag = "не блокирует"
role = "neutral"
when = "Текущая поверхность агента не может менять представления и поля проекта GitHub."
outcome = "запись Issue всё равно создаётся, а автоматизация и представления проекта покажут её, когда они настроены"

[[path]]
title = "Основные представления проекта"
tag = "скрыто"
role = "neutral"
when = "Issue с меткой `incubator` попадает в проект бэклога."
outcome = "основные представления Requirement исключают метки `incubator` и `type:internal-change`; метку проекта не добавляют ради появления в проекте"

[example]
title = "Пример: идея ждёт условия"
steps = [
  { text = "Во время работы агент замечает возможное улучшение маршрутизации, но данных для решения мало. Человек говорит, что это идея на потом." },
  { text = "Агент создаёт Issue с меткой incubator: цель, гипотеза, причина помнить и условие пересмотра «после того, как накопится достаточно выполнений маршрутизации».", emphasis = ["incubator"] },
  { text = "Метки проекта и приоритета нет, пакета OpenSpec и маршрута тоже нет, поэтому никакой агент не может принять запись за разрешение на работу." },
  { text = "Когда условие наступило, человек явно принимает идею. Агент создаёт Business Requirement обычной фиксацией и закрывает Issue инкубатора ссылкой на него." },
]
