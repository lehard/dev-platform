id = "publication-integration"
kind = "stage"
title = "Публикация и интеграция"
definition = "Проверенная ветка становится PR и проходит очередь. Доставкой считается только состояние MERGED и синхронизированный локальный main."
order = 6
short_title = "Публикация"
tagline = "PR → очередь → main"
children = ["pr-queue-integration", "independent-review", "verification-checks", "add-openspec", "requirement-intake"]
terms = ["pr", "coordinator"]
lead = "Проверенный кандидат публикуется как PR на точной версии и проходит очередь публикации. Платформа финализирует его, то есть архивирует изменение OpenSpec, а затем координатор по одному вливает в кандидатов свежий `main`, запускает обязательный CI на итоговой версии и сливает с защитой от сдвига версии."
thesis = "Ветка, открытый PR и зелёный CI ещё не доставка. Доставкой считается состояние `MERGED` у точного PR и синхронизированный локальный `main`."
sources = [
  "docs/engineering/agent-workflow.md#Completion",
  "docs/engineering/agent-workflow.md#Source publication queue",
  "docs/engineering/agent-workflow.md#Candidate and integration contours",
  "docs/engineering/agent-workflow.md#Central source dogfood lifecycle",
  "openspec/specs/publication-queue/spec.md#Requirement: Coordinator verifies the actual current-base candidate",
  "docs/engineering/task-intake.md#Requirement-first cross-surface contract",
]

[[transitions]]
to = "release-rollout"
type = "conditional"
reason = "Только если слит release PR с новой версией платформы"

[[transitions]]
to = "feedback-learning"
type = "main"
reason = "После каждой нетривиальной задачи проводится ретроспектива"
label = "ретроспектива после каждой задачи"

[[inputs]]
title = "Проверенный кандидат"
text = "Выбранные проверки запущены с доказательствами, семантическая проверка записана, кандидат и доказательства закоммичены, а friction-чекпоинт записан на этой же версии."
role = "stage"
node = "verification"
note = "← этап 5"

[[inputs]]
title = "Очередь публикации"
text = "Заявка в GitHub-очереди: комментарий приёма с порядком и метки `publication:queued`, `publication:active` и `publication:blocked`."
role = "external"
node = "pr-queue-integration"

[[inputs]]
title = "Актуальный main"
text = "Защищённая ветка и обязательные проверки `validate`; ни то ни другое не обходится."
role = "external"

[action]
label = "publish"
title = "От finish до MERGED"
steps = [
  "`dogfood_task.py finish` публикует PR на точной версии, принимает его в очередь как `review-pending` и освобождает заявку разработчика, не дожидаясь CI, ревью и слияния.",
  "Воркеры проводят кандидата через ревью, доработку и финализацию; финализация архивирует изменение OpenSpec для неизменного содержимого.",
  "Координатор берёт готовых кандидатов по одному, сливает в кандидата текущий `main`, если слияние чистое, и запускает обязательный CI на итоговой версии.",
  "Слияние выполняется с защитой от сдвига версии; защита ветки и обязательные проверки не обходятся.",
  "Затем `finish` сверяет локальный `main` и карточку задачи. Задача доставлена, когда GitHub сообщает `MERGED`, а локальный `main` синхронизирован.",
]

[[outputs]]
title = "Доставленное изменение"
text = "Точный PR в состоянии `MERGED`, синхронизированный локальный `main`, а в карточке управляемой задачи `Done`."
role = "stage"
consumer = "→ этап 8"
node = "feedback-learning"

[[outputs]]
title = "Слитый release PR"
text = "Если слит PR, меняющий `VERSION`, начинается выпуск версии платформы."
role = "stage"
consumer = "→ этап 7, только для релиза"
node = "release-rollout"

[[outputs]]
title = "Закрытое требование"
text = "Когда точно слиты все обязательные дочерние задачи, терминальная сверка ставит родителю `Done` и закрывает его Issue."
role = "artifact"
consumer = "бэклог"
node = "requirement-intake"

[[fork]]
title = "Развилка: интеграция в main"
note = "Блокировка одного кандидата не мешает следующим независимым готовым кандидатам. Попытки интеграционной доработки ограничены."

[[fork.branch]]
name = "Чистое слияние"
code = "clean merge"
role = "stage"
recognized = "Слияние текущего `main` в кандидата проходит без конфликта."
creates = "Обязательный CI запускается на итоговой версии; при зелёном результате PR сливается с защитой от сдвига версии."
next = "→ 8 Обратная связь"
next_node = "feedback-learning"

[[fork.branch]]
name = "Конфликт или красный CI"
code = "integration repair"
role = "gate"
recognized = "Реальный конфликт слияния или упавшая обязательная проверка на итоговой версии."
creates = "Создаётся задание интеграционной доработки. Если оно меняет содержимое задачи, ревью, финализация и архив повторяются; иначе прежние доказательства переиспользуются. После предела попыток кандидат блокируется."
next = "PR, очередь и интеграция"
next_node = "pr-queue-integration"

[[path]]
title = "Кандидат заблокирован"
tag = "blocked"
role = "gate"
when = "PR получил метку `publication:blocked`: версия задачи изменилась, пути пересеклись, возник конфликт или упала проверка."
outcome = "причину показывает `dogfood_task.py status`; после нового коммита нужно повторить проверки и `finish`, а метки очереди вручную не правят"

[[path]]
title = "Появилась новая версия ветки"
tag = "повторный приём"
role = "actor"
when = "Разработчик добавил коммит в тот же PR, пока кандидат ждёт ревью, доработки или решения."
outcome = "следующий `finish` принимает потомка заново и сохраняет пройденное ревью, если содержимое задачи не изменилось; закрывать PR и открывать новый нельзя"

[[path]]
title = "Main сдвинулся"
tag = "без участия разработчика"
role = "neutral"
when = "Пока кандидат ждал, другие PR изменили `main`."
outcome = "финализация не вливает `main` и не требует действий разработчика; координатор сам вольёт `main` и запустит CI на итоговой версии"

[[path]]
title = "Агент завершил работу раньше слияния"
tag = "возобновление"
role = "actor"
when = "Сессия агента закончилась, а PR ещё в очереди."
outcome = "состояние восстанавливается из GitHub; после точного слияния повторный `finish` довершает локальную сверку и работу с карточкой"

[[path]]
title = "Промежуточное состояние"
tag = "не доставка"
role = "gate"
when = "Ветка отправлена, PR открыт, автослияние включено или CI зелёный, но PR не в состоянии `MERGED`."
outcome = "это нетерминальные состояния: о завершении сообщать нельзя"

[[path]]
title = "Права приложения координатора"
tag = "оператор"
role = "external"
when = "Координатору отказано в записи комментария, метки, обновлении ветки или слиянии из-за прав приложения GitHub."
outcome = "оператор проверяет запуск workflow `Dev Platform publication queue` и чинит права или учётные данные приложения; защита ветки не обходится"

[example]
title = "Пример: от finish до MERGED"
steps = [
  { text = "Разработчик выполняет `finish`. Платформа публикует PR на точной версии, принимает его как review-pending и освобождает агента.", emphasis = ["review-pending"] },
  { text = "Воркеры проводят ревью без замечаний и финализацию: архив OpenSpec фиксируется в ветке кандидата." },
  { text = "Пока кандидат ждал, другой PR изменил `main`. Координатор сливает свежий `main` в кандидата без конфликта, и разработчику ничего делать не нужно." },
  { text = "Обязательный CI проходит на итоговой версии, и координатор сливает PR с защитой от сдвига версии." },
  { text = "GitHub сообщает `MERGED`. `finish` сверяет локальный `main` и карточку, и только теперь задача доставлена.", emphasis = ["только теперь задача доставлена"] },
]
