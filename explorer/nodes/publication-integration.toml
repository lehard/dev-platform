id = "publication-integration"
kind = "stage"
title = "Публикация и слияние"
definition = "finish публикует проверенную ветку как PR и включает auto-merge. Доставкой считается только состояние MERGED и синхронизированный локальный main."
order = 6
short_title = "Публикация"
tagline = "finish → PR → main"
children = ["pr-queue-integration", "independent-review", "verification-checks", "add-openspec", "requirement-intake"]
terms = ["pr"]
lead = "Команда `finish` выполняет всю публикацию сама. При включённом ревью она запускает его, архивирует изменение OpenSpec, публикует один PR на точной версии и включает auto-merge. Сливает PR GitHub, когда обязательные проверки зелёные."
thesis = "Ветка, открытый PR и зелёный CI ещё не доставка. Доставкой считается состояние `MERGED` у точного PR и синхронизированный локальный `main`."
sources = [
  "docs/engineering/agent-workflow.md#Completion",
  "docs/engineering/agent-workflow.md#Central source dogfood lifecycle",
  "docs/engineering/lifecycle-map.md#Lifecycle",
  "openspec/specs/platform-lifecycle/spec.md#Requirement: Automatic merge intent is exact-head guarded and durable when GitHub supports it",
  "docs/engineering/task-intake.md#Requirement-first cross-surface contract",
]

[[transitions]]
to = "release-rollout"
type = "conditional"
reason = "Только если слит release PR с новой версией платформы"

[[transitions]]
to = "feedback-learning"
type = "main"
reason = "После каждой нетривиальной задачи проводится ретроспектива"
label = "ретроспектива после каждой задачи"

[[inputs]]
title = "Проверенная ветка"
text = "Выбранные проверки запущены с доказательствами, семантическая проверка записана, ветка и доказательства закоммичены, а friction-чекпоинт записан на этой же версии."
role = "stage"
node = "verification"
note = "← этап 5"

[[inputs]]
title = "Актуальный main"
text = "Защищённая ветка и обязательные проверки `validate`; ни то ни другое не обходится. Ветка задачи не должна отставать от `main`."
role = "external"

[action]
label = "finish"
title = "От finish до MERGED"
steps = [
  "`dogfood_task.py finish` запускает независимое ревью, если оно включено, затем архивирует изменение OpenSpec и коммитит архив.",
  "`finish` проверяет friction-чекпоинт и публикует один PR на точной версии.",
  "Платформа убеждается, что слияние защищено обязательными проверками, и вызывает `gh pr merge --auto --squash --match-head-commit`.",
  "GitHub сливает PR, когда обязательные проверки зелёные, а версия не изменилась.",
  "Повторный `finish` после слияния сверяет локальный `main`, карточку задачи и родительский Requirement. Задача доставлена, когда GitHub сообщает `MERGED`, а локальный `main` синхронизирован.",
]

[[outputs]]
title = "Доставленное изменение"
text = "Точный PR в состоянии `MERGED`, синхронизированный локальный `main`, а в карточке управляемой задачи `Done`."
role = "stage"
consumer = "→ этап 8"
node = "feedback-learning"

[[outputs]]
title = "Слитый release PR"
text = "Если слит PR, меняющий `VERSION`, начинается выпуск версии платформы."
role = "stage"
consumer = "→ этап 7, только для релиза"
node = "release-rollout"

[[outputs]]
title = "Закрытое требование"
text = "Когда точно слиты все обязательные дочерние задачи и записана ретроспектива требования, терминальная сверка в той же сессии ставит родителю `Done` и закрывает его Issue."
role = "artifact"
consumer = "бэклог"
node = "requirement-intake"

[[fork]]
title = "Развилка: что показали обязательные проверки"
note = "Других способов слияния нет. Исправление идёт в той же ветке и в том же PR."

[[fork.branch]]
name = "Проверки зелёные"
code = "auto-merge"
role = "stage"
recognized = "Обязательные проверки прошли на точной версии PR."
creates = "GitHub сливает PR сам. Повторный `finish` сверяет локальный `main`, карточку и родительский Requirement."
next = "→ 8 Обратная связь"
next_node = "feedback-learning"

[[fork.branch]]
name = "Проверка упала"
code = "required check failed"
role = "gate"
recognized = "Обязательная проверка упала на точной версии PR."
creates = "Разработчик исправляет причину в той же ветке, снова запускает проверки и `finish`. Команда включает auto-merge для новой версии."
next = "→ 4 Исполнение"
next_node = "isolated-implementation"

[[path]]
title = "Обязательных проверок нет"
tag = "отказ"
role = "gate"
when = "Ни одна обязательная проверка не защищает слияние."
outcome = "`finish` отказывается сливать и называет причину; нужно потребовать проверку для базовой ветки или задать `pr_merge_mode=manual`"

[[path]]
title = "GitHub отказал в auto-merge"
tag = "отказ"
role = "gate"
when = "Например, auto-merge выключен в настройках репозитория."
outcome = "`finish` останавливается с причиной GitHub; другие способы слияния не пробуются"

[[path]]
title = "Main сдвинулся"
tag = "сверка"
role = "gate"
when = "Пока шли проверки, в `main` попали другие изменения, и ветка задачи отстала."
outcome = "`finish` не публикует отставшую ветку; нужно выполнить `dogfood_task.py reconcile`, повторить проверки и снова запустить `finish`"

[[path]]
title = "Агент завершил работу раньше слияния"
tag = "возобновление"
role = "actor"
when = "Сессия агента закончилась, а PR ещё ждёт проверок."
outcome = "GitHub держит запрос на слияние сам; после слияния повторный `finish` довершает локальную сверку и работу с карточкой"

[[path]]
title = "Промежуточное состояние"
tag = "не доставка"
role = "gate"
when = "Ветка отправлена, PR открыт, auto-merge включён или CI зелёный, но PR не в состоянии `MERGED`."
outcome = "это нетерминальные состояния: о завершении сообщать нельзя"

[example]
title = "Пример: от finish до MERGED"
steps = [
  { text = "Разработчик выполняет `finish`. Ревью включено и замечаний не находит, изменение архивируется, а PR публикуется на точной версии." },
  { text = "Платформа видит обязательную проверку `validate` и включает auto-merge для этой версии.", emphasis = ["auto-merge"] },
  { text = "Проверка проходит, и GitHub сливает PR." },
  { text = "Разработчик снова запускает `finish`. Команда видит `MERGED`, сверяет локальный `main` и карточку, и только теперь задача доставлена.", emphasis = ["только теперь задача доставлена"] },
]
