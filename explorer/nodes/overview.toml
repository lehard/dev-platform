id = "overview"
kind = "overview"
title = "Dev Platform"
heading = "Вся Dev Platform"
kicker = "DEV PLATFORM · КАК УСТРОЕНА ПЛАТФОРМА"
headline = "Dev Platform: путь изменения от намерения до результата"
subhead = "Слева проводник по узлам. Справа то, что происходит в выбранном узле, откуда к нему приходит работа и куда она идёт."
definition = "Общий для нескольких репозиториев порядок инженерной работы с агентами: от намерения человека до проверенного результата в main."
lead = "Dev Platform — общий для нескольких репозиториев порядок инженерной работы с агентами-исполнителями. Она превращает намерение человека в проверяемый контракт, назначает исполнителя, изолирует его работу, проверяет результат, доводит изменение до `main` и возвращает уроки обратно в процесс."
thesis = "Когда агенты пишут код быстро, узким местом становятся контекст, координация, проверка и интеграция. Платформа делает эти шаги частью версионируемого процесса, а не устной договорённостью в каждом репозитории."
responsible = [
  "Путь изменения: от требования до доставки в `main` и проверки результата.",
  "Правила для агентов в `AGENTS.md` и исполняемые проверки к ним.",
  "Выбор исполнителя между Codex и Claude Code и запись того, кто делал работу.",
  "Изоляция параллельной работы, публикация и интеграция.",
  "Неизменяемые релизы и обновление подключённых проектов через Copier.",
  "Сбор затруднений агентов и превращение их в улучшения процесса.",
]
not_responsible = [
  "Предметные правила конкретных продуктов: они принадлежат самим проектам.",
  "Работу самого агента: платформа управляет Codex и Claude Code, но не заменяет их.",
  "Живое управление агентами и очередями: Explorer только объясняет устройство.",
  "Реестр проектов, учётные данные и локальные пути оператора: они хранятся вне публичного ядра.",
]
schema_note = "Не каждый запрос проходит все восемь этапов. Обсуждение ничего не создаёт, фиксация останавливается в бэклоге, быстрая задача идёт сразу к исполнению, а релиз нужен только при выпуске новой версии платформы."
cta = "Пройти жизненный цикл →"
maintenance_auto = [
  "Уровень 3: документы, спецификации OpenSpec, решения и возможности, включая новые, без правки карты.",
  "Ссылки на источники на точном коммите, проверка, что файл и раздел существуют.",
  "Дерево, хлебные крошки, обратные связи «где используется», индекс узлов.",
]
maintenance_editorial = [
