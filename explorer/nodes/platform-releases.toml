id = "platform-releases"
kind = "mechanism"
title = "Релизы платформы"
definition = "Новая версия появляется только через явный release PR; после слияния создаётся тег vX.Y.Z, который никогда не перемещается и не используется повторно."
order = 9
role = "mechanism"
terms = ["immutable-tag", "pr"]
lead = "Новая версия платформы появляется только через явный release PR, который меняет `VERSION`. После слияния на этом коммите создаётся неизменяемый тег `v<VERSION>`, который никогда не перемещается и не используется повторно."
thesis = "Проекты обновляются не из изменяемой ветки, а до точной опубликованной версии. Поэтому номер версии определяется последствиями для существующего проекта, установка проверяется до создания тега, а публикация версии сама по себе не запускает раскатку."
sources = [
  "docs/release-policy.md#Release identity",
  "docs/release-policy.md#Choosing the version",
  "docs/release-policy.md#Version publication",
  "docs/release-policy.md#Upgrade safety",
  "docs/release-policy.md#Copier version",
]

[[used_in]]
stage = "release-rollout"

[[inputs]]
title = "Release PR"
text = "Явный PR, единственный способ изменить `VERSION`; его слияние начинает выпуск."
role = "stage"
node = "publication-integration"
note = "← этап 6"

[[inputs]]
title = "Изменения с прошлого тега"
text = "Автор release PR классифицирует каждое изменение с точки зрения существующего проекта, который обновляется с предыдущего тега."
role = "artifact"

[[inputs]]
title = "Проверка установки"
text = "`validate_release_installation.py` выполняет реальные свежие рендеры и обновления Copier от последнего стабильного тега до создания нового."
role = "gate"

[action]
label = "release"
title = "От PR до тега"
steps = [
  "Автор release PR классифицирует каждое изменение и берёт старший требуемый компонент версии: MAJOR, MINOR или PATCH.",
  "В описании PR перечисляются изменения, определившие номер, а для MAJOR ещё и ручное действие для каждого затронутого проекта; при сомнении выбирается старший компонент.",
  "Платформенный CI и публикация запускают `validate_release_installation.py` до создания неизменяемого тега.",
  "После слияния workflow `publish-version.yml` создаёт тег `v<VERSION>` на этом коммите и отказывается перемещать существующий.",
  "Только если оператор включил раскатку, `rollout_dispatch_gate.py` разрешает диспетчеризацию раскатки для этого точного тега; иначе шаг пропускается.",
]

[[outputs]]
title = "Тег версии"
text = "Неизменяемый тег SemVer вида `v1.0.1` на коммите release PR; GitHub Immutable Releases должны оставаться включёнными."
role = "artifact"
consumer = "все проекты и раскатка"
node = "copier-rollout"

[[outputs]]
title = "Описание release PR"
text = "Список изменений, определивших компонент версии, и ручные действия для MAJOR."
role = "artifact"
consumer = "рецензент и проекты"

[[outputs]]
title = "Решение о раскатке"
text = "Диспетчеризация раскатки разрешается только включённой оператором переменной; публикация версии не означает раскатку по всем проектам."
role = "gate"
consumer = "оператор"

[[fork]]
title = "Развилка: какой компонент версии поднять"
note = "Точка зрения всегда одна: существующий проект обновляется с предыдущего тега. При неуверенности выбирают старший компонент."

[[fork.branch]]
name = "MAJOR"
code = "ломает обновление"
role = "gate"
recognized = "Существующий проект не может обновиться без ручного действия или ломается после обычного PR раскатки: удалена или переименована используемая команда, вопрос Copier без безопасного значения по умолчанию, запись, которую новый код не принимает, новая обязательная настройка или учётные данные, повышен минимум Copier, Git или Python, либо зелёный CI проекта стал красным."
creates = "Описание PR называет ручное действие для каждого затронутого проекта."
next = "→ тег версии"

[[fork.branch]]
name = "MINOR"
code = "новая возможность"
role = "mechanism"
recognized = "Появилась возможность, которую проекты принимают через обычный PR раскатки без ручных шагов: новая команда или флаг, новый вопрос Copier с безопасным значением по умолчанию, новая необязательная настройка, новый постоянный файл, новое состояние жизненного цикла, проверка или путь восстановления."
creates = "Следующий минорный номер; ручных действий нет."
next = "→ тег версии"

[[fork.branch]]
name = "PATCH"
code = "только исправление"
role = "neutral"
recognized = "Изменение только восстанавливает поведение, уже закреплённое принятой спецификацией или документированным контрактом, либо правит документацию и тесты."
creates = "Следующий патч-номер. Всё из списка MINOR патчем не считается, даже если доставлено как исправление."
next = "→ тег версии"

[[path]]
title = "Тег уже существует"
tag = "отказ"
role = "gate"
when = "Публикация находит уже созданный тег этой версии."
outcome = "она отказывается его перемещать; опубликованный тег не меняют и не используют повторно"

[[path]]
title = "Установка не проходит"
tag = "тег не создаётся"
role = "gate"
when = "Свежий рендер или обновление от последнего стабильного тега, платформенные проверки диффа или `platform_doctor.py` не проходят."
outcome = "тег не создаётся; CI и публикация без полной истории и стабильного базового тега тоже завершаются ошибкой, а не пропускают проверку"

[[path]]
title = "Раскатка не включена"
tag = "только тег"
role = "neutral"
when = "Переменная репозитория `DEV_PLATFORM_MANAGED_ROLLOUT_ENABLED` не равна `true`."
outcome = "шаг диспетчеризации пропускается, версия опубликована, а проекты не затронуты"

[example]
title = "Пример: выбор номера и публикация"
steps = [
  { text = "С момента тега `v1.4.1` добавлена необязательная настройка, которую проекты принимают без ручных шагов, и исправлена ошибка в документации. Автор release PR выбирает старший компонент: MINOR.", emphasis = ["MINOR"] },
  { text = "Он меняет `VERSION` на `1.5.0` и перечисляет в описании PR изменения, определившие номер." },
  { text = "CI запускает `validate_release_installation.py`: свежий рендер и обновление с `v1.4.1` проходят платформенные проверки." },
  { text = "После слияния `publish-version.yml` создаёт тег `v1.5.0` на этом коммите, проверив, что такого тега ещё нет." },
  { text = "Переменная раскатки не включена, поэтому диспетчеризация пропущена: версия опубликована, но ни один проект не обновлялся." },
]

[[guarantees]]
title = "Тег не меняется"
text = "Опубликованный тег никогда не перемещается и не используется повторно. Версия `VERSION` меняется только в явном release PR."

[[guarantees]]
title = "Установка проверена заранее"
text = "Реальный свежий рендер и обновление от последнего стабильного тега проверяются до создания нового тега, без вызова проектных проверок и команд приложения."

[[guarantees]]
title = "Только точный тег"
text = "Раскатка берёт точный опубликованный тег через `--vcs-ref` и никогда не использует изменяемый `main` как источник обновления."

[[guarantees]]
title = "Версия Copier зафиксирована"
text = "Платформа проверяется ровно на Copier 9.18.2; смена этой версии является явным изменением платформы."
