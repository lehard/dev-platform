id = "goal-refinement"
kind = "part"
title = "Уточнение цели"
definition = "Короткий шаг для неясного существенного запроса: какой результат нужен и чем он подтверждается."
role = "mechanism"
lead = "Уточнение цели нужно только для неясного существенного запроса или когда пользователь явно просит работу с целью. Оно выясняет, какой результат нужен и чем он подтверждается, до того как начнётся авторинг OpenSpec или управляемой задачи."
thesis = "Уточнение ничего не сохраняет: ни файла цели, ни записи в бэклоге, ни плана. Его результат уточняет Requirement или пакет, а после материализации каноничен именно пакет."
sources = [
  "docs/engineering/agent-workflow.md#Selective goal definition",
]

[[used_in]]
stage = "requirement-intent"

[[inputs]]
title = "Неясный запрос"
text = "Существенный запрос, который не говорит, какой результат нужен или как его проверить."
role = "actor"
node = "requirement-intent"
note = "← этап 1"

[[inputs]]
title = "Явная просьба о цели"
text = "Пользователь прямо просит работу с целью; тогда применяют поддерживаемое нативное состояние цели, если оно есть."
role = "actor"

[action]
label = "refine"
title = "Короткое уточнение"
steps = [
  "Решить, нужно ли уточнение: оно нужно при явной просьбе о цели или при существенной неясности результата или доказательств успеха.",
  "Сформулировать пригодную цель: конкретный результат, доказательства проверки, осмысленный количественный или бинарный порог, границы объёма и условие остановки для уточнения.",
  "Если недостающий выбор может изменить результат, задать один короткий вопрос, а не выдумывать требование.",
  "Для явной цели через `/goal` или нативные инструменты сначала посмотреть активную цель, чтобы не создать дубликат; неясный запрос получает только временное уточнение в разговоре.",
]

[[outputs]]
title = "Уточнённый результат"
text = "Результат и доказательства уточняют Requirement или пакет OpenSpec; отдельного артефакта цели не создаётся."
role = "artifact"
consumer = "Requirement или пакет"
node = "requirement-intake"

[[outputs]]
title = "Короткий вопрос"
text = "Если без ответа результат может измениться, пользователь получает один краткий вопрос."
role = "actor"
consumer = "пользователь"

[[path]]
title = "Обычная конкретная задача"
tag = "не нужно"
role = "neutral"
when = "Задача быстрая или реализационная и уже конкретна."
outcome = "создавать цель не требуется"

[[path]]
title = "Нативная цель недоступна"
tag = "честно сообщить"
role = "gate"
when = "Пользователь явно просил нативную цель, а среда её не поддерживает."
outcome = "выполнить явно временное уточнение или сообщить ограничение; нельзя заявлять, что `create_goal` сработал, если среда этого не доказала"

[[path]]
title = "Бюджет токенов"
tag = "только по просьбе"
role = "neutral"
when = "Пользователь не называл бюджет токенов."
outcome = "бюджет в цель не включают"

[example]
title = "Пример: размытая просьба"
steps = [
  { text = "Пользователь пишет: «сделай сборку быстрее». Запрос существенный, но не говорит, какое время считать достаточным и как его мерить." },
  { text = "Агент не создаёт файл цели и не заводит запись в бэклоге, а задаёт один вопрос: до какого времени нужно ускорить и на каком запуске его измерять.", emphasis = ["один вопрос"] },
  { text = "Ответ превращается в конкретный результат и порог. Они входят в Requirement и дальше в пакет OpenSpec, а сама цель нигде отдельно не сохраняется." },
]
