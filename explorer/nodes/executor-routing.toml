id = "executor-routing"
kind = "mechanism"
title = "Маршрутизация исполнителей"
definition = "Уровень R2 или R3 записывается при подготовке задачи, перед реализацией подтверждается проверкой свежести и превращается в профиль и конкретную модель из настроек."
order = 3
role = "mechanism"
lead = "Решение о маршруте принимается дважды. При подготовке задачи записывается рекомендованный уровень: `R2` по умолчанию или `R3` при записанной жёсткой причине. Перед реализацией эта рекомендация подтверждается проверкой свежести и превращается в профиль, а затем в конкретную модель из настроек."
thesis = "Уровень, профиль и модель независимы друг от друга. Модели можно заменить, не трогая ни один Issue и ни один пакет OpenSpec, потому что в задаче записан только абстрактный уровень."
sources = [
  "docs/engineering/model-routing.md#Start-tier authoring (`R1`/`R2`/`R3`)",
  "docs/engineering/model-routing.md#Execution-time freshness check",
  "docs/engineering/model-routing.md#Review and escalation",
  "docs/engineering/model-routing.md#Routing calibration",
  "docs/engineering/model-routing.md#Changing bindings and rollback",
]

[[used_in]]
stage = "routing"

[[inputs]]
title = "Подготовка управляемой задачи"
text = "Создание пакета выполняет обычную ограниченную проверку репозитория, после чего записывает рекомендованный уровень."
role = "stage"
node = "specification"
note = "← этап 2"

[[inputs]]
title = "Жёсткий триггер"
text = "Причина для `R3` из ограниченного списка; без неё всегда рекомендуется `R2`."
role = "gate"

[[inputs]]
title = "Настройки `[model_routing]`"
text = "Раздел `.dev-platform.toml` сопоставляет профиль конкретной модели каждого провайдера и может быть заменён без правки задач."
role = "source"
note = ".dev-platform.toml"

[action]
label = "tier → profile → model"
title = "Два шага от уровня к модели"
steps = [
  "При создании задачи `managed_task.py create --bundle` записывает рекомендованный уровень и небольшую квитанцию маршрута; уровень виден как префикс `[R2]` или `[R3]` в заголовке Issue.",
  "Перед реализацией `route-codex` или `route-claude` без `--tier` выполняет проверку свежести: `R2` превращается в профиль `standard`, `R3` в профиль `complex`.",
  "Профиль превращается в конкретную модель по `[model_routing]` в `.dev-platform.toml`.",
  "Если проверка обнаруживает новый жёсткий триггер, которого не было в авторской рекомендации, маршрут повышается через `escalate`.",
]

[[outputs]]
title = "Рекомендованный уровень"
text = "Один абстрактный уровень и квитанция маршрута с полями `rubric_version`, `task_family`, `routing_confidence`, `assurance`, `effort_hint` и `strong_trigger`."
role = "artifact"
consumer = "пакет и Issue"

[[outputs]]
title = "Подтверждённый маршрут"
text = "Профиль, провайдер и план исполнения, которые записываются в файл маршрута задачи."
role = "artifact"
consumer = "исполнители"
node = "executors"

[[outputs]]
title = "Отчёт калибровки"
text = "Только читающая сводка по записанным маршрутам, которая ничего не переключает."
role = "artifact"
consumer = "оператор"

[[guarantees]]
title = "R2 по умолчанию"
text = "Большой дифф, много файлов, заметность и цена ошибки сами по себе не требуют `R3`: они могут повысить `assurance`, а исполнение остаётся на `R2`, если поведение ясно и проверяемо."

[[guarantees]]
title = "R3 только по записанной причине"
text = "Жёсткий триггер берётся из списка `unresolved_architecture`, `unknown_diagnosis`, `weak_verification_high_consequence`, `novel_cross_system`, `trustworthy_escalation_history`, `prior_balanced_failure` и задаётся флагом `--strong-trigger`."

[[guarantees]]
title = "Уровень не равен модели"
text = "Переход от уровня к профилю зафиксирован в коде, а от профиля к модели задаётся настройкой, поэтому состав моделей меняется без правки задач."

[[guarantees]]
title = "R1 не используется"
text = "Уровень `R1` зарезервирован: авторинг его не рекомендует, а реальное исполнение на нём отклоняется до отдельного изменения."

[[guarantees]]
title = "Нельзя опуститься ниже авторского уровня"
text = "Понижение маршрута ниже записанного уровня в этой версии не поддерживается; повышение сохраняет OpenSpec, рабочую копию, находки и результаты проверок."

[[path]]
title = "Пакет без квитанции"
tag = "явный профиль"
role = "gate"
when = "Пакет подготовлен до появления рубрики и не несёт квитанции маршрута."
outcome = "он остаётся импортируемым, а исполнение требует явный `--tier`"

[[path]]
title = "Появился новый жёсткий триггер"
tag = "эскалация"
role = "gate"
when = "Проверка свежести или ход работы показывают конфликт с OpenSpec, неожиданный объём, низкую уверенность, повторные сбои проверки или новый жёсткий триггер."
outcome = "`model_routing.py escalate` повышает маршрут без перезапуска полезной работы и без бесконечных повторов дешёвой модели"

[[path]]
title = "Нужна калибровка рубрики"
tag = "только отчёт"
role = "neutral"
when = "Нужно понять, верно ли работает разделение `R2` и `R3`."
outcome = "`model_routing.py routing-calibration` читает записи и проверки и выдаёт совет, но сам не меняет рубрику, настройки или модели и не создаёт задач"

[[path]]
title = "Замена модели"
tag = "политика"
role = "mechanism"
when = "Нужно привязать профиль к другой стабильной модели."
outcome = "значения меняют одинаково в трёх местах и выпускают как обычное изменение шаблона; откат возвращает прежние значения тем же путём"

[example]
title = "Пример: от рекомендации до модели"
steps = [
  { text = "Ради объёма и ответственности изменение большое, но поведение ясно и проверяемо. При подготовке задача получает рекомендацию R2, а в заголовке Issue появляется префикс `[R2]`.", emphasis = ["рекомендацию R2"] },
  { text = "Перед реализацией исполнитель запускает `route-claude` без `--tier`. Платформа сверяет рекомендацию с текущим репозиторием, подтверждает её и записывает профиль standard.", emphasis = ["standard"] },
  { text = "Профиль `standard` превращается в алиас модели из раздела `[model_routing.claude]` настроек; в Issue и в пакете модели нет." },
  { text = "Во время работы выясняется, что причина сбоя неизвестна. Это новый жёсткий триггер unknown_diagnosis, поэтому исполнитель вызывает `escalate`, и работа продолжается на уровне `complex` без потери сделанного.", emphasis = ["unknown_diagnosis"] },
]
