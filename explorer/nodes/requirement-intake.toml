id = "requirement-intake"
kind = "mechanism"
title = "Requirement и intake"
definition = "Как принятая работа хранится в бэклоге, распознаётся, запускается и связывается со своими техническими задачами."
order = 1
role = "mechanism"
children = ["chatgpt-project", "incubator", "goal-refinement"]
terms = ["business-requirement"]
lead = "Принятая работа хранится как Business Requirement: Issue с меткой `type:requirement` в бэклоге разработки. Механизм intake создаёт его, запускает, связывает с техническими дочерними задачами и вычисляет прогресс по их фактическому состоянию."
thesis = "Требование остаётся единственным объектом, которым человек обычно управляет. Технический план живёт в дочерних задачах, а статус требования нигде не хранится отдельно: он каждый раз читается из их состояния."
sources = [
  "docs/engineering/task-intake.md#Requirement-first cross-surface contract",
  "docs/engineering/task-intake.md#Intent boundary",
  "docs/engineering/task-intake.md#Readable managed work identity",
  "dev-platform/capabilities/requirement-authoring.md",
]

[[used_in]]
stage = "requirement-intent"
note = "запись и запуск"

[[used_in]]
stage = "specification"
note = "подготовка и handoff"

[[used_in]]
stage = "publication-integration"
note = "Done родителя"

[[inputs]]
title = "Запрос или идея"
text = "Явная просьба зафиксировать или выполнить работу либо идея, которую пока только сохраняют."
role = "actor"
node = "requirement-intent"
note = "← этап 1"

[[inputs]]
title = "Стандарт текста"
text = "Перед записью или существенным изменением тела автор применяет единый стандарт: текущее согласованное решение без истории, с сохранением всех существенных деталей."
role = "source"
note = "requirement-authoring.md"

[[inputs]]
title = "Настройка бэклога"
text = "Раздел `[development_backlog]` конфигурации задаёт репозиторий бэклога, метку проекта и приоритет по умолчанию."
role = "source"
note = ".dev-platform.toml"

[[inputs]]
title = "Готовые handoff"
text = "Конверты, которые подготовка проектирования выдаёт для каждого готового intent."
role = "artifact"
node = "add-openspec"
note = "← этап 2"

[action]
label = "intake"
title = "От записи до Done"
steps = [
  "`requirement_intake.py create` собирает тело из разделов Outcome, Context, Acceptance evidence, Target repository и Exclusions, назначает метки и приоритет и читает Issue и карточку проекта обратно.",
  "`requirement_intake.py start` забирает карточку со статусом `In progress` и запускает подготовку `orchestrate_pre_authoring.py` под идентичностью `requirement-<номер>`.",
  "`materialize-handoff` создаёт или точно переиспользует один управляемый Issue типа `type:internal-change` для каждого готового handoff и подтверждает связь в обе стороны; `link-child` связывает задачу, созданную отдельно.",
  "`execute_requirement.py advance` запускает или возобновляет по одной дочерней задаче в её worktree и возвращает `implement-child`, когда нужна работа агента.",
  "`aggregate` показывает прогресс из состояния дочерних задач; терминальная сверка после слияния каждой обязательной дочерней задачи ставит `Done` и закрывает Issue.",
]

[[outputs]]
title = "Requirement в бэклоге"
text = "Issue с меткой `type:requirement` и разделами Outcome, Context, Acceptance evidence, Target repository и Exclusions, а в проекте бэклога карточка со статусом `Backlog`."
role = "artifact"
consumer = "владелец и агенты"
node = "business-requirement"

[[outputs]]
title = "Дочерние технические задачи"
text = "Каждая несёт метку `type:internal-change` и ссылку на родителя; читаемый идентификатор имеет вид `BR-7/T2`."
role = "stage"
consumer = "→ этап 3"
node = "routing"

[[outputs]]
title = "Прогресс требования"
text = "Стадия вычисляется командой `aggregate` из дочерних задач и локальных свидетельств и не записывается в поле Requirement."
role = "artifact"
consumer = "владелец и карточка"

[[outputs]]
title = "Закрытое требование"
text = "После точного слияния всех обязательных дочерних задач и родительской ретроспективы карточка получает `Done`."
role = "stage"
consumer = "→ этап 8"
node = "feedback-learning"

[[fork]]
title = "Развилка: сколько дочерних задач и как их доставлять"
note = "Одно требование может законно породить несколько технических задач. Совместная доставка нужна только тогда, когда результат нельзя принять по частям."

[[fork.branch]]
name = "Одна дочерняя задача"
code = "обычная публикация"
role = "stage"
recognized = "Подготовка выдала один готовый handoff."
creates = "Задача идёт обычным управляемым путём публикации, а родитель сверяется после точного слияния дочернего PR."
next = "→ 6 Публикация"
next_node = "publication-integration"

[[fork.branch]]
name = "Несколько задач вместе"
code = "общий кандидат"
role = "gate"
recognized = "Запланированы две или больше обязательные дочерние задачи, которые нужно доставить совместно."
creates = "После первой проверенной задачи `advance` открывает один общий черновой PR, и каждая следующая готовая задача добавляется в ту же ветку fast-forward. PR готов к слиянию, только когда присутствуют все обязательные задачи, записана ретроспектива требования и на итоговой версии прошли полные проверки."
next = "→ 6 Публикация"
next_node = "publication-integration"

[[path]]
title = "Репозиторий не готов"
tag = "стоп"
role = "gate"
when = "Целевой репозиторий не доказал управляемый процесс: маршрут бэклога, OpenSpec и защищённую публикацию."
outcome = "фиксация и выполнение останавливаются сразу и называют недостающее и поддерживаемый маршрут"

[[path]]
title = "Карточка не подтвердилась"
tag = "повтор"
role = "actor"
when = "Issue создан, но его членство в проекте бэклога с инициализированным статусом не подтверждено."
outcome = "Issue сохраняется, команда сообщает об ошибке, повтор с тем же заголовком и телом продолжает тот же Issue, а оператор может добавить карточку командой `reconcile-board`"

[[path]]
title = "Возможный дубликат"
tag = "подтверждение"
role = "gate"
when = "В том же проекте уже есть похожая управляемая задача."
outcome = "нужно явное проверенное подтверждение `--confirm-distinct`; существенный конфликт контрактов по-прежнему останавливает работу"

[[path]]
title = "Конфликт идентичности"
tag = "fail closed"
role = "gate"
when = "Читаемые идентификаторы дочерних задач вступают в противоречие: конфликтующие заявки, повторяющиеся номера или потерянная заявка."
outcome = "операция останавливается, пока человек не проверит записи обоих Issue; резервирования номеров в теле родителя не редактируют и не удаляют"

[[path]]
title = "Нет ретроспективы требования"
tag = "блок Done"
role = "gate"
when = "Перед терминальной сверкой нет родительской ретроспективы или она устарела."
outcome = "родитель не получает `Done`; нужно выполнить `requirement_retrospective.py review-path` и `checkpoint` заново"

[[path]]
title = "Источник прогресса неясен"
tag = "unknown"
role = "neutral"
when = "Источник свидетельств нечитаем, устарел, не поддержан или противоречит другому."
outcome = "стадия читается как `unknown`, а явная блокировка дочерней задачи или эскалация оркестратора читается как `blocked`"

[[path]]
title = "Родитель доставлен ранее"
tag = "повторная сверка"
role = "actor"
when = "Requirement был доставлен до того, как прошла терминальная сверка."
outcome = "`requirement_terminal.py reconcile` повторяет сверку; операция идемпотентна"

[example]
title = "Пример: от записи до Done"
steps = [
  { text = "Владелец просит зафиксировать улучшение. Агент пишет Requirement по стандарту и создаёт его командой create; команда проверяет метки и карточку проекта и останавливается.", emphasis = ["create"] },
  { text = "Позже владелец говорит «возьми в работу». Команда start переводит карточку в `In progress`, и подготовка получает идентичность `requirement-<номер>`.", emphasis = ["start"] },
  { text = "Подготовка выдаёт два готовых handoff. `materialize-handoff` создаёт две дочерние задачи BR-7/T1 и BR-7/T2, помеченные `type:internal-change`, и подтверждает связь в обе стороны.", emphasis = ["BR-7/T1", "BR-7/T2"] },
  { text = "`advance` стартует первую дочернюю задачу в её worktree. Когда она проверена, открывается общий черновой PR, и вторая задача добавляется в него после своей проверки." },
  { text = "Когда присутствуют обе задачи, записана родительская ретроспектива и пройдены полные проверки, PR сливается. Терминальная сверка ставит Done и закрывает Issue.", emphasis = ["Done"] },
]

[[guarantees]]
title = "Только бизнес-язык"
text = "Requirement не содержит `proposal.md`, `design.md`, `tasks.md`, дельты OpenSpec, плана по файлам и технической декомпозиции."

[[guarantees]]
title = "Фиксация останавливается"
text = "Просьба только записать работу всегда заканчивается созданием Requirement: подготовка, OpenSpec и реализация не начинаются."

[[guarantees]]
title = "Повтор без дублей"
text = "Повторная фиксация с теми же данными продолжает тот же Issue, а повторная материализация точно переиспользует задачу и достраивает прерванную связь."

[[guarantees]]
title = "Нет второго реестра статуса"
text = "Прогресс читается из свидетельств и дочерних задач, и ни одно поле Requirement его не хранит. Неясный или противоречивый источник читается как `unknown`."

[[guarantees]]
title = "Done только после доставки"
text = "Карточка получает `Done`, а Issue закрывается только после точного слияния каждой обязательной дочерней задачи; статусы `Done` у детей или ready-квитанции сами этого не делают."
