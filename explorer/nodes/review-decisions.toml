id = "review-decisions"
kind = "part"
title = "Решения по замечаниям"
definition = "Отклонение с обоснованием или сохранённый блокер: неизменяемая запись рядом с отчётом."
role = "artifact"
lead = "Существенное замечание ревью нельзя оставить без последствий. Его исправляют, и ревью проходит заново, либо записывают решение рядом с отчётом: отклонение с обоснованием или сохранённый блокер. Сам отчёт ревьюера при этом не меняется."
thesis = "Решение привязано к дайджесту конкретного отчёта, а не к идее замечания вообще. Если отчёт устарел или заменён новым, прежнее отклонение его не покрывает."
sources = [
  "docs/engineering/openspec-workflow.md#Independent review evidence",
  "openspec/specs/completion-lifecycle/spec.md#Requirement: Material review findings require explicit disposition",
]

[[used_in]]
stage = "verification"

[[inputs]]
title = "Существенная находка"
text = "Находка отчёта ревью с `severity: material`, с которой автор не согласен или которую нельзя исправить сейчас."
role = "gate"
node = "review-perspectives"

[[inputs]]
title = "Неизменяемый отчёт"
text = "Отчёт ревьюера фиксируется платформой, и его дайджест служит ключом решения."
role = "artifact"
node = "independent-review"

[[inputs]]
title = "Обоснование"
text = "Непустой текст, объясняющий, почему замечание ошибочно, или причину сохранения блокера."
role = "actor"

[action]
label = "dispose"
title = "Запись решения"
steps = [
  "Определить, ошибочна ли находка. Если она верна, исправить её коммитом и повторить ревью.",
  "Для ошибочной находки выполнить `independent_review.py dispose <change> --perspective <perspective> --finding <id> --status rejected --rationale \"<почему>\"`.",
  "Для блокера, который нужно сохранить, указать `--status blocker`.",
  "Платформа записывает решение отдельной записью, связанной с дайджестом точного отчёта; сам отчёт не изменяется.",
]

[[outputs]]
title = "Запись решения"
text = "Отдельная запись рядом с отчётом, привязанная к дайджесту отчёта."
role = "artifact"
consumer = "проверка архива и публикации"

[[outputs]]
title = "Снятый блок"
text = "Отклонённая находка с обоснованием больше не блокирует завершение; сохранённый блокер продолжает его блокировать."
role = "gate"
consumer = "архив и `finish`"

[[path]]
title = "Недоступная точка зрения"
tag = "блок"
role = "gate"
when = "Одна из точек зрения недоступна, есть блокер или существенная находка без действующего отклонения."
outcome = "архив и публикация заблокированы: прошедшие детерминированные тесты не заменяют независимую проверку"

[[path]]
title = "Автор исправил код"
tag = "новое ревью"
role = "actor"
when = "Вместо отклонения замечание исправлено коммитом."
outcome = "содержимое задачи изменилось, поэтому нужна новая проверка, и прежнее решение к новому отчёту не относится"

[[path]]
title = "Отклонение предлагает воркер"
tag = "решает человек"
role = "gate"
when = "Воркер доработки предлагает отклонить существенную находку."
outcome = "кандидат ждёт решения человека; сам воркер отклонить находку не может"

[[path]]
title = "Пустое обоснование"
tag = "не принимается"
role = "gate"
when = "Решение записывается без обоснования."
outcome = "отклонение снимает блок только с непустым обоснованием"

[example]
title = "Пример: отклонение с обоснованием"
steps = [
  { text = "Ревьюер вернул существенную находку: ветка не обрабатывает значение, которое в этом сценарии не может появиться." },
  { text = "Автор проверил контракт и убедился, что значение исключено спецификацией. Он выполняет `dispose` со статусом rejected и обоснованием, на какой пункт спецификации опирается.", emphasis = ["rejected"] },
  { text = "Платформа записывает решение отдельной записью с дайджестом отчёта. Сам отчёт не меняется, и находка больше не блокирует архив." },
  { text = "После правки кода появляется новое ревью с новым отчётом. Прежнее решение к нему не относится, и находки оцениваются заново." },
]

[[guarantees]]
title = "Отчёты неизменяемы"
text = "Отклонение пишется отдельно и не переписывает отчёт ревьюера."

[[guarantees]]
title = "Привязка к дайджесту"
text = "Решение действует только для точного отчёта, поэтому оно не может прикрыть новую находку."
