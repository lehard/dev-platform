id = "friction-retrospectives"
kind = "mechanism"
title = "Friction и ретроспективы"
definition = "Значимые затруднения агентов записываются как обезличенные свидетельства, собираются в process issues и разбираются еженедельным обзором; сами задачи из них не создаются."
order = 11
role = "mechanism"
terms = ["friction"]
lead = "Затруднения агентов записываются как friction: это обезличенные свидетельства, а не задачи. Сырые данные остаются на машине, в репозиторий уходит только очищенный process issue, а периодический обзор группирует такие issue по причинам."
thesis = "Свидетельство не равно задаче. Разбор ничего не создаёт и не исполняет, а принятое улучшение проходит тот же путь контракта, проверки, релиза и раскатки, что любая другая работа платформы."
sources = [
  "docs/engineering/agent-workflow.md#Friction routing",
  "docs/engineering/agent-workflow.md#Post-task retrospective",
  "docs/promotion-loop.md",
  "README.md#Continuous improvement / friction loop",
]

[[used_in]]
stage = "feedback-learning"

[[inputs]]
title = "Затруднение агента"
text = "Поправка пользователя, повторный сбой, почти-нарушение безопасности, неописанный инвариант или лишние повторы."
role = "actor"

[[inputs]]
title = "Фактический путь задачи"
text = "Использованные нестандартные флаги, удачные ручные обходы, повторившиеся известные проблемы и дрейф чужого состояния."
role = "artifact"
node = "publication-integration"
note = "← этап 6"

[[inputs]]
title = "Вопросы проекта"
text = "Проект может добавить в `dev-platform/retrospective.toml` не больше пяти вопросов `[[question]]`; они показываются только когда изменённые файлы подходят и не заменяют общий шаблон."
role = "source"
note = "dev-platform/retrospective.toml"

[action]
label = "record → review → promote"
title = "От записи до улучшения"
steps = [
  "Записывать только значимое и без секретов: рутинные успешные сессии в журнал не попадают.",
  "`agent_friction.py record` сохраняет событие в локальном журнале, а роутер создаёт или обновляет очищенный process issue с отпечатком; в отпечаток не входят модель и провайдер.",
  "Перед завершением нетривиальной задачи пройти `review-path` и закрыть чекпоинт: `checkpoint --result none` с пометкой о проверенном пути либо привязка событий через `--event`.",
  "Периодический облачный обзор читает process issues, группирует симптомы по вероятной причине и сверяет вероятно решённые кандидаты с текущим состоянием репозитория.",
  "Общий кандидат продвигают командой `agent_friction.py promote <id> --dry-run`, а затем `promote <id>`: в центральном репозитории появляется Issue из очищенных данных.",
]

[[outputs]]
title = "Событие в журнале"
text = "Локальная запись, привязанная к задаче; сырые свидетельства остаются на машине."
role = "artifact"
consumer = "журнал и роутер"

[[outputs]]
title = "Process issue"
text = "Очищенный Issue с отпечатком, который принимает повторные появления; задачи, OpenSpec и PR из него не создаются."
role = "artifact"
consumer = "периодический обзор"

[[outputs]]
title = "Чекпоинт ретроспективы"
text = "Локальный маркер, привязанный к ветке и версии; без свежего чекпоинта `finish_task.py` не пропустит задачу."
role = "gate"
consumer = "`finish`"

[[outputs]]
title = "Принятое улучшение"
text = "Принятый общий кандидат становится изменением OpenSpec в центральном репозитории и идёт обычным путём."
role = "stage"
consumer = "→ этап 1"
node = "requirement-intent"

[cycle]
title = "Путь затруднения"

[[cycle.step]]
state = "record"
text = "значимое событие в локальном журнале"
arrow = "→"

[[cycle.step]]
state = "process issue"
text = "очищенное свидетельство, повторы добавляются в тот же issue"
arrow = "→"

[[cycle.step]]
state = "review"
text = "обзор группирует по причинам и классифицирует"
emphasis = "gate"
arrow = "→"

[[cycle.step]]
state = "promote"
text = "общий кандидат попадает в центральный репозиторий"
arrow = "→"

[[cycle.step]]
state = "OpenSpec"
text = "принятое улучшение оформляется изменением"
arrow = "→"

[[cycle.step]]
state = "release"
text = "релиз и раскатка в проекты"

[[cycle.note]]
tag = "одно событие"
text = "Одно событие ещё не становится постоянным правилом: свидетельства сравнивают по проектам."
role = "neutral"

[[cycle.note]]
tag = "обзор"
text = "Разбор остаётся отдельным от реализации и не создаёт задачи."
role = "gate"

[[fork]]
title = "Развилка: какого рода затруднение"
note = "Классификация важна, потому что от неё зависит, куда попадёт кандидат: счётчики лишь усиливают свидетельство и никогда не правят контекст и не запускают задачу."

[[fork.branch]]
name = "Процессное затруднение"
code = "process-friction"
role = "mechanism"
recognized = "Дефект инструмента, CI, жизненного цикла, worktree, аутентификации или процесса."
creates = "Очищенный process issue; повторы той же проблемы на разных моделях обновляют один issue."
next = "→ process issue"

[[fork.branch]]
name = "Пробел контекста"
code = "context-gap"
role = "artifact"
recognized = "Поправка или существенный сбой показывает, что стабильный контекст проекта отсутствовал или был понят неверно."
creates = "Событие с `--classification context-gap` и одной областью `--context-concern`: `product`, `domain`, `architecture`, `anti-pattern`, `example` или `other`. Соответствующее место в `docs/context/` остаётся кандидатом, а не автоматической записью."
next = "→ кандидат для контекста"

[[path]]
title = "Источник свидетельств нечитаем"
tag = "не чистый результат"
role = "gate"
when = "Журнал или другой источник свидетельств нечитаем или неполон."
outcome = "результат не считается чистым: источник чинят или явно принимают через `--accept-gap`"

[[path]]
title = "После чекпоинта появились коммиты"
tag = "устарел"
role = "gate"
when = "В ветку попали новые коммиты после записи чекпоинта."
outcome = "чекпоинт отклоняется как устаревший, и ретроспективу проводят заново"

[[path]]
title = "Известная проблема повторилась"
tag = "повтор"
role = "actor"
when = "Тот же дефект уже есть в открытом issue."
outcome = "новое появление всё равно записывается через `--trigger known-recurrence`, роутер добавляет его к issue, а такое событие можно только привязать, но не отклонить"

[[path]]
title = "Process issue не создаётся"
tag = "не блокирует"
role = "neutral"
when = "Повторная попытка создать или обновить process issue не удалась."
outcome = "сбой сохраняется и не блокирует безопасную доставку"

[[path]]
title = "Связанный issue исчез"
tag = "отдельный разбор"
role = "gate"
when = "Явно связанный исторический process issue больше нельзя прочитать."
outcome = "после определённого ответа `404` в рабочей копии управляемой задачи записывают узкое решение командой `managed_task.py dispose-process-evidence`; сбой прав доступа, аутентификации или сети его не оправдывает"

[[path]]
title = "Разбор не создаёт работу"
tag = "запрет"
role = "gate"
when = "Облачный разбор или обзор находит проблему."
outcome = "он не создаёт управляемые задачи, OpenSpec, PR и правки кода; сделать улучшением может только принятое решение"

[example]
title = "Пример: от повтора к улучшению"
steps = [
  { text = "Агент дважды вручную обошёл один и тот же сбой очереди. Перед завершением он запускает `agent_friction.py review-path` и видит этот сигнал в списке." },
  { text = "Он записывает событие с триггером manual-workaround. Роутер создаёт очищенный process issue или добавляет новое появление к уже открытому.", emphasis = ["manual-workaround"] },
  { text = "Агент закрывает чекпоинт, привязав событие через `--event`. Без этого `finish_task.py` остановил бы завершение." },
  { text = "Периодический обзор группирует похожие issue по вероятной причине и сверяет их с текущим репозиторием. Общую повторяющуюся проблему можно предложить в центральный репозиторий: сначала `promote --dry-run`, затем `promote`." },
  { text = "Если улучшение принято, оно оформляется изменением OpenSpec и идёт обычным путём контракта, проверки, релиза и раскатки." },
]

[[guarantees]]
title = "Обезличивание"
text = "Продвижение включает только очищенное наблюдение, гипотезу и предложенное общее изменение. Сырые свидетельства не передаются: в них могут быть локальные, клиентские, финансовые, эксплуатационные данные и данные, близкие к учётным."

[[guarantees]]
title = "Свидетельство, а не задача"
text = "Process issue служит только доказательством. Счётчики лишь усиливают свидетельство и никогда не правят контекст, не создают и не запускают управляемую задачу."

[[guarantees]]
title = "Отличать факт от гипотезы"
text = "Запись разделяет наблюдение, свидетельство, гипотезу и предложение, а причина и обходной путь не смешиваются с исправлением."

[[guarantees]]
title = "Нечистый источник не чист"
text = "Нечитаемый или неполный источник свидетельств не даёт результата `none`: его чинят или принимают явно."
