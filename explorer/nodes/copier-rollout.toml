id = "copier-rollout"
kind = "mechanism"
title = "Copier и управляемая раскатка"
definition = "Подключённые проекты обновляются до точного тега через Copier отдельным PR в каждом проекте; сбой одного проекта не останавливает остальные, автослияния по умолчанию нет."
order = 10
role = "external"
terms = ["copier", "managed-rollout", "pr"]
lead = "Подключённые проекты обновляются до точного опубликованного тега через Copier, а управляемая раскатка избавляет человека от необходимости помнить, каким проектам нужна новая версия. В каждом проекте открывается отдельный PR, и по умолчанию он не сливается автоматически."
thesis = "При неясности раскатка не продолжает: блокируется только проект с проблемой, а остальные получают свои PR и принимают их через собственный CI и ревью. Ветку проекта по умолчанию раскатка при блокировке не меняет."
sources = [
  "docs/managed-rollout.md#Automatic release rollout",
  "docs/managed-rollout.md#Registry",
  "docs/managed-rollout.md#Downstream adoption at task start",
  "docs/managed-rollout.md#Repeated-failure alerting",
  "docs/managed-rollout.md#Failure handling",
  "docs/release-policy.md#Managed rollout",
]

[[used_in]]
stage = "release-rollout"

[[inputs]]
title = "Опубликованный тег"
text = "Точный неизменяемый тег версии, для которого workflow раскатки получает запрос диспетчеризации."
role = "artifact"
node = "platform-releases"
note = "← тег версии"

[[inputs]]
title = "Включение оператором"
text = "Необязательная возможность: переменная репозитория `DEV_PLATFORM_MANAGED_ROLLOUT_ENABLED` должна быть равна `true`, иначе диспетчеризации нет."
role = "actor"

[[inputs]]
title = "Реестр проектов"
text = "Внешний реестр оператора: только проекты в состоянии `managed` входят в обычную раскатку. Реестра в общем ядре нет."
role = "external"
note = "managed-projects.json"

[[inputs]]
title = "Приложение GitHub"
text = "Отдельный GitHub App с минимальными правами выдаёт короткоживущие токены: чтение источника платформы и запись только в один целевой репозиторий."
role = "external"

[action]
label = "roll out"
title = "Обновление каждого проекта"
steps = [
  "Подтвердить, что запрошенный тег опубликован как неизменяемый релиз GitHub; вручную введённая неопубликованная версия отклоняется.",
  "Получить два отдельных токена: только чтение источника платформы и запись в один целевой репозиторий.",
  "Проверить, нет ли уже открытого PR на ветке `dev-platform/rollout-vX.Y.Z`, и проверить метаданные Copier и согласованность версии.",
  "Запустить Copier 9.18.2 на точном теге с `--conflict rej`; остановиться при файлах `.rej`, маркерах конфликта, попытке понизить версию, чужом источнике шаблона или ошибке проверки.",
  "Выполнить только платформенные проверки: гигиена диффа, `.rej` и `platform_doctor.py`. Продуктовые проверки остаются за CI самого PR проекта.",
  "Закоммитить и отправить детерминированную ветку без force, открыть обычный PR и остановиться; слияние решают CI и ревью проекта.",
]

[[outputs]]
title = "PR раскатки"
text = "Обычный PR на ветке `dev-platform/rollout-vX.Y.Z` в каждом проекте `managed`; автослияния по умолчанию нет."
role = "external"
consumer = "команда проекта"

[[outputs]]
title = "Диагностика блокировки"
text = "Если проект заблокирован, остаются аннотация `::error::`, сводка и артефакт `rollout-diagnostic.json`; ветка проекта по умолчанию не меняется."
role = "gate"
consumer = "оператор"

[[outputs]]
title = "Счётчик подряд идущих сбоев"
text = "Issue с меткой `rollout-failure-streak` ведёт счёт сбоев проекта; после трёх подряд добавляется метка `rollout-alert`."
role = "artifact"
consumer = "оператор"

[[fork]]
title = "Развилка: состояние проекта в реестре"
note = "Только состояние `managed` входит в обычную раскатку. Первичное принятие и смена состояния идут через отдельный workflow Adopt Project."

[[fork.branch]]
name = "managed"
code = "в раскатке"
role = "stage"
recognized = "Проект принят и находится в реестре в состоянии `managed`."
creates = "Проект получает PR раскатки; при блокировке остальные проекты всё равно обрабатываются."
next = "→ PR раскатки"

[[fork.branch]]
name = "candidate"
code = "ждёт принятия"
role = "neutral"
recognized = "Активный репозиторий ожидает первого принятия платформой."
creates = "Раскатка его не меняет, даже если вызвана вручную для этого репозитория."
next = "Первичное принятие через Adopt Project"
stop = true

[[fork.branch]]
name = "excluded"
code = "осознанно вне"
role = "neutral"
recognized = "Репозиторий намеренно вне принятия платформой, в реестре есть пояснение."
creates = "Раскатка его не меняет."
next = "Остаётся вне раскатки"
stop = true

[[path]]
title = "Проект заблокирован"
tag = "fail closed"
role = "gate"
when = "У проекта конфликт, нет или неверны метаданные Copier, попытка понизить версию, ошибка проверки или неожиданная коллизия веток."
outcome = "ветка проекта по умолчанию остаётся без изменений, остальные проекты продолжают раскатку (`fail-fast: false`)"

[[path]]
title = "PR этой версии уже открыт"
tag = "ожидание"
role = "neutral"
when = "Для той же версии уже есть открытый PR раскатки."
outcome = "раскатка сообщает, что он ожидает, и не переписывает ветку"

[[path]]
title = "Проект уже на версии"
tag = "ничего не делать"
role = "neutral"
when = "Проект уже на запрошенной версии."
outcome = "раскатка сообщает об отсутствии работы только если записи версий платформы согласованы"

[[path]]
title = "Появился PR новее"
tag = "замена"
role = "mechanism"
when = "Для проекта уже открыт валидный PR более новой версии, а более старые PR оставлены ботом платформы."
outcome = "подходящие старые PR от бота закрываются только после появления нового; ветка удаляется после подтверждённого закрытия, а её сбой даёт предупреждение, а не ошибку"

[[path]]
title = "Повторные сбои проекта"
tag = "оповещение"
role = "gate"
when = "Проект блокируется на последовательных выпусках."
outcome = "счётчик в Issue `rollout-failure-streak` растёт, после трёх подряд появляется метка `rollout-alert`, а при успешной подготовке Issue закрывается с пометкой"

[[path]]
title = "PR раскатки висит открытым"
tag = "на старте задачи"
role = "actor"
when = "В проекте с harness платформы начинается новая задача, а PR раскатки с нужной веткой и подтверждённым ботом ещё не слит."
outcome = "платформенный `start_task.py` перед созданием ветки сливает PR с зелёными проверками по обычной политике GitHub; ожидающие или упавшие проверки, конфликт или неподтверждённый бот явно блокируют начало работы"

[[path]]
title = "Блокировку не лечат вручную"
tag = "запрет"
role = "gate"
when = "Подключение или раскатка заблокированы."
outcome = "не редактируют `.copier-answers.yml` вручную и не отправляют автоматическую ветку принудительно: разбирают конфликт принадлежности в обычной ветке и перезапускают тот же workflow"

[example]
title = "Пример: версия доходит до проекта"
steps = [
  { text = "Версия `v1.4.2` опубликована, оператор раньше включил управляемую раскатку, поэтому `publish-version.yml` запускает workflow раскатки для этого тега." },
  { text = "Раскатка подтверждает, что `v1.4.2` является опубликованным неизменяемым релизом, и для проекта в состоянии `managed` проверяет метаданные Copier и версию." },
  { text = "На ветке dev-platform/rollout-v1.4.2 Copier обновляет проект до тега. Проходят платформенные проверки и `platform_doctor.py`, и открывается обычный PR.", emphasis = ["dev-platform/rollout-v1.4.2"] },
  { text = "PR остаётся на ревью проекта и проходит CI самого проекта. Автослияния нет." },
  { text = "Когда в проекте начинается следующая задача, платформенный `start_task.py` видит PR раскатки с зелёными проверками, сливает его обычным путём и только потом создаёт ветку. Задача начинается уже на новой версии.", emphasis = ["на новой версии"] },
]

[[guarantees]]
title = "Только публикуемый тег"
text = "Раскатка требует опубликованный неизменяемый релиз и использует Copier с `--vcs-ref`; изменяемый `main` источником обновления не бывает."

[[guarantees]]
title = "Закрыто при неясности"
text = "Конфликты, неверные метаданные Copier, понижение версии, ошибка проверки или чужая ветка блокируют проект, не меняя его ветку по умолчанию."

[[guarantees]]
title = "Проекты не мешают друг другу"
text = "Каждый проект получает свой PR, а блокировка одного не останавливает остальных."

[[guarantees]]
title = "Автослияния нет"
text = "Раскатка останавливается на PR. Слияние остаётся за CI и ревью проекта, а при старте задачи платформа может влить только PR с зелёными проверками и подтверждённым ботом."

[[guarantees]]
title = "Минимальные права"
text = "Токены короткоживущие и разделены по задаче: чтение платформы, запись в один целевой репозиторий и доступ к реестру оператора. Личный токен не нужен."
