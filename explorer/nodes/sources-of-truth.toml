id = "sources-of-truth"
kind = "topic"
title = "Источники истины"
definition = "Где записаны обязательные правила, а где пояснения, и какой источник главнее при расхождении."
order = 3
lead = "У платформы нет одного плоского набора документов. Разные источники отвечают на разные вопросы: что обязательно в процессе, какое поведение принято, какое поведение меняется прямо сейчас и почему было принято решение."
thesis = "Целевое поведение во время активного изменения равно текущим спецификациям плюс активная дельта, с учётом ограничений процесса и безопасности. Если артефакт OpenSpec противоречит правилу безопасности или процесса, расхождение сообщают, а правило молча не обходят."
sources = [
  "AGENTS.md#Sources of truth",
  "docs/engineering/openspec-workflow.md#Contract model",
  "docs/engineering/task-intake.md#Requirement-first cross-surface contract",
  "docs/engineering/explorer.md#Editorial nodes",
]

[[points]]
title = "AGENTS.md"
text = "Ограничения процесса и безопасности при изменении платформы. Это краткая карта и обязательные инварианты; подробные правила находятся в связанных документах. Дополнительные `AGENTS.md` на уровне модулей действуют внутри своего каталога."

[[points]]
title = "Принятые спецификации"
text = "Каталог `openspec/specs/` хранит поведение платформы, принятое после архивации изменений. Это исполняемый контракт того, что платформа делает сейчас."

[[points]]
title = "Активные изменения"
text = "Каталог `openspec/changes/<change>/` хранит утверждённые дельты, которые меняют это поведение прямо сейчас. Для работы, которую представляет активное изменение, второй бэклог не создают."

[[points]]
title = "Реализация"
text = "Каталог `template/` и код платформы реализуют текущие спецификации и активные дельты. Код не должен молча расходиться с действующим контрактом: сначала обновляют соответствующий артефакт."

[[points]]
title = "Документация"
text = "Каталог `docs/` хранит устойчивые описания архитектуры, подключения и эксплуатации. Записи в `docs/decisions/` сохраняют датированные причины и условия пересмотра значимых решений, но исполняемым контрактом остаётся OpenSpec."

[[points]]
title = "Требование и техническая задача"
text = "Business Requirement остаётся человеческим объектом бизнеса и прогресса. После того как техническая дочерняя задача импортирована, её пакет в `openspec/changes/<change>/` становится каноническим для реализации, проверки и архива этой задачи."

[[points]]
title = "Пояснения Explorer"
text = "Редакционный слой Explorer только объясняет и не определяет правил: нормативные правила остаются в `AGENTS.md`, спецификациях OpenSpec и `docs/`. Если раздел источника изменился после последней сверки текста, на узле видна пометка."
