id = "review-perspectives"
kind = "part"
title = "Точки зрения ревью"
definition = "Что проверяет сверка с контрактом и что проверяет инженерное качество, и почему это два отдельных запуска."
role = "mechanism"
lead = "Независимое ревью состоит из двух точек зрения. `spec-fidelity` сверяет результат с контрактом OpenSpec, а `engineering-quality` оценивает инженерное качество. Каждая запускается отдельным свежим процессом, который запускает сама платформа."
thesis = "Каждый запуск начинается с чистого контекста, а платформа сама видит запуск и проверяет, что ревьюер ничего не изменил. Поэтому отчёт опирается на наблюдаемые платформой факты, а не на слова автора кода."
sources = [
  "docs/engineering/openspec-workflow.md#Independent review evidence",
  "openspec/specs/completion-lifecycle/spec.md#Requirement: Independent review runs in a proven fresh read-only context",
  "openspec/specs/completion-lifecycle/spec.md#Requirement: Reviewer context excludes lifecycle-generated evidence",
]

[[used_in]]
stage = "verification"

[[inputs]]
title = "Запрос на ревью"
text = "Независимый от провайдера запрос и предвычисленный дифф кандидата в каталоге вне репозитория."
role = "artifact"
node = "independent-review"

[[inputs]]
title = "Настройки ревью"
text = "Провайдер по умолчанию совпадает с маршрутом задачи; `[independent_review] provider` задаёт другого, профиль модели `standard` по умолчанию, а ограничение времени по умолчанию 1800 секунд."
role = "source"
note = ".dev-platform.toml"

[[inputs]]
title = "Контракт задачи"
text = "Пакет OpenSpec, с которым сверяет `spec-fidelity`."
role = "artifact"
node = "add-openspec"

[action]
label = "two reviewers"
title = "Два отдельных запуска"
steps = [
  "Перед запуском платформа проверяет готовность рантайма одним небольшим запросом с точной выбранной моделью; при неготовности оба отчёта записываются как `unavailable`.",
  "Каждая точка зрения запускается как новый невозобновляемый процесс: Codex через `codex exec --sandbox read-only --ephemeral`, Claude Code в режиме print с инструментами `Read,Grep,Glob`, `--permission-mode dontAsk`, `--no-session-persistence` и без серверов MCP.",
  "Ревьюер получает промпт из запроса и диффа только содержимого задачи; записи жизненного цикла исключены и названы в запросе как `excluded_lifecycle_paths`.",
  "Ответ должен содержать структурированные находки: `id`, `severity: material|advisory`, `summary`, `evidence`.",
  "Платформа сравнивает содержимое рабочей копии и интеграционной копии до и после запуска: любое изменение, недоступный бинарник, ненулевой код, превышение времени или неверный формат дают отчёт `unavailable`.",
]

[[outputs]]
title = "Неизменяемый отчёт"
text = "Для каждой точки зрения записываются факт запуска, механизм только чтения, выбранная модель и дайджест сырого ответа; промпты и вывод не сохраняются."
role = "artifact"
consumer = "решения и архив"
node = "review-decisions"

[[outputs]]
title = "Существенные находки"
text = "Находки с `severity: material` блокируют архив и публикацию, пока их не исправят или не отклонят с обоснованием."
role = "gate"
consumer = "доработка"
node = "repair-job"

[[path]]
title = "Рантайм ревьюера не готов"
tag = "unavailable"
role = "gate"
when = "Нет входа в CLI, выбранная модель недоступна аккаунту, бинарник отсутствует или проверка готовности не прошла."
outcome = "оба отчёта записываются как `unavailable` с конкретным ограничением и следующим шагом, и ни одна точка зрения не запускается; другую модель и провайдера не пробуют, если конфигурация не объявляет упорядоченный список"

[[path]]
title = "Ревьюер изменил файлы"
tag = "недействителен"
role = "gate"
when = "Проверка после запуска нашла изменение в рабочей или интеграционной копии."
outcome = "отчёт записывается как `unavailable` с изменёнными путями, а платформа ничего не чинит и не очищает"

[[path]]
title = "Отчёт написан вручную"
tag = "не засчитывается"
role = "gate"
when = "Отчёт создан вручную командой `record`, без наблюдаемого платформой запуска."
outcome = "он не удовлетворяет обязательному ревью"

[[path]]
title = "Содержимое задачи изменилось"
tag = "устарело"
role = "gate"
when = "После отчёта изменился путь из идентичности содержимого задачи."
outcome = "требуется новое ревью; архив, записи жизненного цикла и чистое слияние `main` не затрагивают пути задачи и отчёт сохраняют"

[example]
title = "Пример: два запуска на одной версии"
steps = [
  { text = "Платформа готовит запрос и дифф только содержимого задачи, исключив прежние отчёты, протокол проверки и доказательства проверок." },
  { text = "Проверка готовности подтверждает, что рантайм провайдера и выбранная модель работают. После этого стартуют два процесса: spec-fidelity и engineering-quality.", emphasis = ["spec-fidelity", "engineering-quality"] },
  { text = "Первый находит расхождение с дельта-спецификацией и возвращает находку `severity: material`; второй возвращает только рекомендации." },
  { text = "Платформа сверяет рабочую копию и интеграционную копию, изменений нет, и оба отчёта записываются с дайджестом ответа." },
  { text = "Существенная находка уходит в задание на доработку; после правки ревью повторяется для нового содержимого." },
]

[[guarantees]]
title = "Платформа сама запускает"
text = "Отчёт принимается только если платформа наблюдала запуск нового невозобновляемого процесса с механизмом только чтения."

[[guarantees]]
title = "Нет скрытых подстановок"
text = "Если нужный провайдер не готов, платформа не подставляет другую модель или провайдера, пока список не объявлен в конфигурации; отчёты хранят запрошенного и выполнившего провайдера."
