id = "requirement-intent"
kind = "stage"
title = "Запрос и требования"
definition = "Платформа определяет, что просит человек: обсудить, записать в бэклог, быстро исправить или выполнить принятое требование. От ответа зависит весь дальнейший путь."
order = 1
short_title = "Запрос и требования"
tagline = "что именно просят"
children = ["requirement-intake", "chatgpt-project", "incubator", "goal-refinement"]
terms = ["business-requirement"]
lead = "С этого этапа начинается любая работа. Платформа определяет, чего на самом деле хочет человек: обсудить идею, записать требование в бэклог, сделать небольшую правку сразу или выполнить уже принятое требование. От ответа зависит, сколько процесса понадобится дальше."
thesis = "Не потерять принятую работу и не обвешать процессом мелкую правку. Принятая существенная работа всегда получает Business Requirement, а мелкая правка идёт короткой дорогой."
sources = [
  { ref = "AGENTS.md#Task intents", note = "короткая карта намерений" },
  { ref = "docs/engineering/task-intake.md#Intent boundary", note = "полный контракт развилки" },
  { ref = "docs/engineering/task-intake.md#Requirement-first cross-surface contract", note = "запуск требования" },
  { ref = "docs/engineering/task-intake.md#Escalating quick work", note = "когда быстрая задача разрослась" },
  { ref = "dev-platform/capabilities/requirement-authoring.md", note = "стандарт текста Requirement" },
]

[[transitions]]
to = "specification"
type = "main"
reason = "Принятое существенное требование нужно превратить в контракт до реализации"

[[transitions]]
to = "isolated-implementation"
type = "conditional"
reason = "Быстрая задача: изменение мало и ясно, Requirement и OpenSpec не нужны"
label = "quick task: сразу к исполнению, без Requirement и OpenSpec"

[[transitions]]
to = "stop"
type = "conditional"
reason = "Фиксация: работа записана в бэклог и ждёт решения владельца"
label = "фиксация: стоп в бэклоге"

[[inputs]]
title = "Запрос человека"
text = "Задача своими словами в сессии Codex, Claude Code или в проекте ChatGPT."
role = "actor"

[[inputs]]
title = "Существующее требование"
text = "Issue из бэклога, переданный со словами «возьми в работу»."
role = "artifact"
node = "requirement-intake"
note = "type:requirement"

[[inputs]]
title = "Принятое улучшение"
text = "Затруднение, которое владелец решил превратить в работу."
role = "stage"
node = "feedback-learning"
note = "← этап 8"

[action]
label = "intake"
title = "Определение намерения"
steps = [
  "Распознать одно из четырёх намерений.",
  "Для принятой работы создать или найти Requirement.",
  "Проверить, что целевой репозиторий умеет управляемый процесс.",
  "Передать работу дальше или остановиться.",
]

[[outputs]]
title = "Требование в работе"
text = "Начата подготовка к проектированию, карточка в проекте бэклога «In progress»."
role = "stage"
consumer = "→ этап 2"
node = "specification"

[[outputs]]
title = "Быстрая задача"
text = "Ветка задачи без Requirement и OpenSpec."
role = "actor"
consumer = "→ этап 4"
node = "isolated-implementation"

[[outputs]]
title = "Requirement в бэклоге"
text = "Записан и ждёт решения владельца. Владелец видит его карточку в проекте бэклога."
role = "artifact"
consumer = "стоп"

[[fork]]
title = "Развилка: четыре намерения"
note = "Решает смысл просьбы, а не ключевое слово. Просьба «зафиксируй» без разрешения выполнять всегда останавливается после записи. Отдельный путь есть для явной технической задачи: если человек сам передаёт управляемый Issue или просит создать техническую задачу, она сразу оформляется как пакет OpenSpec."

[[fork.branch]]
name = "Обсудить"
code = "discuss"
role = "neutral"
recognized = "Вопрос, сравнение вариантов, проектирование вслух. Даже долгое обсуждение остаётся обсуждением."
creates = "Ничего долговременного: ни задачи, ни записи в бэклоге."
next = "Остаётся в разговоре"

[[fork.branch]]
name = "Зафиксировать"
code = "«зафиксируй», «добавь в бэклог»"
role = "artifact"
recognized = "Явная просьба записать принятую работу, обычно со словами «зафиксируй», «создай задачу» или «отправь в бэклог»."
creates = "Business Requirement: цель, критерии приёмки, целевой репозиторий и исключения. Метки и карточка в проекте бэклога проверяются повторным чтением."
next = "Стоп. Без OpenSpec, декомпозиции и кода"
stop = true

[[fork.branch]]
name = "Сделать быстро"
code = "quick task"
role = "actor"
recognized = "Небольшое ясное изменение или восстановление поведения, которое уже однозначно закреплено принятым контрактом."
creates = "Только обычная ветка задачи с проверками. Для исправления регрессии нужно показать ошибку до правки и её отсутствие после."
next = "→ 4 Исполнение"
next_node = "isolated-implementation"

[[fork.branch]]
name = "Выполнить требование"
code = "«возьми в работу»"
role = "stage"
recognized = "Новая существенная работа или переданный Requirement из бэклога."
creates = "Requirement создаётся или переиспользуется, запускается подготовка к проектированию, карточка переходит в «In progress»."
next = "→ 2 Проектирование"
next_node = "specification"

[[path]]
title = "Быстрая задача разрослась"
tag = "возврат"
role = "gate"
when = "Правка начала менять поведение, архитектуру, совместимость, формат данных или объём работ."
outcome = "остановиться и оформить Requirement; техническая задача только по явной просьбе"

[[path]]
title = "Репозиторий не готов"
tag = "стоп"
role = "gate"
when = "Целевой репозиторий не доказал управляемый процесс: маршрут бэклога, OpenSpec, защищённую публикацию."
outcome = "фиксация и выполнение останавливаются с перечнем недостающего"

[[path]]
title = "Карточка не подтвердилась"
tag = "повтор"
role = "actor"
when = "Issue создан, но его место в проекте бэклога не удалось подтвердить."
outcome = "Issue сохраняется, команда сообщает об ошибке, повтор продолжает тот же Issue без дубликата"

[[path]]
title = "Цель неясна"
tag = "уточнение"
role = "actor"
when = "Существенный запрос не говорит, какой результат и как его проверить."
outcome = "одно короткое уточнение цели и критерия успеха, без отдельного документа"

[[path]]
title = "Идея на потом"
tag = "инкубатор"
role = "neutral"
when = "Мысль стоит сохранить, но работой она ещё не принята."
outcome = "Issue с меткой incubator и условием пересмотра, без исполнения"

[example]
title = "Пример: от фразы до работы"
steps = [
  { text = "Владелец пишет: «зафиксируй: Explorer должен объяснять платформу по-русски». Агент распознаёт фиксацию.", emphasis = ["«зафиксируй: Explorer должен объяснять платформу по-русски»"] },
  { text = "Агент пишет Requirement по стандарту: Outcome, Context, Acceptance evidence, Target repository, Exclusions. Он создаёт Issue через `requirement_intake.py create`, проверяет метки и карточку и останавливается.", emphasis = ["Outcome, Context, Acceptance evidence, Target repository, Exclusions"] },
  { text = "Позже владелец пишет: «возьми в работу» и даёт ссылку на этот Issue.", emphasis = ["«возьми в работу»"] },
  { text = "Агент запускает `requirement_intake.py start`. Начинается подготовка к проектированию, карточка становится «In progress», и другой агент уже не примет её за свободную." },
  { text = "Работа переходит к этапу 2: агент выбирает глубину проектирования.", emphasis = ["этапу 2"] },
]
