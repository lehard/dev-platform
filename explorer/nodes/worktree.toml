definition = "worktree — отдельная рабочая копия репозитория на собственной ветке. Каждая управляемая задача выполняется в своём worktree в каталоге `.claude/worktrees/<change>/`, поэтому параллельные задачи не делят изменяемое состояние с интеграционной копией `main`."
