id = "ownership"
kind = "topic"
title = "Кто за что отвечает"
definition = "Что принадлежит платформе, что проекту, а что оператору установки, и кто какое решение принимает."
order = 1
lead = "Платформа нужна, чтобы процессы разных проектов не расходились, но она не превращает каждый репозиторий в одинаковую копию. Поэтому у каждого файла и каждого решения есть владелец: платформа, проект или оператор установки."
thesis = "Платформа владеет общим процессом, проект владеет своим продуктом, оператор владеет состоянием установки. Проект может быть строже платформы, но не должен молча ослаблять её правила безопасности."
sources = [
  "docs/ownership.md#Platform-owned",
  "docs/ownership.md#Project-owned",
  "docs/ownership.md#Operator-owned",
  "docs/ownership.md#Override rule",
  "docs/managed-rollout.md#Template ownership boundary",
]

[[points]]
title = "Платформе принадлежит общий процесс"
text = "Корневой агентский процесс, политика жизненного цикла OpenSpec, изоляция worktree и координация, безопасность слияния, механизм выбора проверок, формат записи friction, повторно используемый вход CI и механика создания и обновления проекта. Эти файлы может обновлять Copier, и они должны оставаться общими."

[[points]]
title = "Проекту принадлежит его реальность"
text = "Бизнес-требования и предметные правила, архитектурные решения, которые не универсальны, правила отдельных модулей, команды тестов и сопоставление проверок, детали развёртывания и секреты. Правила проекта живут в `docs/engineering/project-rules.md`, `AGENTS.md` модуля, артефактах OpenSpec и документах проекта, а устойчивый предметный контекст в `docs/context/`."

[[points]]
title = "Оператору принадлежит состояние установки"
text = "Реестр проектов, общий бэклог, идентичность бота, политика раскатки и привязки к аккаунтам провайдеров не входят в общее ядро. Их хранят в отдельном управляемом TOML-файле, который подключает переменная `DEV_PLATFORM_OPERATOR_CONFIG`; обычная работа проекта без него не ломается."

[[points]]
title = "После первого создания часть файлов переходит проекту"
text = "Copier сохраняет при обновлениях `.gitignore`, `AGENTS.md`, `README.md`, `dev-platform/checks.toml`, `openspec/config.yaml`, `docs/engineering/project-rules.md` и `docs/context/`. Общие исполняемые скрипты жизненного цикла, самодостаточный CI и общие рабочие документы остаются под управлением платформы."

[[points]]
title = "Проект может быть строже, но не слабее"
text = "Если обновление платформы конфликтует с реальным инвариантом проекта, обновление не навязывают: конфликт решают явно, а общий инвариант предлагают как изменение платформы."

[[points]]
title = "Какие файлы защищены, решает таблица, а не агент"
text = "Какие файлы платформы считаются защищёнными правилами, а какие можно править срочно, записано в поставляемом файле `dev-platform/protected-surface.toml`. Агент сам файл в другой класс не переносит."

[[points]]
title = "Explorer принадлежит только платформе"
text = "Explorer, то есть каталог `explorer/` и `scripts/build_explorer.py`, принадлежит платформе, но показывает только этот репозиторий и никогда не попадает в проекты."
