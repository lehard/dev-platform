id = "adoption"
kind = "topic"
title = "Подключение проекта"
definition = "Как новый или существующий репозиторий начинает работать по платформе и какой профиль работы ему подходит."
order = 2
lead = "Подключение проекта к платформе в обычном случае сводится к одному действию оператора: запустить workflow Adopt Project для репозитория. Платформа сама определяет состояние репозитория, профиль работы и режим публикации и не просит выбирать их вручную."
thesis = "Новый почти пустой репозиторий подключается быстро и автоматически, а существующий получает проверяемый PR на рецензирование и никогда не нормализуется разрушительно. При неясной принадлежности файлов подключение останавливается раньше, чем Copier что-либо изменит."
sources = [
  "docs/adoption.md#Primary interface: one-command onboarding",
  "docs/adoption.md#Fresh fast path",
  "docs/adoption.md#Existing-project cautious path",
  "docs/adoption.md#Local developer readiness",
  "docs/adoption.md#Upgrade",
  "README.md#Workflow profiles",
]

[[points]]
title = "Один способ запуска"
text = "Оператор добавляет репозиторий в установку приложения Dev Platform Bot, если доступ ограничен выбранными репозиториями, и запускает в репозитории платформы GitHub Actions workflow Adopt Project, указав `owner/name`. Профиль Copier, режим harness и режим публикации вручную не выбираются, если у проекта нет явного исключения."

[[points]]
title = "Три состояния репозитория"
text = "`fresh` значит, что метаданных Dev Platform и процессных признаков проекта нет, а репозиторий мал. `existing` значит, что у репозитория уже есть свой процесс для агентов, OpenSpec, CI или достаточно много кода. `adopted` значит, что метаданные Dev Platform уже есть."

[[points]]
title = "Быстрый путь для нового репозитория"
text = "Платформа рендерит точный неизменяемый релиз через Copier, выполняет безопасную инициализацию OpenSpec, запускает doctor платформы, проверки гигиены, строгую проверку OpenSpec и выбранные проверки проекта, создаёт PR подключения и автоматически сливает его через squash после этих проверок. Затем репозиторий переводится в состояние `managed`."

[[points]]
title = "Осторожный путь для существующего проекта"
text = "Подключение останавливается на обычном PR для рецензирования, существующие файлы OpenSpec и инструментов не инициализируются разрушительно. После слияния этого PR workflow запускают ещё раз, и он выполняет только перевод в `managed`."

[[points]]
title = "Профили работы"
text = "`light` подходит небольшим или однопользовательским репозиториям без обязательных веток, worktrees и доски. `standard` используется по умолчанию: ветки задач и общий жизненный цикл публикации и проверки. `multi-agent` добавляет к `standard` изолированные worktrees, локальную доску агентов и явное владение объёмом работ."

[[points]]
title = "Профиль и harness независимы"
text = "`workflow_profile` описывает, какие возможности использует репозиторий, а `harness_mode` решает, кто владеет реализацией Git, задач и worktree: `platform` или сам проект. Зрелый репозиторий может быть `multi-agent` и при этом оставить собственный harness."

[[points]]
title = "Неоднозначная принадлежность останавливает подключение"
text = "Если один платформенный файл совпадает с файлом проекта и этого недостаточно, чтобы доказать связный harness проекта, подключение завершается ошибкой до изменений Copier. Файлы `.rej` не считаются успешной миграцией."

[[points]]
title = "После подключения"
text = "В клоне подключённого проекта разработчик запускает `python3 scripts/dev.py ready`: он синхронизирует интеграционную ветку, когда это безопасно, восстанавливает интеграции OpenSpec и запускает doctor платформы и агентов. Новые версии платформы приходят PR раскатки; прямой ручной `copier update --trust` остаётся для разработки платформы, восстановления и необычных миграций."
