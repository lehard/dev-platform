id = "worktrees"
kind = "mechanism"
title = "Worktrees и параллельная работа"
definition = "Каждая задача получает свою ветку и рабочую копию; доска агентов и заявки на файлы не дают двум писателям менять одно и то же, а чужое состояние никогда не очищается."
order = 5
role = "mechanism"
terms = ["worktree"]
lead = "Каждая управляемая задача получает собственную ветку и отдельную рабочую копию worktree, а не работает в интеграционной копии `main`. Для параллельной работы профиль `multi-agent` добавляет локальную доску агентов и заявки на файлы."
thesis = "Два писателя не должны менять одно и то же, а чужое состояние никогда не очищается. Если пересечение реально, задача ждёт или оператор принимает явное решение, но платформа не перебазирует, не сбрасывает и не прячет чужие изменения."
sources = [
  "docs/engineering/agent-workflow.md#Central source dogfood lifecycle",
  "docs/engineering/agent-workflow.md#Scope discipline and capabilities",
  "openspec/specs/worktree-coordination/spec.md#Requirement: Concrete multi-agent scope claims are admission-controlled atomically",
  "openspec/specs/worktree-coordination/spec.md#Requirement: Hard and soft overlap are classified deterministically",
  "openspec/specs/worktree-coordination/spec.md#Requirement: Known same-file overlap can be acknowledged without falsifying scope",
  "openspec/specs/central-dogfood-lifecycle/spec.md#Requirement: Managed source tasks start in an isolated workspace",
  "README.md#Workflow profiles",
]

[[used_in]]
stage = "isolated-implementation"

[[inputs]]
title = "Запуск задачи"
text = "Управляемая задача стартует командой `start_managed_task.py`; перенести в новую копию разрешено только один проверенный пакет OpenSpec."
role = "actor"
note = "start_managed_task.py"

[[inputs]]
title = "Профиль multi-agent"
text = "Профиль, который добавляет к `standard` изолированные worktrees, локальную доску агентов и явное владение объёмом работ."
role = "source"
note = "workflow_profile"

[[inputs]]
title = "Заявленный и фактический объём"
text = "Нормализованные пути файлов, которые задача заявила и фактически изменила."
role = "artifact"

[action]
label = "isolate"
title = "Ветка, копия и допуск"
steps = [
  "Старт создаёт ветку и worktree от синхронизированного `main`; интеграционная копия остаётся чистой, а любое постороннее изменение в ней останавливает запуск до создания состояния.",
  "Регистрация на доске принимает только абсолютный путь worktree, совпадающий с объявленной веткой, иначе отказ до записи состояния.",
  "Допуск атомарно решает `RUN` или `WAIT` по заявкам на конкретные файлы до первого изменения.",
  "Перед дорогой проверкой и снова перед публикацией фактический объём сравнивается с заявками других активных задач.",
  "После доставки очистка удаляет только точную завершённую копию и ветку, когда это безопасно.",
]

[[outputs]]
title = "Изолированная копия"
text = "Ветка и worktree задачи в `.claude/worktrees/<change>/`, где исполнитель работает без доступа к чужому состоянию."
role = "artifact"
consumer = "→ этап 4"
node = "isolated-implementation"

[[outputs]]
title = "Заявки на файлы"
text = "Записи на локальной доске, по которым другие задачи видят занятые файлы."
role = "artifact"
consumer = "соседние задачи"

[[outputs]]
title = "Диагностика ожидания"
text = "Ограниченное сообщение называет соседнюю задачу и конфликтующие пути, без лишних локальных данных."
role = "gate"
consumer = "оператор и агент"

[[guarantees]]
title = "Атомарный допуск"
text = "Если две задачи одновременно заявляют один свободный файл, `RUN` получает самое большее одна, а другая получает `WAIT`."

[[guarantees]]
title = "Жёсткое и мягкое пересечение"
text = "Жёстким считается точный файл, который есть в заявке или фактическом изменении другой активной задачи. Общий каталог, подсистема или широкий шаблон остаются предупреждением, а фактический объём важнее широкой заявки."

[[guarantees]]
title = "Чужое состояние неприкосновенно"
text = "Платформа не перебазирует, не сливает, не сбрасывает, не прячет и не очищает чужую ветку или копию; соседняя запись доски с расхождением ветки и пути лишь сообщается как гигиена."

[[guarantees]]
title = "Сбой доски останавливает запуск"
text = "Если доску нельзя прочитать или заблокировать, допуск завершается ошибкой, а отсутствие заявок соседей не предполагается."

[[path]]
title = "Заявка соседа"
tag = "WAIT"
role = "gate"
when = "Действующая активная задача уже владеет тем же конкретным файлом."
outcome = "новая задача получает `WAIT` и диагностику с соседней задачей и путями, чтобы повторить позже"

[[path]]
title = "Безопасное общее изменение"
tag = "подтверждение"
role = "actor"
when = "Оператор проверил, что пересечение по конкретному файлу намеренно безопасно."
outcome = "явное подтверждение с причиной разрешает продолжить, не удаляя файл из заявленного объёма; оно не покрывает новые файлы"

[[path]]
title = "Расхождение у соседа"
tag = "гигиена"
role = "neutral"
when = "У соседней записи ветка в копии не совпадает с объявленной или запись завершена."
outcome = "расхождение показывается как предупреждение, а независимая задача всё равно может получить `RUN`"

[[path]]
title = "Очистка не из того места"
tag = "отложенная очистка"
role = "actor"
when = "Слияние и сверка завершились, а оболочка вызова всё ещё находится в каталоге копии."
outcome = "доставка считается успешной, а `finish` печатает точную команду очистки; групповая очистка требует предварительного просмотра и отдельного `--apply`"

[example]
title = "Пример: две задачи на одном файле"
steps = [
  { text = "Две управляемые задачи стартуют одновременно. Каждая получает свою ветку и свой worktree, например `agent/br-7-t2-<change>` и соседнюю." },
  { text = "Обе заявляют файл `template/scripts/_platform_common.py`. Допуск атомарен: первая получает RUN, вторая получает WAIT.", emphasis = ["RUN", "WAIT"] },
  { text = "Диагностика второй задачи называет первую и конфликтующий путь. Платформа ничего не перебазирует и не очищает, поэтому вторая задача просто повторяет попытку позже." },
  { text = "Первая задача реализует пакет в своей копии и публикует изменение. Соседние задачи с независимыми файлами в это время получают `RUN` и работают параллельно." },
  { text = "После слияния `finish` печатает команду очистки точной копии, если вызов шёл из её каталога." },
]
