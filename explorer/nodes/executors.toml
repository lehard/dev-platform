id = "executors"
kind = "mechanism"
title = "Исполнители Codex и Claude Code"
definition = "Два провайдера работают по одному контракту AGENTS.md; платформа запускает их с ограниченными правами и записывает, кто фактически выполнял работу."
order = 4
role = "actor"
lead = "Задачу выполняют два провайдера, Codex и Claude Code, по одному контракту `AGENTS.md`. Платформа запускает их с ограниченными правами, проверяет границу записи после работы и записывает, кто фактически выполнял работу."
thesis = "Платформа записывает то, что действительно произошло, а не то, что планировалось. Подготовленный маршрут, самоотчёт и подтверждённый запуск различаются в записи, и самоидентификация модели никогда не считается доказательством."
sources = [
  "docs/engineering/model-routing.md#Codex entrypoint",
  "docs/engineering/model-routing.md#Claude Code entrypoint",
  "docs/engineering/model-routing.md#Execution provenance",
  "docs/engineering/model-routing.md#Delegated write containment",
  "docs/engineering/model-routing.md#Integration-advance receipts and concurrent main advances",
  "docs/engineering/openspec-workflow.md#Independent review evidence",
]

[[used_in]]
stage = "routing"
note = "запуск по маршруту"

[[used_in]]
stage = "isolated-implementation"
note = "работа в копии задачи"

[[used_in]]
stage = "verification"
note = "ревью и доработка"

[[inputs]]
title = "Подтверждённый маршрут"
text = "Профиль, провайдер и план исполнения: `delegated-child` для `routine` и `standard`, `supervisor-retained` для `complex`."
role = "mechanism"
node = "executor-routing"
note = "← этап 3"

[[inputs]]
title = "Рабочая копия задачи"
text = "Назначенный worktree, в котором исполнитель пишет код; интеграционная копия остаётся нетронутой."
role = "artifact"
node = "worktrees"

[[inputs]]
title = "Контекст дочерней задачи"
text = "Производная локальная ссылка на канонические артефакты и ограниченные факты зависимостей, а не копия разговора и не тексты соседних задач."
role = "artifact"

[action]
label = "execute"
title = "Запуск, граница записи, запись о выполнении"
steps = [
  "Codex: `route-codex` для `routine` и `standard` сразу запускает настроенного исполнителя в нативной песочнице `workspace-write`; для `complex` работа остаётся у текущей сессии.",
  "Claude Code: `route-claude` записывает маршрут, супервизор открывает делегирование командой `begin-claude-delegation`, сам вызывает нативного субагента в той же рабочей копии и затем записывает результат через `record-claude-execution`.",
  "После возврата исполнителя платформа проверяет, что интеграционная копия не изменилась (containment post-check).",
  "Родитель просматривает возвращённый дифф и проверки, а при существенном расхождении повышает маршрут через `escalate`.",
]

[[outputs]]
title = "Запись о выполнении"
text = "Роль, провайдер, профиль, модель, усилие и идентификатор запуска в файле маршрута; у каждого значения указан источник: `selected`, `runtime-confirmed`, `self-reported` или `unknown`."
role = "artifact"
consumer = "завершение и friction"

[[outputs]]
title = "Дифф на проверку"
text = "Изменения исполнителя в ветке задачи, которые родитель просматривает и передаёт на проверки."
role = "stage"
consumer = "→ этап 5"
node = "verification"

[[outputs]]
title = "Отчёты ревьюеров и результат доработки"
text = "Те же провайдеры запускают независимых ревьюеров только на чтение и исполнителей доработки через платформенный запуск."
role = "gate"
consumer = "независимое ревью"
node = "independent-review"

[[fork]]
title = "Развилка: как фиксируется запуск"
note = "Источник доказательства важнее удобства: запись не может заявить больше, чем платформа сама видела."

[[fork.branch]]
name = "Codex"
code = "platform-observed"
role = "actor"
recognized = "Платформа сама запускает процесс `codex exec --json` и видит событие `thread.started`."
creates = "Идентификатор потока записывается как идентификатор запуска исполнителя; модель и усилие остаются `selected` или `unknown`, потому что среда их не подтверждает."
next = "→ запись о выполнении"

[[fork.branch]]
name = "Claude Code"
code = "self-reported"
role = "external"
recognized = "Нативный вызов субагента делает сам супервизор, и платформа запуск не наблюдает."
creates = "Записывается `claimed` с самоотчётом и идентификатором субагента; `launched` остаётся неизвестным, исполнитель не записывается как выполнивший работу."
next = "→ запись о выполнении"

[[path]]
title = "Граница записи не доказана"
tag = "работа у родителя"
role = "gate"
when = "Платформа не может доказать нативную или запасную границу записи для дочернего исполнителя."
outcome = "родитель сохраняет работу, а платформа сообщает ограничение и не заявляет делегирование"

[[path]]
title = "Интеграционная копия уже изменена"
tag = "отказ запуска"
role = "gate"
when = "Нужно запустить исполнителя без доказанной песочницы, например с оболочкой Claude, а интеграционная копия уже грязная."
outcome = "запуск не начинается; платформа ничего не прячет, не сбрасывает и не очищает"

[[path]]
title = "Исполнитель Codex завершился аварийно"
tag = "блок писателя"
role = "gate"
when = "Процесс Codex превысил время, был отменён или вернулся с ошибкой."
outcome = "запуск завершает и убирает группу процессов; если отсутствие процесса доказать нельзя, сохранённая запись блокирует следующего писателя той же копии"

[[path]]
title = "Параллельное слияние сдвинуло main"
tag = "проверка записей"
role = "neutral"
when = "Пока делегирование открыто, соседняя задача продвинула интеграционный `main`."
outcome = "чистый сдвиг принимается, а для писателя без песочницы нужны ещё записи платформы об этом сдвиге, не связанные с делегированной копией; без них он остаётся нарушением границы"

[[path]]
title = "Маршрут записан, исполнитель не запущен"
tag = "блок finish"
role = "gate"
when = "Для Claude `routine` или `standard` нет записи о выполнении с чистой проверкой границы."
outcome = "`finish` отказывает: маршрут нельзя только записать"

[example]
title = "Пример: делегирование Codex"
steps = [
  { text = "Задача подтверждена как `standard`. Агент запускает route-codex из рабочей копии задачи.", emphasis = ["route-codex"] },
  { text = "Платформа получает локальную запись и блокировку единственного писателя для этого worktree и запускает настроенного исполнителя в песочнице `workspace-write`. Второй писатель в ту же копию не допускается." },
  { text = "Исполнитель работает, платформа записывает его поток, профиль и модель с источником `selected`." },
  { text = "После завершения платформа проверяет интеграционную копию. Она не изменилась, поэтому граница записи считается чистой." },
  { text = "Родитель просматривает дифф и запускает проверки. Если нужна повышенная сила, он вызывает `escalate`; иначе работа идёт к проверке и ревью." },
]

[[guarantees]]
title = "Ограниченные права"
text = "Дочерний писатель работает в доказанной песочнице. Если граница записи не доказана, работа остаётся у родителя вместо притворного делегирования."

[[guarantees]]
title = "Чужое состояние неприкосновенно"
text = "Ни один путь сдерживания не прячет, не сбрасывает, не очищает и не удаляет состояние интеграционной копии."

[[guarantees]]
title = "Один писатель на копию"
text = "Пока запущенный писатель Codex жив, вторая запись в ту же копию отклоняется; устаревшая или неполная запись приводит к отказу, а не к предположению, что прежний писатель исчез."

[[guarantees]]
title = "Правдивая атрибуция"
text = "Платформа записывает фактический путь, а не предпочитаемый. Запись не может стать `launched`, если запуск наблюдала не платформа."
