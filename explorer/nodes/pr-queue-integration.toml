id = "pr-queue-integration"
kind = "mechanism"
title = "PR и слияние"
definition = "finish публикует PR точной версии и включает auto-merge; GitHub сливает его на зелёных обязательных проверках."
order = 8
role = "mechanism"
terms = ["pr"]
lead = "Команда `finish` архивирует изменение, публикует PR на точной версии задачи и одной командой включает auto-merge. Дальше слияние ведёт GitHub."
thesis = "Слияние всегда привязано к точной проверенной версии. Если обязательных проверок нет, платформа отказывается сливать."
sources = [
  "docs/engineering/agent-workflow.md#Completion",
  "openspec/specs/platform-lifecycle/spec.md#Requirement: Automatic task PR merge preserves zero-hand-off delivery",
  "openspec/specs/platform-lifecycle/spec.md#Requirement: Automatic merge intent is exact-head guarded and durable when GitHub supports it",
]

[[used_in]]
stage = "publication-integration"
note = "finish и слияние"

[[inputs]]
title = "Проверенная ветка"
text = "Ветка с выбранными проверками, протоколом проверки и friction-чекпоинтом, записанными на точной версии."
role = "stage"
node = "verification"
note = "← этап 5"

[[inputs]]
title = "Актуальный main"
text = "Защищённая ветка и обязательные проверки `validate`; ни то ни другое не обходится."
role = "external"

[action]
label = "finish → auto-merge"
title = "От публикации до слияния"
steps = [
  "`dogfood_task.py finish` при включённом ревью запускает его, архивирует изменение и публикует PR на точной версии.",
  "Платформа проверяет, что обязательные проверки есть, и вызывает `gh pr merge --auto --squash --match-head-commit`.",
  "GitHub сливает PR, когда обязательные проверки зелёные и версия не изменилась.",
  "Повторный `finish` после слияния сверяет локальный `main` и карточку задачи.",
]

[[outputs]]
title = "Слитый PR"
text = "GitHub сообщает для точного PR состояние `MERGED`, а локальный `main` затем сверяется; только после этого задача считается доставленной."
role = "stage"
consumer = "→ этап 8"
node = "feedback-learning"

[[path]]
title = "Обязательных проверок нет"
tag = "отказ"
role = "gate"
when = "GitHub не показывает обязательных проверок для версии."
outcome = "`finish` отказывается сливать и называет причину; PR остаётся открытым."

[[path]]
title = "GitHub отказал в auto-merge"
tag = "отказ"
role = "gate"
when = "Например, auto-merge выключен в настройках репозитория."
outcome = "`finish` останавливается с причиной GitHub; другие способы слияния не пробуются."

[[path]]
title = "Агент завершил работу раньше слияния"
tag = "возобновление"
role = "actor"
when = "Сессия закончилась, а PR ждёт проверок."
outcome = "GitHub держит запрос сам; после слияния повторный `finish` довершает локальную сверку."

[example]
title = "Пример: задача с зелёным CI"
steps = [
  { text = "Разработчик закончил задачу и выполнил `finish`: изменение архивировано, PR открыт, auto-merge включён." },
  { text = "Обязательная проверка `validate` прошла на точной версии, GitHub слил PR." },
  { text = "Повторный `finish` сверил локальный `main` и закрыл карточку." },
]

[[guarantees]]
title = "Слияние привязано к версии"
text = "Запрос слияния защищён от сдвига версии. Защита ветки и обязательные проверки не обходятся."

[[guarantees]]
title = "Один поток"
text = "Платформа работает одной задачей за раз; очереди слияния нет."
