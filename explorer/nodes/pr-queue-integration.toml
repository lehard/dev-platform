id = "pr-queue-integration"
kind = "mechanism"
title = "PR, очередь и интеграция"
definition = "finish публикует PR точной версии; координатор по одному вливает свежий main, гоняет обязательный CI на итоговой версии и сливает с защитой от сдвига версии."
order = 8
role = "mechanism"
terms = ["pr", "coordinator"]
lead = "Команда `finish` публикует PR на точной версии задачи и передаёт его в очередь публикации. Дальше очередью управляет координатор: он берёт готовые кандидаты по одному, вливает в них свежий `main`, запускает обязательный CI на итоговой версии и сливает PR с защитой от сдвига версии."
thesis = "Проверка на базе задачи не заменяет проверку на итоговой версии. Слияние всегда привязано к точной проверенной версии, а ветка, открытый PR и зелёный CI остаются промежуточными состояниями до `MERGED`."
sources = [
  "docs/engineering/agent-workflow.md#Completion",
  "docs/engineering/agent-workflow.md#Source publication queue",
  "docs/engineering/agent-workflow.md#Candidate and integration contours",
  "openspec/specs/publication-queue/spec.md#Requirement: Ready candidates have durable ordered admission",
  "openspec/specs/publication-queue/spec.md#Requirement: Coordinator verifies the actual current-base candidate",
  "openspec/specs/publication-queue/spec.md#Requirement: Integration repairs real conflicts within a bound",
  "openspec/specs/publication-queue/spec.md#Requirement: Queue recovers to an unambiguous outcome",
  "openspec/specs/publication-queue/spec.md#Requirement: Coordinator configuration preflight",
]

[[used_in]]
stage = "publication-integration"
note = "finish, очередь, слияние"

[[inputs]]
title = "Кандидат разработчика"
text = "Ветка с выбранными проверками, протоколом проверки и friction-чекпоинтом, записанными на точной версии."
role = "stage"
node = "verification"
note = "← этап 5"

[[inputs]]
title = "Результаты заданий кандидата"
text = "Ревью, доработка и финализация подтверждают содержимое задачи для её текущей версии."
role = "mechanism"
node = "independent-review"

[[inputs]]
title = "Актуальный main"
text = "Защищённая ветка и обязательные проверки `validate`; ни то ни другое не обходится."
role = "external"

[[inputs]]
title = "Приложение координатора"
text = "Токен GitHub App ограничен текущим репозиторием и правами записи в содержимое и PR."
role = "external"

[action]
label = "finish → queue → merge"
title = "От публикации до слияния"
steps = [
  "`dogfood_task.py finish` публикует PR на точной версии, принимает его в очередь как `review-pending` и освобождает заявку разработчика; повторный приём той же версии не создаёт дубликата.",
  "Комментарий приёма записывает порядок, метки `publication:queued`, `publication:active` и `publication:blocked` показывают фазу, а `dogfood_task.py status` сообщает позицию и причину ожидания.",
  "Ревью, доработка и финализация проходят как задания кандидата, которые берут воркеры, и доказывают содержимое задачи.",
  "Контур интеграции вливает текущий `main`, если слияние чистое, запускает обязательный CI на итоговой версии и сливает PR с защитой от сдвига версии.",
  "После слияния `finish` довершает локальную сверку `main` и работу с карточкой управляемой задачи.",
]

[[outputs]]
title = "Слитый PR"
text = "GitHub сообщает для точного PR состояние `MERGED`, а локальный `main` затем сверяется; только после этого изменение доставлено."
role = "stage"
consumer = "→ этап 8"
node = "feedback-learning"

[[outputs]]
title = "Записи передачи"
text = "Каждый переход публикует версионированную запись: состояние, точная версия, привязки пройденных проверок, красная проверка, попытки и следующее задание."
role = "artifact"
consumer = "следующий исполнитель"

[[outputs]]
title = "Статус кандидата"
text = "`publication_queue.py status` показывает состояние, активное задание, красную проверку и следующее действие для PR или Requirement без изменений."
role = "artifact"
consumer = "оператор и агент"

[[outputs]]
title = "Блокировка с причиной"
text = "Кандидат с изменившейся версией, пересекающимся путём, конфликтом или упавшей проверкой получает метку `publication:blocked` и причину."
role = "gate"
consumer = "разработчик"

[cycle]
title = "Путь кандидата через очередь"

[[cycle.step]]
state = "review-pending"
text = "PR принят, задание на ревью опубликовано"
arrow = "→"

[[cycle.step]]
state = "finalize-pending"
text = "ревью и доработка завершены"
arrow = "→"

[[cycle.step]]
state = "ready"
text = "архив выполнен, кандидат ждёт очереди"
arrow = "→"

[[cycle.step]]
state = "integrating"
text = "координатор вливает main и ждёт обязательный CI"
emphasis = "mechanism"
arrow = "→"

[[cycle.step]]
state = "merged"
text = "GitHub сообщает слияние"

[[cycle.note]]
tag = "integration-repair-pending"
text = "Реальный конфликт или упавший обязательный CI создаёт задание интеграционной доработки; после ограниченного числа попыток кандидат блокируется."
role = "gate"

[[cycle.note]]
tag = "blocked-retryable"
text = "Недоступный ревьюер или исполнитель повторяют тот же круг, не тратя раунд."
role = "neutral"

[[cycle.note]]
tag = "blocked-escalation"
text = "Нужно решение человека или исправление, которое меняет содержимое задачи."
role = "actor"

[[path]]
title = "Кандидат заблокирован"
tag = "blocked"
role = "gate"
when = "PR получил метку `publication:blocked`: версия задачи изменилась, пересеклись пути с `main`, возник конфликт или упала проверка."
outcome = "причину показывает `dogfood_task.py status`; после нового коммита нужно повторить проверки и `finish`, а метки и комментарии очереди вручную не правят"

[[path]]
title = "Реальный конфликт или красный CI"
tag = "интеграционная доработка"
role = "gate"
when = "Слияние `main` конфликтует или обязательный CI на итоговой версии падает."
outcome = "создаётся задание интеграционной доработки; если оно меняет содержимое задачи, повторяются ревью и финализация, иначе прежние доказательства переиспользуются"

[[path]]
title = "Производные текущие спецификации"
tag = "учёт"
role = "mechanism"
when = "`main` изменил только пути текущих спецификаций, которые архив кандидата производит из его собственных дельт."
outcome = "координатор заново применяет архивные дельты к новой базе; это учёт, обязательные проверки всё равно запускаются, а неудача становится интеграционной доработкой"

[[path]]
title = "Не хватает входов координатора"
tag = "preflight"
role = "gate"
when = "Не задана переменная, пустой slug приложения или недостаточны права токена."
outcome = "preflight завершается кодом 2 и называет вход, значения по умолчанию не подставляются, секреты не печатаются"

[[path]]
title = "Агент завершил работу раньше слияния"
tag = "возобновление"
role = "actor"
when = "Сессия закончилась, а PR всё ещё в очереди."
outcome = "состояние восстанавливается из GitHub; после точного слияния повторный `finish` довершает локальную сверку и карточку"

[[path]]
title = "Новая версия в том же PR"
tag = "повторный приём"
role = "stage"
when = "Разработчик добавил коммит в тот же PR, пока кандидат ждёт ревью, доработки или решения."
outcome = "следующий `finish` принимает потомка заново и сохраняет пройденные проверки, если содержимое задачи не изменилось; закрывать PR и открывать новый нельзя"

[example]
title = "Пример: два независимых кандидата"
steps = [
  { text = "Два разработчика закончили задачи с непересекающимися путями и выполнили `finish`. Каждый PR получил позицию в очереди, а агенты свободны." },
  { text = "Ревью первого прошло без замечаний, и финализация архивировала изменение. Он стал ready.", emphasis = ["ready"] },
  { text = "Координатор берёт первый PR, вливает свежий `main` без конфликта и ждёт обязательный CI на итоговой версии. CI зелёный, PR сливается с защитой от сдвига версии." },
  { text = "Пока шло слияние, второй кандидат ждал. После слияния первого координатор готовит второй на новом `main`, а разработчику вручную сверяться и повторять полную проверку не нужно." },
  { text = "Когда GitHub сообщает MERGED для точного PR, `finish` довершает локальную сверку. Изменение доставлено только теперь.", emphasis = ["MERGED"] },
]

[[guarantees]]
title = "Один писатель на интеграции"
text = "Одновременно финальную интеграцию ведёт самое большее один кандидат, а рабочие копии разработчиков остаются независимыми."

[[guarantees]]
title = "Слияние привязано к версии"
text = "Слияние запрашивается с защитой от сдвига версии. Защита ветки, обязательные проверки и запрет принудительной записи остаются без изменений."

[[guarantees]]
title = "Проверка на итоговой версии"
text = "Проверки на базе задачи не заменяют обязательный CI на версии, влитой в актуальный `main`."

[[guarantees]]
title = "Очередь переживает сбой"
text = "Следующее действие выводится из текущего состояния PR, комментариев, меток, версии и проверок на GitHub, а не из памяти процесса."

[[guarantees]]
title = "Блок не останавливает очередь"
text = "Заблокированный кандидат не мешает интегрироваться следующим независимым готовым кандидатам."

[[guarantees]]
title = "Доверенный код"
text = "Workflow очереди для любого триггера исполняет код только из защищённой ветки по умолчанию и не запускает содержимое PR с токеном приложения."
