id = "immutable-tag"
kind = "term"
title = "неизменяемый тег"
definition = "Версия платформы выпускается как неизменяемый тег SemVer вида `v1.0.1`. Опубликованный тег никогда не перемещается и не используется повторно, поэтому проекты обновляются до точного состояния, а не до изменяемого `main`."
sources = [
