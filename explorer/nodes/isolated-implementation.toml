id = "isolated-implementation"
kind = "stage"
title = "Исполнение"
definition = "Агент работает в собственной ветке и рабочей копии. Заявки на файлы не дают двум агентам одновременно менять одно и то же."
order = 4
short_title = "Исполнение"
tagline = "изолированная работа"
children = ["worktrees", "executors"]
terms = ["worktree", "quick-task"]
lead = "Работа выполняется в отдельном worktree на собственной ветке, а не в интеграционной копии `main`. Управляемая задача реализует пакет OpenSpec по его пунктам, а quick task, небольшое изменение без Requirement, проходит этот этап по обычному пути задачи. При смене намерения, поведения или дизайна контракт обновляют первым."
thesis = "Параллельные агенты не должны делить изменяемое состояние. Поэтому у каждой задачи своя ветка и копия, а платформа не прячет, не сбрасывает и не очищает чужое состояние и не позволяет задаче занять чужой объём работ молча."
sources = [
  "docs/engineering/agent-workflow.md#Central source dogfood lifecycle",
  "docs/engineering/agent-workflow.md#Scope discipline and capabilities",
  "docs/engineering/openspec-workflow.md#No silent divergence",
  "openspec/specs/worktree-coordination/spec.md#Requirement: Concrete multi-agent scope claims are admission-controlled atomically",
  "AGENTS.md#Always-on invariants",
]

[[transitions]]
to = "verification"
type = "main"
reason = "Работа завершена, когда это доказано, а не когда закончились задачи"

[[inputs]]
title = "Записанный маршрут"
text = "Профиль и план исполнения определяют, работает ли дочерний исполнитель или текущая сильная сессия."
role = "stage"
node = "routing"
note = "← этап 3"

[[inputs]]
title = "Пакет OpenSpec"
text = "Контракт задачи: цель, дельта-спецификации, дизайн и порядок работы."
role = "artifact"
node = "add-openspec"
note = "openspec/changes/<change>/"

[[inputs]]
title = "Быстрая задача"
text = "Небольшое ясное изменение приходит прямо с этапа 1 и тоже работает на отдельной ветке с обычными проверками."
role = "stage"
node = "requirement-intent"
note = "← этап 1"

[[inputs]]
title = "Возврат с проверки"
text = "Упавшая проверка или существенное замечание ревью возвращают работу сюда на доработку."
role = "gate"
node = "verification"
note = "← этап 5"

[action]
label = "implement"
title = "Реализация в изолированной копии"
steps = [
  "Работать в worktree в каталоге `.claude/worktrees/<change>/`, созданном при старте задачи командой `start_managed_task.py`, не трогая интеграционную копию.",
  "В профиле `multi-agent` заявить файлы: пока другая активная задача владеет тем же конкретным файлом, новая получает `WAIT`.",
  "Реализовать пакет; если реализация меняет намерение, поведение, дизайн или зависимости, сначала обновить `proposal.md`, дельта-спецификации, `design.md` или `tasks.md`.",
  "Следить за свежестью командой `dogfood_task.py status`; при состоянии `behind` или `diverged` выполнить `reconcile`, обычное слияние без rebase и принудительной записи.",
]

[[outputs]]
title = "Ветка с изменением"
text = "Закоммиченное изменение в ветке задачи и актуальные артефакты OpenSpec."
role = "stage"
consumer = "→ этап 5"
node = "verification"

[[outputs]]
title = "Запись о выполнении"
text = "Для делегированной работы фиксируется, кто и как её выполнил, и результат проверки границы записи."
role = "artifact"
consumer = "проверка завершения"
node = "executors"

[[outputs]]
title = "Заявки на файлы"
text = "Локальная доска агентов показывает занятые файлы, поэтому параллельные задачи видят пересечения."
role = "artifact"
consumer = "соседние задачи"
node = "worktrees"

[[fork]]
title = "Развилка: может ли задача начать"
note = "Применяется в профиле `multi-agent`. Жёстким считается пересечение по точному конкретному файлу; общий каталог или подсистема остаются предупреждением."

[[fork.branch]]
name = "Старт"
code = "RUN"
role = "stage"
recognized = "Нет действующей активной задачи, которая владеет теми же конкретными файлами."
creates = "Задача атомарно занимает свои файлы и начинает реализацию."
next = "Реализация"

[[fork.branch]]
name = "Ожидание"
code = "WAIT"
role = "gate"
recognized = "Действующая активная задача уже владеет тем же конкретным файлом."
creates = "Диагностика называет соседнюю задачу и конфликтующий путь; ничего не перебазируется и не очищается."
next = "Повторить позже"
next_node = "worktrees"

[[fork.branch]]
name = "Подтверждённое пересечение"
code = "ack"
role = "actor"
recognized = "Оператор проверил, что общий конкретный файл намеренно безопасен."
creates = "Явное подтверждение записывает обе задачи, файлы и причину; оно не покрывает новые файлы."
next = "Реализация"

[[path]]
title = "Ветка отстала от main"
tag = "reconcile"
role = "actor"
when = "`dogfood_task.py status` сообщает `behind` или `diverged`."
outcome = "`reconcile` сливает свежий `main` обычным слиянием, отказывается от грязного или неоднозначного состояния, а проверки перед `finish` нужно повторить"

[[path]]
title = "В интеграционной копии лишнее"
tag = "отказ"
role = "gate"
when = "Запуск находит в интеграционной копии изменения вне одного проверенного пакета OpenSpec."
outcome = "запуск отказывается до создания состояния и ничего не прячет, не сбрасывает и не удаляет"

[[path]]
title = "Маршрут не записан"
tag = "блок"
role = "gate"
when = "Содержимое задачи изменено без записанного маршрута или делегирование не открыто."
outcome = "`status`, `finish` и запуск групп тестов отказывают; обхода нет, решение владельца записывается явной командой"

[[path]]
title = "Внешний стоп"
tag = "block и resume"
role = "actor"
when = "Работа действительно ждёт внешнего или человеческого решения."
outcome = "`managed_project_status.py block --reason` отмечает блокировку, а `resume` снимает её после решения"

[example]
title = "Пример: две задачи рядом"
steps = [
  { text = "Две управляемые задачи стартуют одновременно. Каждая получает свою ветку и свой worktree, например `agent/br-7-t2-<change>` и соседнюю." },
  { text = "Обе заявляют файл `template/scripts/_platform_common.py`. Первая получает RUN, вторая получает WAIT и видит, какая задача занимает файл.", emphasis = ["RUN", "WAIT"] },
  { text = "Первая реализует пакет в своей копии. Когда `main` уходит вперёд, `status` показывает `behind`, и `reconcile` вливает его обычным слиянием." },
  { text = "Вторая задача повторяет попытку позже: диагностика и подтверждение не требуют удалять файл из заявленного объёма." },
  { text = "Первая задача заканчивает реализацию. Дальше она не считается готовой, пока результат не доказан на этапе 5." },
]
