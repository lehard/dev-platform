id = "add-openspec"
kind = "mechanism"
title = "ADD и OpenSpec"
definition = "Существенное изменение сначала описывается как дельта архитектуры (ADD) и делится на намерения; каждое становится пакетом OpenSpec, который управляет реализацией, проверкой и архивом."
order = 2
role = "mechanism"
terms = ["add", "openspec"]
lead = "ADD, дельта архитектуры, описывает только новые или изменённые последствия требования для системы. Из утверждённого ADD получаются атомарные намерения (intents), а каждое намерение становится пакетом OpenSpec, который управляет реализацией, проверкой и архивом."
thesis = "ADD, intents и handoff это ограниченные свидетельства подготовки, а не второй бэклог и не контракт реализации. Когда появляется управляемый пакет OpenSpec, каноничен только он, и ADD с ним больше не синхронизируется."
sources = [
  "docs/engineering/agent-workflow.md#ADD -> Intents pre-authoring pipeline",
  "docs/engineering/openspec-workflow.md#Contract model",
  "dev-platform/capabilities/add-intents.md#When it applies",
  "dev-platform/capabilities/add-intents.md#What belongs in the ADD",
  "dev-platform/capabilities/add-intents.md#Intent decomposition",
  "dev-platform/capabilities/add-intents.md#Handoff to OpenSpec authoring",
  "docs/engineering/openspec-workflow.md#No silent divergence",
  "docs/engineering/openspec-workflow.md#Author the outcome contract",
]

[[used_in]]
stage = "specification"
note = "ADD, intents и пакет"

[[used_in]]
stage = "verification"
note = "сверка с контрактом"

[[used_in]]
stage = "publication-integration"
note = "архив и текущие спецификации"

[[inputs]]
title = "Business Requirement"
text = "Принятое бизнес-намерение: цели, поведение пользователя, правила, сценарии, ограничения и критерии приёмки."
role = "artifact"
node = "requirement-intake"
note = "← этап 1"

[[inputs]]
title = "Принятая система"
text = "Принятые спецификации, активные дельты, контекст проекта, код и тесты: то, что уже определяет часть решений и не подлежит новому выбору."
role = "source"

[[inputs]]
title = "Снимок свидетельств"
text = "Ограниченный переиспользуемый снимок источников проекта (Project Evidence Snapshot): оркестратор строит или переиспользует его, а ADD ссылается на него по дайджесту."
role = "artifact"

[action]
label = "ADD → intents → OpenSpec"
title = "Три ограниченных шага"
steps = [
  "ADD записывает только новые или изменённые существенные последствия относительно принятой системы; то, что уже определено требованием или действующим контрактом, используется как ограничение, а не как выбор.",
  "Утверждение `add_intents.py approve-add` привязано к дайджесту содержимого и отказывает, пока остаётся нерешённый существенный выбор или противоречие.",
  "`decompose` делит утверждённый ADD на атомарные intents; `validate-intents` проверяет покрытие, зависимости и отсутствие необъяснённых пересечений.",
  "`prepare-handoff` собирает ограниченный конверт для готового intent, и автор пишет пакет: `proposal.md`, дельта-спецификации, `design.md` и `tasks.md`.",
  "Реализация идёт по пакету; если меняются намерение, поведение, дизайн или зависимости, сначала обновляют соответствующий артефакт.",
  "После семантической проверки `openspec_lifecycle.py archive` архивирует изменение, и принятое поведение остаётся в `openspec/specs/`.",
]

[[outputs]]
title = "Пакет OpenSpec"
text = "Канонический контракт технической задачи: он управляет реализацией, проверкой и архивом, а ADD и intents больше с ним не сверяются."
role = "artifact"
consumer = "→ этап 3"
node = "routing"

[[outputs]]
title = "Вопрос человеку"
text = "Существенный нерешённый выбор, который нельзя определить по свидетельствам, выносится в один ограниченный контрольный вопрос."
role = "actor"
consumer = "владелец"

[[outputs]]
title = "Принятая спецификация"
text = "После архива поведение изменения становится частью `openspec/specs/` и ограничением для следующих изменений."
role = "artifact"
consumer = "следующие изменения"

[[fork]]
title = "Развилка: один intent или несколько в одном изменении"
note = "Решение принимает проверка расщепления OpenSpec: если существенная часть может быть принята, поставлена, проверена или откачена независимо, её выносят в отдельное изменение."

[[fork.branch]]
name = "Отдельное изменение"
code = "по умолчанию"
role = "mechanism"
recognized = "У intent есть независимый наблюдаемый результат, который можно принять и откатить отдельно."
creates = "Intent становится собственным пакетом OpenSpec со своим handoff."
next = "→ пакет OpenSpec"

[[fork.branch]]
name = "Общее изменение"
code = "--group-reason"
role = "gate"
recognized = "Несколько intents неразделимы: вместе они дают один результат, и по отдельности у них нет самостоятельного наблюдаемого итога."
creates = "Intents делят один пакет, а в handoff обязательно записано обоснование группы."
next = "→ пакет OpenSpec"

[[path]]
title = "Пробел в утверждённом ADD"
tag = "возврат"
role = "gate"
when = "При написании OpenSpec выясняется, что утверждённого ADD недостаточно или он должен существенно измениться."
outcome = "пробел возвращается в ADD и intents, а не решается молча в `proposal.md` или `design.md`"

[[path]]
title = "ADD изменён после утверждения"
tag = "устарело"
role = "gate"
when = "Существенное содержимое ADD изменилось после утверждения."
outcome = "`validate-add` отклоняет утверждение как устаревшее, и `approve-add` нужно выполнить заново"

[[path]]
title = "Источники или снимок изменились"
tag = "обновить"
role = "gate"
when = "У ADD изменились связанные источники или не доказана свежесть снимка, либо ADD не утверждён."
outcome = "`decompose` отказывается работать, пока ADD не обновлён и не утверждён заново"

[[path]]
title = "Конверт устарел"
tag = "пересчёт"
role = "gate"
when = "После подготовки конверта изменились ADD, набор intents или снимок."
outcome = "`validate-handoff` пересчитывает привязки по текущим файлам и объявляет конверт устаревшим, а не использует его молча"

[[path]]
title = "Ясное изменение без ADD"
tag = "пропуск"
role = "neutral"
when = "Изменение ограничено и полезной дельты проектирования нет."
outcome = "ADD и intents пропускаются, работа идёт сразу по обычному приёму задачи"

[[path]]
title = "Завершённое изменение осталось активным"
tag = "долг"
role = "gate"
when = "Задачи пакета отмечены, а изменение не архивировано."
outcome = "платформенный CI блокирует его как долг жизненного цикла: сначала проверка и архив через помощник"

[example]
title = "Пример: от ADD до принятой спецификации"
steps = [
  { text = "Требование меняет контракт событий между двумя подсистемами и владение записью. Это существенная дельта относительно принятой системы, поэтому агент составляет ADD.", emphasis = ["существенная дельта"] },
  { text = "Поведение «пользователь видит карточку вместо пошагового экрана» уже определено требованием, значит в ADD оно только ограничение. Вопрос, обязательно ли подтверждение необратимого действия, возвращается в Requirement как продуктовый." },
  { text = "ADD утверждён командой `approve-add`. `decompose` выделяет два intent с независимыми результатами, поэтому каждый получает собственный пакет OpenSpec." },
  { text = "Агент пишет `proposal.md`, дельта-спецификации, `design.md` и `tasks.md`. Во время реализации выясняется, что нужен ещё один сценарий; сначала обновляется дельта-спецификация, потом код.", emphasis = ["сначала обновляется дельта-спецификация"] },
  { text = "После семантической проверки и протокола архив переносит принятое поведение в `openspec/specs/`." },
]

[[guarantees]]
title = "Утверждение привязано к содержимому"
text = "Флаг `approved: true` сам по себе не является утверждением: оно записывается инструментом с дайджестом материального содержимого, и любое существенное изменение после этого делает его устаревшим."

[[guarantees]]
title = "Нет молчаливого расхождения"
text = "При изменении цели или объёма обновляют `proposal.md`, при изменении наблюдаемого поведения дельта-спецификации, технического подхода `design.md`, порядка работы и зависимостей `tasks.md`. Код не должен опережать контракт."

[[guarantees]]
title = "Одно изменение, одно намерение"
text = "Изменение OpenSpec должно иметь одно намерение, которое можно назвать одним предложением. Для нетривиального изменения в `proposal.md` явно записывают ожидаемый результат и критерии успеха, а также ограничения и нецели."

[[guarantees]]
title = "Никакого второго бэклога"
text = "ADD и intents не заменяют бэклог и не отслеживают реализацию. Для работы, которую представляет активное изменение OpenSpec, второй список задач не создаётся."
