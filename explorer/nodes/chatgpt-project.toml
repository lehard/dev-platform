id = "chatgpt-project"
kind = "part"
title = "Проект ChatGPT"
definition = "Тот же Requirement можно создать из проекта ChatGPT через подключённый GitHub, без локальной копии репозитория."
role = "external"
lead = "Проект ChatGPT обсуждает и записывает изменения для репозиториев платформы, но не имеет локальной копии репозитория. Для фиксации он использует подключённый GitHub и создаёт тот же Requirement, что и агент с копией."
thesis = "Это другой способ записи, а не другой смысл намерений. Адаптер создаёт то же представление Requirement и не подменяет его управляемым пакетом OpenSpec только потому, что не может запустить скрипт."
sources = [
  "docs/engineering/chatgpt-project-protocol.md#Connected-GitHub authoring",
  "docs/engineering/chatgpt-project-protocol.md#Project parameters",
]

[[used_in]]
stage = "requirement-intent"

[[inputs]]
title = "Просьба человека"
text = "Явная просьба зафиксировать, например «зафиксируй» или «добавь в бэклог»."
role = "actor"
node = "requirement-intent"
note = "← этап 1"

[[inputs]]
title = "Параметры проекта ChatGPT"
text = "`BACKLOG_REPOSITORY`, целевой репозиторий, метка `project:*` и `DEFAULT_PRIORITY`; для целевого репозитория без отслеживаемого `.dev-platform.toml` их выдаёт `requirement_intake.py routing-parameters`."
role = "source"

[[inputs]]
title = "Конфигурация целевого репозитория"
text = "Раздел `[development_backlog]` в `.dev-platform.toml` на ветке по умолчанию целевого репозитория: если он есть, он главнее объявленных параметров."
role = "source"
note = ".dev-platform.toml"

[action]
label = "connected GitHub"
title = "Фиксация без локальной копии"
steps = [
  "Определить маршрут: сначала `[development_backlog]` целевого репозитория с ветки по умолчанию, иначе объявленные параметры проекта.",
  "Убедиться, что у цели есть управляемые точки входа OpenSpec и Requirement и защищённая публикация; иначе остановиться и сообщить блокировку.",
  "Применить стандарт написания Requirement и найти среди открытых Issue бэклога существующий Requirement с тем же принятым результатом и целью.",
  "Создать Issue с меткой `type:requirement`, одной меткой `project:*`, одной меткой `priority:*` и разделами Outcome, Context, Acceptance evidence, Target repository и Exclusions.",
  "Прочитать Issue обратно, проверить метки и членство в проекте бэклога и остановиться.",
]

[[outputs]]
title = "Requirement в бэклоге"
text = "Тот же Issue, который создал бы агент с копией; его потом можно запустить командой `start` из репозитория."
role = "artifact"
consumer = "владелец и агенты"
node = "requirement-intake"

[[outputs]]
title = "Фиксация не подтверждена"
text = "Issue создан, но коннектор не смог подтвердить карточку в пользовательском проекте; второй Issue не создаётся."
role = "gate"
consumer = "оператор"

[[path]]
title = "Параметры расходятся"
tag = "конфликт"
role = "gate"
when = "Объявленные `PROJECT_LABEL` или `DEFAULT_PRIORITY` не совпадают с `[development_backlog]` целевого репозитория."
outcome = "фиксация останавливается, Requirement не создаётся"

[[path]]
title = "Поддержка не доказана"
tag = "стоп"
role = "gate"
when = "Нет доказательства управляемого процесса цели, нужного репозитория бэклога, допустимой метки проекта или приоритета."
outcome = "Requirement не создаётся, а блокировка сообщается пользователю"

[[path]]
title = "Карточка не подтверждена"
tag = "unconfirmed"
role = "actor"
when = "Коннектор не может записать пользовательский проект бэклога."
outcome = "Issue считается созданным, но фиксация не подтверждена; карточку добавляет оператор командой `reconcile-board`, а пользователя об этом не просят"

[[path]]
title = "Просьба выполнить"
tag = "передача"
role = "stage"
when = "Пользователь просит выполнить существующий Requirement."
outcome = "работу передают агенту с локальным репозиторием, который запускает `requirement_intake.py start`"

[example]
title = "Пример: фиксация из проекта ChatGPT"
steps = [
  { text = "Пользователь пишет в проекте ChatGPT: «зафиксируй: отчёты должны выгружаться в CSV». Проект объявил репозиторий бэклога, цель, метку проекта и приоритет." },
  { text = "Адаптер читает `[development_backlog]` цели с ветки по умолчанию, убеждается в поддержке управляемого процесса и ищет уже открытый Requirement с тем же результатом." },
  { text = "Дубликата нет, поэтому адаптер создаёт Issue с меткой `type:requirement`, одной меткой проекта, одним приоритетом и пятью разделами." },
  { text = "Адаптер читает Issue обратно и проверяет метки и членство в проекте. Карточка не подтверждена, поэтому фиксация отмечена как неподтверждённая, а оператор позже добавляет карточку командой `reconcile-board`.", emphasis = ["неподтверждённая"] },
  { text = "Адаптер останавливается: подготовка, OpenSpec и исполнитель не запускаются." },
]

[[guarantees]]
title = "Тот же формат"
text = "Метки, разделы, чтение обратно и членство в проекте проверяются так же, как у `requirement_intake.py create`; никакого отдельного формата задачи нет."

[[guarantees]]
title = "Нет обходного пути в OpenSpec"
text = "Отсутствие локальной оболочки не повод создавать управляемый пакет `managed-openspec:v1` вместо Requirement."
