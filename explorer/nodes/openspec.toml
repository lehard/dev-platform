title = "OpenSpec"
definition = "OpenSpec — внешний инструмент спецификаций. Пакет изменения в `openspec/changes/<change>/` состоит из `proposal.md` (цель и объём), дельта-спецификаций (наблюдаемое поведение), `design.md` (технический подход) и `tasks.md` (порядок работы); после архива принятое поведение живёт в `openspec/specs/`."
