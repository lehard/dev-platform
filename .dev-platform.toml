schema_version = 2
platform_version = "source"
platform_ci_ref = "source"
project_name = "dev-platform"
project_slug = "dev-platform"
main_branch = "main"
workflow_profile = "multi-agent"
harness_mode = "platform"
protected_main = true
publish_mode = "pr"
pr_merge_mode = "auto"
agent_tools = "claude,codex"
project_required_files = []
source_required_paths = [
  "scripts/dogfood_task.py",
  "scripts/source_adapter.py",
  "scripts/shared_workspace.py",
  "scripts/agent_doctor.py",
  "scripts/model_routing.py",
  "scripts/start_task.py",
  "scripts/managed_project_status.py",
  "scripts/finish_task.py",
  "scripts/reconcile_task.py",
  "scripts/openspec_lifecycle.py",
]

[capabilities]
openspec = true
github_sync = true
feature_branches = true
worktrees = true
agent_board = true
platform_git_lifecycle = true

[tools.openspec]
min_version = "1.6.0"
tested_version = "1.6.0"
verify_required = true

[tools.copier]
min_version = "9.17.0"
tested_version = "9.17.0"

[tools.rollout]
bot_login = "dev-platform-bot-lehard[bot]"

[model_routing]
enabled = true

[model_routing.codex]
routine_model = "gpt-5.6-terra"
standard_model = "gpt-5.6-terra"
complex_model = "gpt-5.6-sol"

[model_routing.claude]
routine_model = "haiku"
standard_model = "sonnet"
complex_model = "opus"

[promotion]
repo = "lehard/dev-platform"

[development_backlog]
repository = "lehard/development-backlog"
project_label = "project:dev-platform"
default_priority = "P2"
project_owner = "lehard"
project_number = 1

[paths]
worktrees = ".claude/worktrees"
agent_board = ".claude/agents-board.json"
main_merge_lock = ".claude/main-merge.lock"
pending_worktrees = ".claude/pending-worktrees.md"
friction_log = ".claude/agent-friction.jsonl"
friction_state = ".claude/agent-friction-state.json"
friction_reports = ".claude/reports/process-improvement"
checks = "dev-platform/checks.toml"
